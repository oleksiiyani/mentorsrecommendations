 поле вручну в конкретний слот — вісь, значення стовпчиків, значення лінії, легенда — а не покладайтесь на автоматичний розподіл.", "why": "У складних візуалізаціях автоматичне призначення ролей залежить від порядку натискання галочок і жодна послідовність не гарантує коректний результат — це створює «правильний вигляд, але неправильний сенс».", "example": "Комбінована діаграма, наповнена галочками, може відправити customer_id в «Легенду» замість «Значення лінії», через що графік виглядає завершеним, але показує геть не той розподіл, який планувався."}, {"id": "B02-M10-L20-02", "block": 2, "module": 10, "lessonNum": 20, "lessonTitle": "Основи налаштувань візуалізацій в Power BI", "topic": "Формат чисел на KPI-картках", "hw": "Модуль 10. ДЗ. Power BI — візуалізації", "type": "Помилка", "mistake": "Залишати числовий формат картки «як є» — з довільною кількістю знаків після коми або без округлення, замість того щоб явно задати потрібну точність.", "correct": "У блоці «Форматування візуалізації» для кожної картки задавайте формат числа з фіксованою кількістю знаків після коми (наприклад, 0.00) і перевіряйте, що округлення застосовано коректно, а не просто обрізає число.", "why": "Картки з довільною чи надмірною точністю виглядають неохайно і ускладнюють читання дашборду; для показників на кшталт середнього балу однакова кількість знаків після коми на всіх картках — ознака акуратно зробленого звіту.", "example": "Картка «Average Grade» без явного форматування може показати «7.833333», тоді як формат 0.00 коректно відображає «7.83» — однаково на всіх чотирьох картках модуля."}, {"id": "B02-M10-L20-03", "block": 2, "module": 10, "lessonNum": 20, "lessonTitle": "Основи налаштувань візуалізацій в Power BI", "topic": "Автосортування категорій і автомасштабування осі", "hw": "Модуль 10. ДЗ. Power BI — візуалізації", "type": "Помилка", "mistake": "Залишати стовпчикову діаграму з сортуванням за назвою категорії за замовчуванням і не перевіряти, чи не спотворює автомасштабування осі Y реальну різницю між значеннями.", "correct": "Сортуйте категорії за значенням показника (за спаданням чи зростанням, залежно від задачі), а не за алфавітом; для осі Y перевіряйте, чи починається шкала з нуля, коли потрібно коректно порівняти величини.", "why": "Сортування за назвою приховує реальний розподіл — топ- і аутсайдер-категорії губляться серед інших; автомасштабування осі перетворює незначні коливання на візуально «драматичну» різницю.", "example": "Стовпчикова діаграма «Average Grade by Subject», відсортована за алфавітом, ховає найкращий і найгірший предмет десь у середині списку; та сама діаграма, відсортована за спаданням оцінки, одразу показує лідера й аутсайдера."}, {"id": "B02-M10-L20-04", "block": 2, "module": 10, "lessonNum": 20, "lessonTitle": "Основи налаштувань візуалізацій в Power BI", "topic": "Матриця з деталізацією замість набору графіків", "hw": "Модуль 10. ДЗ. Power BI — візуалізації", "type": "Лайфхак", "mistake": "Будувати окремий графік для кожного рівня часової ієрархії (окремо по роках, окремо по місяцях, окремо по днях) замість одного керованого компонента.", "correct": "Використовуйте матрицю з увімкненою деталізацією (drill-down/drill-up) по ієрархії рік → місяць → день: один компонент дозволяє користувачу самому переходити між рівнями замість того, щоб тримати на аркуші кілька дублюючих графіків.", "why": "Матриця з деталізацією економить місце на аркуші, зменшує дублювання логіки і дає користувачу контроль над глибиною аналізу — це один із небагатьох інструментів, здатних замінити цілий звіт.", "example": "Матриця «Number of Grades by Subject Type» з деталізацією за calendar[Year] → calendar[Month] дозволяє клікнути на 2024 рік і одразу побачити розбивку по місяцях у межах цього року, без окремих графіків для кожного рівня."}, {"id": "B02-M11-L21-01", "block": 2, "module": 11, "lessonNum": 21, "lessonTitle": "Основи DAX в Power BI", "topic": "Обчислюваний стовпець vs міра для агрегатів", "hw": "Модуль 11. ДЗ. Power BI — DAX", "type": "Помилка", "mistake": "Створювати обчислюваний стовпець для показника типу «сума», «середнє» чи «частка», хоча такі агрегати повинні перераховуватись залежно від фільтр-контексту, а не фіксуватись на рівні рядка.", "correct": "Якщо формула має сенс лише в межах одного рядка (класифікація, лейбл, бінінг) — використовуйте calculated column; якщо формула описує «Total», «Avg», «Rate», «Growth» — це завжди explicit measure, яка перераховується від слайсерів.", "why": "Стовпець обчислюється один раз при оновленні даних і не реагує на фільтри — показник, зроблений стовпцем, «заморожується» і перестає відповідати на вибір користувача, хоча виглядає як звичайне число в таблиці.", "example": "Обчислюваний стовпець «Середній бал» у таблиці grades показав би те саме число незалежно від обраного класу в слайсері, тоді як міра Average Grade коректно перераховується для кожного вибору."}, {"id": "B02-M11-L21-02", "block": 2, "module": 11, "lessonNum": 21, "lessonTitle": "Основи DAX в Power BI", "topic": "Імплісітна міра замість службової таблиці _Measures", "hw": "Модуль 11. ДЗ. Power BI — DAX", "type": "Помилка", "mistake": "Перетягувати числове поле напряму на візуалізацію і покладатись на автоматичну агрегацію Power BI (імплісітну міру), замість того щоб створити явну (explicit) міру в окремій таблиці _Measures.", "correct": "Для кожного показника, що піде в кілька візуалізацій або має бізнес-сенс, створюйте explicit measure з зрозумілою назвою і зберігайте в службовій таблиці _Measures — так логіку видно, можна перевірити й повторно використати.", "why": "Імплісітна міра не існує як окремий об'єкт моделі — вона живе тільки всередині одного графіка й зникає разом із ним; змінити логіку одразу скрізь чи перевірити формулу пізніше стає неможливо.", "example": "Замість перетягування grade_value з автоматичною «Сумою» на картку створюють explicit measure Average Grade = AVERAGE(grades[grade_value]) в таблиці _Measures — тоді її можна використати і на картці, і в матриці, і на графіку."}, {"id": "B02-M11-L21-03", "block": 2, "module": 11, "lessonNum": 21, "lessonTitle": "Основи DAX в Power BI", "topic": "Row / Query / Filter context", "hw": "", "type": "Помилка", "mistake": "Дивуватись, що та сама формула дає різні числа на картці, в таблиці й на стовпчиковій діаграмі, не розуміючи, що кожна візуалізація формує власний контекст виконання.", "correct": "Перед тим як шукати «помилку» в мірі, перевірте три речі по черзі: чи є ітерація по рядках (row context), у якому розрізі побудована візуалізація (query context) і які слайсери й фільтри активні (filter context) — саме їх комбінація дає результат.", "why": "DAX не «ламається» випадково — одна й та сама формула коректно повертає різні значення, бо контекст щоразу інший; без розуміння цього механізму дебаг перетворюється на здогадки.", "example": "Міра Total Revenue на картці без слайсерів показує загальну суму за весь час, а та сама міра в таблиці, розбитій по місяцях, автоматично перераховується для кожного місяця окремо — це не дві різні формули, а один і той самий вираз у різному query context."}, {"id": "B02-M11-L21-04", "block": 2, "module": 11, "lessonNum": 21, "lessonTitle": "Основи DAX в Power BI", "topic": "VAR/RETURN для багатокрокових формул", "hw": "Модуль 11. ДЗ. Power BI — DAX", "type": "Лайфхак", "mistake": "Записувати багатокрокове бізнес-порівняння (наприклад, розрахунок відсоткової зміни місяць-до-місяця) одним вкладеним виразом без проміжних змінних.", "correct": "Виносьте кожен логічний крок обчислення в окрему змінну через VAR (наприклад, окремо — значення поточного місяця, окремо — попереднього), а фінальну формулу пишіть у RETURN, використовуючи вже готові змінні.", "why": "Формула без VAR/RETURN, записана одним рядком, стає нечитабельною вже за кілька днів навіть для автора; змінні дозволяють перевірити кожен крок окремо і зменшують ризик помилки в складному виразі.", "example": "Міра MoM_AG% зрозуміліша, коли VAR CurrentAvg = [Average Grade] та VAR PreviousAvg = [Previous Grade] обчислюються окремо, а RETURN DIVIDE(CurrentAvg - PreviousAvg, PreviousAvg) лише зводить готові значення в один результат."}, {"id": "B02-M11-L22-01", "block": 2, "module": 11, "lessonNum": 22, "lessonTitle": "Реалізація виразів DAX. Деталізація в Power BI", "topic": "ALL() знімає фільтри лише з зазначеного", "hw": "Модуль 11. ДЗ. Power BI — DAX", "type": "Помилка", "mistake": "Вважати, що ALL() усередині CALCULATE вимикає взагалі всі фільтри в мірі, хоча насправді він знімає обмеження лише з тієї колонки чи таблиці, яку йому явно передали.", "correct": "Явно вказуйте в ALL(), з якої саме таблиці чи колонки треба зняти фільтр (наприклад, ALL(grades[grade_type])), щоб міра ігнорувала тільки потрібний слайсер, а на решту фільтрів реагувала як завжди.", "why": "Показники в одному звіті часто мають відрізнятись саме тим, скільки фільтрів вони ігнорують — плутанина в обсязі ALL() призводить до міри, яка або надто «жорстко» зафіксована, або неочікувано реагує на фільтр, який мала ігнорувати.", "example": "Показники в одному звіті часто відрізняються саме тим, скільки фільтрів вони ігнорують — і ALL() масштабується на будь-яку кількість полів: можна зняти фільтр з одного стовпця (як у All Type Grades) або одразу з кількох (наприклад, Global Grades Count = CALCULATE([Total Grades], ALL(grades[grade_type]), ALL(grades[academic_year]), ALL(grades[department_hint])), яка через це не реагує взагалі ні на один слайсер). Плутанина в обсязі ALL() призводить до міри, яка або надто «жорстко» зафіксована, або неочікувано реагує на фільтр, який мала ігнорувати."}, {"id": "B02-M11-L22-02", "block": 2, "module": 11, "lessonNum": 22, "lessonTitle": "Реалізація виразів DAX. Деталізація в Power BI", "topic": "RANKX і «всі ранги = 1»", "hw": "", "type": "Помилка", "mistake": "Використовувати RANKX усередині вже відфільтрованого контексту (наприклад, у розрізі по одній категорії), не розуміючи, чому всі рядки одержують ранг «1».", "correct": "Оберніть таблицю в RANKX() у ALL() по тому полю, за яким має відбуватись порівняння (наприклад, RANKX(ALL(products[category]), [Revenue])), щоб ранжування порівнювало категорії між собою, а не кожну категорію саму із собою.", "why": "Query context у візуалізації, розбитій по категоріях, «показує» RANKX лише один рядок за раз — без ALL() порівнювати нема з чим, і ранг завжди виходить однаковим, хоча формула написана без синтаксичних помилок.", "example": "RANKX(products, [Revenue]) у таблиці, розбитій по category, поверне «1» для кожної категорії; RANKX(ALL(products[category]), [Revenue]) коректно розставить категорії від найприбутковішої до найменш прибуткової."}, {"id": "B02-M11-L22-03", "block": 2, "module": 11, "lessonNum": 22, "lessonTitle": "Реалізація виразів DAX. Деталізація в Power BI", "topic": "Поле «Деталізація» для drill-through", "hw": "Модуль 11. ДЗ. Power BI — DAX", "type": "Помилка", "mistake": "Створювати окремий аркуш для переходу (drill-through) з потрібними візуалізаціями, але забувати додати поле, за яким відбувається перехід, у блок «Деталізація» панелі полів — тоді пункт переходу просто не з'являється в контекстному меню.", "correct": "На аркуші-приймачі переходу обов'язково перетягніть ключове поле (наприклад, class_name або student_name) у блок «Деталізація» перед тим, як перевіряти перехід правим кліком на вихідному аркуші.", "why": "Без цього кроку Power BI не знає, за яким полем передавати фільтр-контекст під час переходу, тому пункт деталізації відсутній у меню, і вся підготовлена сторінка деталізації лишається непідключеною.", "example": "Аркуш Class Details з матрицею по класах і студентах не отримає пункту переходу з Class Performance, доки в панелі полів цього аркуша не додати class_name у розділ «Деталізація»."}, {"id": "B02-M11-L22-04", "block": 2, "module": 11, "lessonNum": 22, "lessonTitle": "Реалізація виразів DAX. Деталізація в Power BI", "topic": "CROSSFILTER лише для однієї міри", "hw": "", "type": "Лайфхак", "mistake": "Змінювати напрямок фільтрації на «В обидва боки» (Both) для всього звʼязку в моделі, щоб один конкретний розрахунок міг фільтрувати «у зворотному напрямку», хоча це впливає на продуктивність і поведінку всіх інших мір, що використовують цей звʼязок.", "correct": "Використовуйте CROSSFILTER() усередині CALCULATE() лише для тієї конкретної міри, якій дійсно потрібен зворотний напрямок фільтрації, залишаючи сам звʼязок у моделі односторонім.", "why": "Локальна зміна напрямку в одній мірі дає потрібний результат без ризику для решти звіту; глобальна зміна звʼязку на Both непередбачувано впливає на всі інші візуалізації, що використовують цю пару таблиць.", "example": "Щоб порахувати кількість унікальних учнів, які отримали оцінку з певного предмета, використовують CALCULATE(DISTINCTCOUNT(students[student_id]), CROSSFILTER(subjects[subject_id], grades[subject_id], Both)) лише в цій одній мірі, не чіпаючи налаштування звʼязку в моделі даних."}, {"id": "B02-M12-L23-01", "block": 2, "module": 12, "lessonNum": 23, "lessonTitle": "Вбудована аналітика в Power BI", "topic": "Агреговані точки vs сирі транзакції", "hw": "", "type": "Помилка", "mistake": "Порівнювати середню лінію з вкладки «Аналітика» (порахована по вже агрегованих точках графіка) з карткою, порахованою по сирих транзакціях, і вважати, що одна з цифр «неправильна».", "correct": "Перед тим як шукати помилку в розбіжності, з'ясуйте рівень деталізації кожного розрахунку: середня лінія на лінійному графіку рахується по денних (чи іншим агрегованим) точках, а картка може рахувати те саме середнє напряму по всіх транзакціях.", "why": "Обидва числа коректні, але відповідають на різні питання: «середнє значення дня» і «середнє значення транзакції» — це не одна й та сама метрика, навіть коли назва поля однакова.", "example": "Середня лінія на графіку показує «1292» (середнє по днях), а картка з тим самим полем — «567» (середнє по всіх транзакціях): дні з великою кількістю транзакцій «важать» більше в другому розрахунку."}, {"id": "B02-M12-L23-02", "block": 2, "module": 12, "lessonNum": 23, "lessonTitle": "Вбудована аналітика в Power BI", "topic": "Аналітичні лінії доступні не для будь-якого графіка", "hw": "", "type": "Помилка", "mistake": "Намагатися додати лінію тренду, прогноз чи виявлення аномалій до стовпчикової діаграми або графіка з категоріальною (не безперервною) віссю X і не розуміти, чому інструмент недоступний.", "correct": "Перш ніж шукати ці інструменти, перевірте: графік має бути лінійним або площинним, а вісь X — з типом «Безперервна» (дата чи число), інакше тренд, прогноз і виявлення аномалій просто не з'являються в списку.", "why": "Ці інструменти статистично мають сенс лише для впорядкованого в часі ряду; без безперервної осі Power BI не може побудувати регресію чи екстраполяцію, тому свідомо їх приховує, а не «ламається».", "example": "Лінія тренду доступна для лінійного графіка з `Calendar[Date]` на безперервній осі X, але зникає зі списку, якщо той самий графік перемкнути на стовпчикову діаграму або задати вісь як категоріальну."}, {"id": "B02-M12-L23-03", "block": 2, "module": 12, "lessonNum": 23, "lessonTitle": "Вбудована аналітика в Power BI", "topic": "Quick calculations — це не нова міра", "hw": "Модуль 12. ДЗ. Power BI — вбудована аналітика", "type": "Помилка", "mistake": "Думати, що «Показати значення як» → «% від загального підсумку» створює нову міру в моделі даних, хоча насправді це лише зміна інтерпретації вже агрегованого значення в конкретному візуалі.", "correct": "Розрізняйте: Quick calculations (режим «Показати значення як») ніколи не змінюють модель і не створюють нового поля — вони діють локально в одному візуалі; якщо потрібна міра, яку можна перевикористати в інших графіках, використовуйте Quick Measure або explicit measure.", "why": "Плутанина призводить до того, що аналітик шукає «нову міру» в панелі полів там, де її ніколи не було — режим інтерпретації живе лише всередині налаштувань конкретної візуалізації і не переноситься автоматично на інші графіки.", "example": "«% від загального підсумку», застосований до стовпчикової діаграми по країнах, показує частку кожної країни лише в цьому графіку; та сама метрика Revenue в іншій візуалізації й далі показує абсолютне число, поки там окремо не увімкнути той самий режим."}, {"id": "B02-M12-L23-04", "block": 2, "module": 12, "lessonNum": 23, "lessonTitle": "Вбудована аналітика в Power BI", "topic": "Перевіряйте Quick Measure ручною альтернативою", "hw": "Модуль 12. ДЗ. Power BI — вбудована аналітика", "type": "Лайфхак", "mistake": "Довіряти згенерованій Quick Measure (наприклад, «Підсумок від початку року») наосліп, не перевіряючи, чи відповідає її поведінка очікуванням бізнес-логіки.", "correct": "Після створення Quick Measure відкрийте її формулу в рядку формул, щоб побачити згенерований DAX, і для критичних показників додайте на той самий графік ручну альтернативу (наприклад, `TOTALYTD`) — значення мають повністю збігатися.", "why": "Quick Measure — це шаблон, який не завжди враховує специфіку саме вашої моделі (наприклад, логіку `ALL` проти `ALLSELECTED`); порівняння з ручною формулою — єдиний спосіб переконатися, що шаблон підійшов, а не просто «виглядає правдоподібно».", "example": "Швидка міра YTD для Average Grade додається на графік поруч із YTD_Manual = TOTALYTD([Average Grade], calendar[Date]) — якщо лінії співпадають у кожній точці, шаблону можна довіряти."}, {"id": "B02-M12-L24-01", "block": 2, "module": 12, "lessonNum": 24, "lessonTitle": "Дизайн, структура і керування дашбордом у Power BI", "topic": "Одна категорія — один колір на всіх сторінках", "hw": "", "type": "Помилка", "mistake": "Призначати різні кольори тій самій категорії на різних сторінках звіту (наприклад, «Іспит» — синій на одному аркуші і зелений на іншому) або використовувати забагато кольорів на одній сторінці без чіткого правила.", "correct": "Задавайте кольорову палітру один раз на рівні теми звіту (вкладка «Подання»), щоб кожна категорія автоматично мала однаковий колір на всіх сторінках, і використовуйте колір лише як спосіб кодування інформації, а не decorаtion.", "why": "Коли одна й та сама категорія міняє колір від сторінки до сторінки, користувач витрачає ресурси на повторне декодування замість аналізу змісту — це руйнує єдину візуальну мову, яку мала б давати тема.", "example": "Якщо `Average Grade` на аркуші Class Performance помаранчевий, а на Analytics & Time Intelligence — синій, користувач може вирішити, що це два різні показники, хоча формула та сама."}, {"id": "B02-M12-L24-02", "block": 2, "module": 12, "lessonNum": 24, "lessonTitle": "Дизайн, структура і керування дашбордом у Power BI", "topic": "Контекст — завжди перша зона зверху", "hw": "Модуль 12. ДЗ. Power BI — вбудована аналітика", "type": "Помилка", "mistake": "Розміщувати слайсери й фільтри довільно (внизу, збоку або впереміш з графіками) замість того, щоб виділити для них окрему зону у верхній частині сторінки.", "correct": "Дотримуйтесь послідовності «контекст → KPI → деталізація»: спочатку зверху розміщуйте слайсери (рік, тип оцінки, департамент), нижче — KPI-картки, і лише потім аналітичні графіки й таблиці.", "why": "Користувач сканує сторінку зверху вниз і зліва направо (Z/F-патерн); якщо він побачить графіки раніше, ніж зрозуміє, за якими фільтрами вони показані, він може неправильно інтерпретувати дані ще до того, як помітить активний слайсер.", "example": "Аркуш Analytics & Time Intelligence з трьома слайсерами (`grade_type`, `academic_year`, `department_hint`), розміщеними одним горизонтальним рядом угорі, одразу дає зрозуміти, у якому контексті показано графіки нижче — на відміну від слайсера, «загубленого» в кутку сторінки."}, {"id": "B02-M12-L24-03", "block": 2, "module": 12, "lessonNum": 24, "lessonTitle": "Дизайн, структура і керування дашбордом у Power BI", "topic": "Назва кнопки має відповідати її дії", "hw": "Модуль 12. ДЗ. Power BI — вбудована аналітика", "type": "Помилка", "mistake": "Створювати кнопку переходу з назвою чи іконкою, яка не відповідає реальній дії (наприклад, підпис «Деталі», а насправді кнопка веде на зовсім іншу сторінку), або не додавати кнопку повернення після переходу.", "correct": "Перевіряйте, що параметр Action кнопки (Page navigation, Drill-through, Back тощо) відповідає підпису й очікуванням користувача, і для кожного переходу передбачайте зворотний шлях — кнопку «Назад» або аналогічну навігацію.", "why": "Невідповідність назви й дії кнопки підриває довіру до інтерфейсу: користувач один раз натисне не туди, куди очікував, і почне сумніватися в усій навігації дашборду, а не лише в цій кнопці.", "example": "Кнопка «Докладно» на матриці аркуша Class Performance веде через drill-through на Class Details з передачею фільтра по класу, а на самому Class Details є кнопка «Назад», яка повертає на Class Performance зі збереженим контекстом."}, {"id": "B02-M12-L24-04", "block": 2, "module": 12, "lessonNum": 24, "lessonTitle": "Дизайн, структура і керування дашбордом у Power BI", "topic": "Зберігайте кастомну тему як JSON одразу", "hw": "", "type": "Лайфхак", "mistake": "Налаштовувати кольори, шрифти й стилі вручну на кожній новій сторінці чи в кожному новому звіті замість того, щоб один раз зберегти готову тему.", "correct": "Після першого налаштування теми через «Налаштувати поточну тему» одразу скористайтесь «Зберегти поточну тему», щоб отримати JSON-файл — його можна імпортувати в будь-який інший звіт і миттєво застосувати ту саму візуальну мову.", "why": "Повторне налаштування однакових кольорів і шрифтів вручну на кожному новому аркуші чи звіті — це витрата часу і ризик дрібних розбіжностей (наприклад, трохи іншого відтінку), які непомітно порушують узгодженість.", "example": "Тема, збережена у форматі `theme.json` після роботи над ДЗ модуля 10, імпортується одним кліком у звіт модуля 12 — усі нові сторінки одразу отримують ту саму палітру й шрифти без ручного повторення."}, {"id": "B02-M13-L25-01", "block": 2, "module": 13, "lessonNum": 25, "lessonTitle": "Знайомство з Tableau", "topic": "Дискретне/безперервне ≠ вимір/міра", "hw": "Модуль 13. ДЗ. Tableau — основи", "type": "Помилка", "mistake": "Одразу після підключення джерела даних виміри стають синіми, а міри — зеленими, тому цю пару кольорів легко сприйняти як ознаку «вимір = синій, міра = зелений» і переплутати з окремою класифікацією полів — дискретне/безперервне.", "correct": "Це дві незалежні пари понять: measure/dimension визначає роль поля (агрегується чи групує), а дискретне/безперервне — тип шкали (сині «таблетки» — окремі значення, зелені — діапазон). Будь-яке поле можна перетворити з дискретного на безперервне і навпаки незалежно від того, вимір воно чи міра — і це одразу змінює вигляд осі, сортування й доступні типи діаграм.", "why": "Випадкова зміна дискретності поля дати чи числового виміру — одна з найчастіших причин, чому графік «раптом» перестає групуватися по місяцях або втрачає очікуване сортування, хоча формула лишається правильною.", "example": "Поле дати за замовчуванням дискретне (синє) — Tableau групує підписи по місяцях у порядку зростання; перетворивши те саме поле на безперервне (зелене), ви отримаєте вісь з лінійною числовою шкалою дат замість акуратних підписів місяців."}, {"id": "B02-M13-L25-02", "block": 2, "module": 13, "lessonNum": 25, "lessonTitle": "Знайомство з Tableau", "topic": "Прихована агрегація SUM за замовчуванням", "hw": "", "type": "Помилка", "mistake": "Перетягуючи будь-яку числову міру на полицю Рядки чи Стовпці, легко не помітити, що Tableau автоматично агрегує її сумою (SUM) — і будувати висновки з графіка, думаючи, що там середнє чи медіана.", "correct": "Перевіряйте тип агрегації на самій «таблетці» поля (клік правою кнопкою → Measure → Sum/Average/Median/…) щоразу, коли додаєте нову міру, особливо перед тим як озвучувати висновок на основі графіка.", "why": "SUM і AVG для того самого поля можуть давати протилежні висновки — наприклад, регіон із найбільшою сумою продажів необовʼязково має найвищий середній чек; переплутана агрегація непомітно спотворює саме той висновок, заради якого будувався графік.", "example": "Стовпчик «Продажі по регіону» з SUM показує лідером регіон із найбільшою кількістю замовлень, а той самий графік з AVG може вивести на перше місце зовсім інший регіон із меншою кількістю, але дорожчими угодами."}, {"id": "B02-M13-L25-03", "block": 2, "module": 13, "lessonNum": 25, "lessonTitle": "Знайомство з Tableau", "topic": "Live vs Extract — вибір не тільки про швидкість", "hw": "", "type": "Лайфхак", "mistake": "Рішення між Live-зʼєднанням і Extract часто приймають інтуїтивно чи залишають за замовчуванням, не звʼязуючи його з тим, як часто оновлюються дані і чи потрібна робота офлайн.", "correct": "Live доречне для великих БД, що оновлюються часто і де важлива свіжість даних «просто зараз»; Extract — коли джерело статичне або оновлюється рідко, бо він швидший і дозволяє редагувати воркбук без підключення до джерела. У Tableau Server/Cloud до Extract додається ще й розклад автооновлення (Extract Refresh) — можливість, якої немає у файлах, підключених напряму Live до локальної БД без додаткової інфраструктури.", "why": "Неправильний вибір режиму — часта прихована причина «гальмування» воркбуку на великих датасетах або, навпаки, застарілих цифр на дашборді, який мав оновлюватися щодня.", "example": "Індикатор «Live» чи «Extract» видно одразу вгорі вікна джерела даних; для одноразово завантаженого файлу з historical-даними Extract майже завжди буде доречнішим вибором."}, {"id": "B02-M13-L25-04", "block": 2, "module": 13, "lessonNum": 25, "lessonTitle": "Знайомство з Tableau", "topic": "Tableau Public — не лише навчальний майданчик", "hw": "Модуль 13. ДЗ. Tableau — основи", "type": "Лайфхак", "mistake": "Tableau Public сприймають виключно як безкоштовний «тренажер» для домашніх завдань і не звертають уваги на те, що будь-який опублікований воркбук автоматично стає видимим і indexed у публічному пошуку Tableau Public.", "correct": "Ніколи не публікуйте на Tableau Public реальні конфіденційні дані компанії — навіть «навчальний» проєкт. Водночас варто свідомо використовувати цю публічність собі на користь: якісні воркбуки в профілі Tableau Public часто переглядають рекрутери й наймаючі менеджери як частину портфоліо аналітика.", "why": "Те, що починається як «просто ДЗ», за замовчуванням стає публічним артефактом у мережі — і ця відкритість може бути або репутаційним ризиком (за реальні дані), або конкурентною перевагою (за якісно оформлене портфоліо).", "example": "Пошук за назвою компанії чи типом датасету в Tableau Public нерідко видає навчальні воркбуки з незамінними ідентифікаторами реальних клієнтів — саме цього варто уникати, публікуючи лише знеособлені або навчальні дані."}, {"id": "B02-M13-L26-01", "block": 2, "module": 13, "lessonNum": 26, "lessonTitle": "Основні функції та інструменти в Tableau", "topic": "Дерево метрик для показника, що не розкладається", "hw": "", "type": "Помилка", "mistake": "Для кореневої метрики KPI tree намагаються намалювати «дерево», навіть коли показник не виражається через нижчі метрики чіткою формулою (сумою чи добутком) — і звʼязки між рівнями виходять довільними, без реальної математичної логіки.", "correct": "Якщо North Star не розкладається формулою, замість дерева варто будувати піраміду — ієрархічну схему впливу, де звʼязок між рівнями не обовʼязково прямий і не завжди виражений у формулах. Перш ніж малювати схему, перевірте: чи справді нижчі метрики в сумі чи добутку дають верхню?", "why": "Дерево метрик, видане за строгу формулу там, де її немає, вводить в оману щодо того, «на скільки процентів» зміна нижньої метрики вплине на верхню — хоча насправді залежність лише якісна.", "example": "`MAU` коректно розкладається деревом на нових + повторних + тих, хто повернувся (сума дає MAU); а показник на кшталт «Задоволеність продуктом» краще показати пірамідою впливу, а не деревом із формулами."}, {"id": "B02-M13-L26-02", "block": 2, "module": 13, "lessonNum": 26, "lessonTitle": "Основні функції та інструменти в Tableau", "topic": "ARPU переплутано з ARPPU", "hw": "Модуль 13. ДЗ. Tableau — основи", "type": "Помилка", "mistake": "ARPU і ARPPU відрізняються лише знаменником, тому їх легко переплутати: ARPU ділить дохід на всіх користувачів, а ARPPU — лише на тих, хто платить, і формулу для одного випадково будують за логікою іншого.", "correct": "Перед тим як писати обчислюване поле, зафіксуйте словами, який саме знаменник потрібен: «усі користувачі» → ARPU = MRR / Users; «лише платні» → ARPPU = Revenue / Paid Users. Тримайте окреме поле Paid Users Count саме для цього, а не рахуйте користувачів наліт.", "why": "Якщо платних користувачів у рази менше за загальну кількість, переплутана метрика відрізнятиметься в кілька разів і дасть невірне уявлення про середній чек саме платного клієнта — ключову метрику для монетизації.", "example": "`ARPPU = SUM([Revenue]) / [Paid Users Count]`, а не `SUM([Revenue]) / COUNTD([user_id])` по всій базі користувачів, включно з тими, хто ніколи не платив."}, {"id": "B02-M13-L26-03", "block": 2, "module": 13, "lessonNum": 26, "lessonTitle": "Основні функції та інструменти в Tableau", "topic": "LOD там, де вистачило б простої агрегації", "hw": "", "type": "Помилка", "mistake": "Побачивши приклади LOD-виразів (FIXED/INCLUDE/EXCLUDE), їх починають застосовувати за замовчуванням навіть для метрик, які прекрасно рахуються звичайним SUM чи COUNTD без жодної фіксації рівня деталізації.", "correct": "LOD виправданий лише тоді, коли потрібен розрахунок на рівні деталізації, відмінному від того, що представлений у візуалізації (наприклад, «дохід на одного клієнта» на графіку, де клієнтів не видно). Якщо міра рахується напряму з полів, які й так є в поданні — досить основного виразу.", "why": "Зайва LOD-обгортка ускладнює читання формули для будь-кого, хто відкриє воркбук після вас, і за неправильно обраного виміру фіксації може дати результат, що виглядає правдоподібно, але рахується не на тому рівні деталізації, який малося на увазі.", "example": "`Total Revenue = SUM([amount])` — простий вираз, без потреби в `{FIXED [user_id] : SUM([amount])}`, якщо на графіку й так немає розбивки по користувачах."}, {"id": "B02-M14-L27-01", "block": 2, "module": 14, "lessonNum": 27, "lessonTitle": "Просунуті функції Tableau", "topic": "Дата без літералу #", "hw": "", "type": "Помилка", "mistake": "У формулі з конкретною датою (референсна відсічка, фіксований поріг для порівняння) дату вписують як звичайний текст або число без спеціального позначення — і Tableau розпізнає значення неправильно.", "correct": "Дату в формулі завжди обрамляйте символом # — літералом дати, який працює як лапки для тексту. Без нього рядок може стати текстом, а число з крапками чи дефісами — перетворитися на плаваючу кому чи ціле число.", "why": "Помилка непомітна на перший погляд — формула не видає синтаксичної помилки, вона просто рахує з неправильним значенням, і виявити це можна лише звіривши результат вручну.", "example": "«25.03.1986» без # Tableau прочитає як число з плаваючою комою 0,00006042, а «1986-03-25» — як ціле число 1958; правильний запис — #3/25/1986#."}, {"id": "B02-M14-L27-02", "block": 2, "module": 14, "lessonNum": 27, "lessonTitle": "Просунуті функції Tableau", "topic": "CASE замість ланцюжка IF/ELSEIF", "hw": "", "type": "Лайфхак", "mistake": "Коли потрібно розкласти одне й те саме поле на кілька категорій (день тижня, діапазон значень, статус), пишуть довгий ланцюжок IF … ELSEIF … ELSEIF, повторюючи назву поля в кожній умові.", "correct": "Якщо перевіряється саме одне поле проти набору значень — використовуйте CASE <поле> WHEN <значення1> THEN … WHEN <значення2> THEN … END. Формула читається як таблиця відповідностей, а не як вкладена логіка.", "why": "CASE легше підтримувати й перевіряти на повноту (чи всі значення враховані), а вкладені IF/ELSEIF зі схожими умовами — типове джерело помилки, коли одну з гілок забувають оновити при зміні логіки.", "example": "Замість IF [Day]='Sun' THEN 0 ELSEIF [Day]='Mon' THEN 1 ELSEIF … — CASE [Day] WHEN 'Sun' THEN 0 WHEN 'Mon' THEN 1 … END."}, {"id": "B02-M14-L27-03", "block": 2, "module": 14, "lessonNum": 27, "lessonTitle": "Просунуті функції Tableau", "topic": "start_of_week змінює результат DATEDIFF", "hw": "", "type": "Помилка", "mistake": "Функції на кшталт DATEDIFF, DATENAME, DATEPART мають необовʼязковий параметр start_of_week — якщо його не вказати, Tableau використовує тижневі налаштування джерела даних чи локалі, і той самий розрахунок «різниці в тижнях» може дати різний результат на різних воркбуках.", "correct": "Для метрик, де важлива саме межа тижня (тижневий retention, тижневі когорти), явно задавайте start_of_week у формулі — 'monday' чи 'sunday' — замість того, щоб покладатися на дефолтне значення.", "why": "Дві дати, що потрапляють в один тиждень при одному значенні start_of_week, можуть опинитися в різних тижнях при іншому — і тижнева метрика «стрибає» без жодної зміни у вихідних даних.", "example": "DATEDIFF('week', #2013-09-22#, #2013-09-24#, 'monday') = 1, а DATEDIFF('week', #2013-09-22#, #2013-09-24#, 'sunday') = 0 — та сама пара дат, різний результат."}, {"id": "B02-M14-L28-01", "block": 2, "module": 14, "lessonNum": 28, "lessonTitle": "Побудова інтерактивних дашбордів в Tableau", "topic": "«Перша подія клієнта» без FIXED LOD", "hw": "", "type": "Помилка", "mistake": "Для будь-якої метрики типу «перша дата події клієнта» (перша покупка, перший вхід, перша оплата) дату намагаються визначити звичайним MIN() прямо на аркуші — без фіксації рівня деталізації за клієнтом.", "correct": "Такий розрахунок майже завжди потребує LOD-виразу {FIXED [ідентифікатор клієнта]: MIN([дата])} — так значення обчислюється незалежно від вимірів і фільтрів візуалізації, і кожен клієнт отримує саме свою першу дату, а не мінімальну дату по всій видимій вибірці.", "why": "Без FIXED LOD результат «перша дата» плаває залежно від того, які виміри та фільтри застосовані на аркуші — а це ламає будь-яку метрику, що будується на цьому патерні (нові vs. повторні клієнти, когортний аналіз, приріст бази).", "example": "First Event Date = {FIXED [client_id]: MIN([event_date])} — і лише потім порівнюйте цю дату з поточним місяцем чи роком для класифікації «новий/старий»."}, {"id": "B02-M14-L28-02", "block": 2, "module": 14, "lessonNum": 28, "lessonTitle": "Побудова інтерактивних дашбордів в Tableau", "topic": "Compute Using в неправильному напрямку", "hw": "", "type": "Помилка", "mistake": "Для Quick Table Calculation (Running Total, Percent of Total, Rank, Percent Difference From) параметр Compute Using лишають зі значенням за замовчуванням, не перевіряючи, чи рахує він «по рядку» (Across) чи «по стовпцю» (Down) — хоча логіка таблиці може вимагати протилежного.", "correct": "Перед застосуванням будь-якого Table Calculation явно виберіть Compute Using — Table/Pane/Cell та напрямок Across/Down/Across then down — виходячи з того, що саме має бути «сусіднім» значенням для порівняння: попередній стовпець чи попередній рядок.", "why": "Той самий тип обчислення з неправильним напрямком дає число, що виглядає правдоподібно (це справді відсоток чи ранг), але порівнює не ті елементи, які малося на увазі — помилку важко помітити без ручної перевірки кількох клітинок.", "example": "Percent Difference From з Compute Using = Table (Down) порівнює кожне значення з попереднім по стовпцю; якщо ж потрібне порівняння по рядку (наприклад, відносно першого місяця в кожній групі), обирайте Table (Across) + Relative to = First."}, {"id": "B02-M14-L28-03", "block": 2, "module": 14, "lessonNum": 28, "lessonTitle": "Побудова інтерактивних дашбордів в Tableau", "topic": "Cardinality «One» там, де значення повторюються", "hw": "", "type": "Помилка", "mistake": "Налаштовуючи Data Relationship між двома таблицями, у Performance Options для кардинальності обирають «One» (кожне значення унікальне), хоча насправді значення поля звʼязку в цій таблиці можуть повторюватися.", "correct": "Залишайте кардинальність «Many» (значення можуть повторюватися) за замовчуванням, якщо ви не впевнені на 100% в унікальності поля звʼязку. «One» варто вибирати лише тоді, коли точно відомо, що кожне значення трапляється в таблиці рівно один раз.", "why": "Хибне «One» змушує Tableau зʼєднувати таблиці до агрегації замість після — якщо значення насправді повторюються, у поданні зʼявляються задубльовані рядки, і суми та лічильники непомітно завищуються, хоча жодної помилки Tableau не покаже.", "example": "Таблиця «Клієнти» звʼязана з «Транзакціями» по client_id — з боку «Транзакцій» кардинальність майже завжди «Many» (один клієнт — багато транзакцій), навіть якщо з боку «Клієнтів» доречне «One»."}, {"id": "B02-M14-L28-04", "block": 2, "module": 14, "lessonNum": 28, "lessonTitle": "Побудова інтерактивних дашбордів в Tableau", "topic": "Коли Forecast не спрацює", "hw": "", "type": "Лайфхак", "mistake": "Перетягнувши інструмент Forecast на графік, іноді дивуються, чому він недоступний або не додається — і витрачають час на пошук помилки в даних, хоча причина суто структурна.", "correct": "Перед тим як додавати Forecast, перевірте візуалізацію на чотири обмеження: не більше одного виміру, немає неагрегованих значень чи формул, немає обрахунку відсотків, немає підсумків (Totals), і дати не агреговані до Exact Date. Forecast не спрацює, якщо порушено хоча б одну з цих умов.", "why": "Це заощаджує час на діагностику — замість того щоб підозрювати дані чи джерело, одразу перевіряєте структуру самої візуалізації.", "example": "Графік із двома вимірами (наприклад, регіон і категорія одночасно) не дасть додати Forecast, поки один із вимірів не прибрати з подання чи не звести розбивку до кольору замість окремої полиці."}, {"id": "B02-M15-L29-01", "block": 2, "module": 15, "lessonNum": 29, "lessonTitle": "Інструменти просунутої візуалізації в Tableau", "topic": "Вимкнений Include Zero", "hw": "", "type": "Помилка", "mistake": "Вісь легко лишити «як побудувалась автоматично», не перевіривши прапорець Include Zero в налаштуваннях Range, — тоді вісь стовпчикової діаграми починається не з нуля, а з довільного значення, і різниця між категоріями виглядає значно більшою, ніж є насправді.", "correct": "Для стовпчикових діаграм, де порівнюється абсолютна величина показників, тримайте Include Zero увімкненим (Edit Axis → General → Include Zero) — так висота стовпця відповідає дійсному співвідношенню значень.", "why": "Вісь без нуля — класична помилка візуалізації даних: вона підсилює візуальну різницю там, де реальна різниця може бути мінімальною, і вводить аудиторію дашборду в оману щодо масштабу змін.", "example": "Дохід $98 000 і $102 000 на осі без нуля (діапазон 95–105 тис.) виглядає як «стовпчик удвічі вищий»; з увімкненим Include Zero різниця в 4% читається коректно."}, {"id": "B02-M15-L29-02", "block": 2, "module": 15, "lessonNum": 29, "lessonTitle": "Інструменти просунутої візуалізації в Tableau", "topic": "Локальний фільтр замість глобального", "hw": "", "type": "Помилка", "mistake": "Додаючи фільтр на дашборд із кількох аркушів, легко лишити його застосованим «Only This Worksheet» (значення за замовчуванням для фільтра, доданого прямо з аркуша) — тоді решта візуалізацій на дашборді ігнорує вибір користувача.", "correct": "Відкрийте меню фільтра на дашборді → «Apply to Worksheets» і оберіть потрібний варіант: «All Using This Data Source» — щоб синхронізувати всі аркуші на тому самому джерелі даних, або «Selected Worksheets» — щоб обрати конкретні.", "why": "Дашборд, де фільтр впливає лише на один із кількох аркушів, виглядає зламаним для кінцевого користувача — він очікує, що вибір по всій панелі узгоджений між усіма графіками.", "example": "Фільтр за регіоном на дашборді з трьома аркушами — обираєте «All Using This Data Source», і зміна регіону одразу оновлює всі три візуалізації одночасно."}, {"id": "B02-M15-L29-03", "block": 2, "module": 15, "lessonNum": 29, "lessonTitle": "Інструменти просунутої візуалізації в Tableau", "topic": "Uniform axis range для порівнюваних графіків", "hw": "", "type": "Лайфхак", "mistake": "Розміщуючи на одному аркуші чи дашборді кілька схожих метрик (наприклад, Net і Gross Profit) з опцією «Independent axis ranges», можна отримати графіки, які виглядають однаково «високими», хоча реальні значення різняться в рази, — це вводить в оману під час порівняння.", "correct": "Якщо метрики порівнянні за масштабом і мають бути зіставними візуально, обирайте в Edit Axis → Range варіант «Uniform axis range for all rows or columns» — тоді всі підграфіки використовують один діапазон значень.", "why": "Порівняння кількох показників на однаковій шкалі — базова вимога чесної візуалізації; без Uniform range глядач підсвідомо порівнює висоту стовпців, а не реальні цифри.", "example": "Два стовпчики поруч — Net Profit $50К і Gross Profit $500К — з Independent range обидва виглядають «на всю висоту»; з Uniform range другий одразу видно вищим у 10 разів."}, {"id": "B02-M15-L29-04", "block": 2, "module": 15, "lessonNum": 29, "lessonTitle": "Інструменти просунутої візуалізації в Tableau", "topic": "Категоріальна палітра для теплової карти", "hw": "", "type": "Помилка", "mistake": "Для теплової карти (Heat map), де колір показує числове значення (наприклад, середній час активності), замість плавного градієнта інколи зʼявляється «веселкова» категоріальна палітра — зазвичай тому, що поле кольору випадково перетворене на дискретне, а не залишене безперервним.", "correct": "Для числового виміру кольору в тепловій карті переконайтесь, що поле безперервне (зелене) — тоді Tableau автоматично застосує континуальну (Sequential або Diverging) палітру-градієнт, яку додатково можна редагувати через Edit Colors.", "why": "Категоріальна палітра з довільними кольорами не передає «більше-менше» — глядач не може інтуїтивно зчитати, де на тепловій карті «гарячі», а де «холодні» зони, що зводить нанівець сенс цього типу візуалізації.", "example": "Sequential-палітра одного відтінку (наприклад, від світло- до темно-синього) для середнього часу активності дає очевидне «чим темніше — тим більше», на відміну від довільних кольорів категоріальної шкали."}, {"id": "B02-M15-L30-01", "block": 2, "module": 15, "lessonNum": 30, "lessonTitle": "Amplitude для продуктової аналітики", "topic": "Historical count для «першого разу»", "hw": "", "type": "Помилка", "mistake": "Коли когорта чи метрика визначається умовою «вперше виконали дію Х за певний період», подію нерідко фільтрують просто за датою в межах цього періоду — і у вибірку потрапляють також ті, хто виконував цю дію й раніше, а в цей період лише повторив її.", "correct": "Щоб визначити саме перше виконання дії за весь час спостережень, використовуйте параметр historical count у налаштуванні події — Amplitude враховує всю історію користувача, а не тільки обраний часовий діапазон.", "why": "Без historical count у «нову» когорту чи метрику потрапляють «старі» користувачі, і це спотворює все, що будується на цій вибірці — воронки, конверсію, retention.", "example": "Умова події з historical count = 1 та часовим діапазоном за обраний місяць — так вибірка охоплює лише тих, хто вперше зустрівся з цією дією саме в цьому місяці."}, {"id": "B02-M15-L30-02", "block": 2, "module": 15, "lessonNum": 30, "lessonTitle": "Amplitude для продуктової аналітики", "topic": "Event Totals замість Average", "hw": "", "type": "Помилка", "mistake": "Для метрики «середня кількість подій на користувача» в налаштуваннях Measured as обирають Event Totals — і отримують загальну кількість подій за період замість середнього значення на одного користувача.", "correct": "Event Totals рахує сумарну кількість подій, а не середнє. Для «в середньому на користувача» потрібен саме варіант Average.", "why": "Event Totals і Average дають кардинально різні числа та різну динаміку графіка — переплутавши їх, замість «скільки в середньому на людину» ви покажете «скільки всього подій», а це геть інший висновок для команди.", "example": "10 000 користувачів згенерували 40 000 подій за день — Event Totals покаже «40000», а Average — «4» (подій на користувача)."}, {"id": "B02-M15-L30-03", "block": 2, "module": 15, "lessonNum": 30, "lessonTitle": "Amplitude для продуктової аналітики", "topic": "Conversion замість Conversion over Time", "hw": "", "type": "Помилка", "mistake": "Коли потрібна динаміка конверсії воронки в часі (поденно, потижнево), тип візуалізації лишають як Conversion — він показує єдину підсумкову конверсію крок-у-крок за весь період, а не її зміну в часі.", "correct": "Для динаміки конверсії обирайте Conversion over Time — він показує, як змінюється конверсія в часі, причому можна дивитись як конверсію всієї воронки, так і окремого кроку.", "why": "Conversion і Conversion over Time відповідають на різні питання — «яка конверсія загалом» проти «як конверсія змінюється» — переплутавши типи, ви не покажете динаміку, яку від вас чекають.", "example": "Conversion показує «12% пройшли всю воронку за місяць»; Conversion over Time показує окрему точку конверсії на кожен день місяця."}, {"id": "B02-M15-L30-04", "block": 2, "module": 15, "lessonNum": 30, "lessonTitle": "Amplitude для продуктової аналітики", "topic": "Return On vs Return On or After у Retention", "hw": "", "type": "Помилка", "mistake": "Для візуалізації Retention обирають метод розрахунку навмання, не звертаючи уваги на різницю між «Return On» (повернення саме в конкретний день) і «Return On or After» (повернення в цей день або пізніше) — і отримують геть інший за формою графік, ніж очікували.", "correct": "Return On показує різкіше спадання (типова «крива відтоку»), Return On or After — плавнішу криву, оскільки враховує будь-яке повернення після стартової точки, а не лише в точний день. Обирайте метод відповідно до питання: «чи повернулись рівно тоді» чи «чи повернулись взагалі, рано чи пізно».", "why": "Той самий набір даних із різними методами розрахунку виглядає як «різке падіння retention» або як «стабільне утримання» — без розуміння різниці легко зробити протилежний висновок про здоровʼя продукту.", "example": "Якщо частина користувачів повертається на 3-й день замість 2-го, Return On (день 2) покаже їх як «тих, що не повернулись», а Return On or After — врахує це повернення."}, {"id": "B03-M16-L31-01", "block": 3, "module": 16, "lessonNum": 31, "lessonTitle": "Вступ в Python. Типи даних в Python", "topic": "is None замість == None", "hw": "", "type": "Помилка", "mistake": "Плутанина між = (присвоєння) та == (порівняння) — класична синтаксична пастка. Але навіть коли == вжито правильно, для перевірки на відсутність значення часто пишуть if value == None: — це працює, але вважається поганим стилем.", "correct": "Для порівняння з None завжди використовуйте оператор ідентичності: if value is None: / if value is not None:. None — єдиний об'єкт свого типу в Python, тому перевірка ідентичності і швидша (не викликає __eq__), і семантично точніша: вона питає \"чи це той самий об'єкт\", а не \"чи рівні значення\".", "why": "Якщо в даних трапиться кастомний об'єкт із перевизначеним __eq__, що повертає True для порівняння з None, конструкція == None може дати хибний результат, тоді як is None — ніколи. Це також стандарт стилю PEP 8, який очікують бачити в будь-якому професійному Python-коді.", "example": "value = None\nif value is None:      # правильно\n    print('Значення відсутнє')\nif value == None:       # працює, але не рекомендований стиль\n    print('Теж спрацює, та так писати не варто')"}, {"id": "B03-M16-L31-02", "block": 3, "module": 16, "lessonNum": 31, "lessonTitle": "Вступ в Python. Типи даних в Python", "topic": "Приведення \"брудних\" рядків до чисел", "hw": "", "type": "Помилка", "mistake": "Пряме застосування int() або float() до рядка, отриманого від користувача або з файлу, без урахування реального формату — наприклад рядка з комою замість крапки ('1200,50'), пробілами-роздільниками тисяч ('1 200') чи зайвими пробілами. Python не вгадує намір і одразу кидає ValueError.", "correct": "Перед приведенням типу очищати рядок під очікуваний формат: float(s.replace(',', '.').replace(' ', '')). Якщо джерело даних непередбачуване (ввід користувача чи зовнішній файл), обгортати перетворення в try / except ValueError, щоб некоректне значення не зупиняло всю програму.", "why": "Реальні дані майже ніколи не приходять у \"чистому\" канонічному вигляді, який показують на прикладах у документації. Українські джерела даних (експорти з Excel, форми, ручне введення) типово використовують кому як десятковий роздільник — і код, що працює на навчальних прикладах, впаде на першому ж реальному файлі.", "example": "raw = '1 200,50'\nclean = raw.replace(' ', '').replace(',', '.')\namount = float(clean)   # 1200.5\n\ntry:\n    price = float(input('Ціна: '))\nexcept ValueError:\n    print('Некоректний формат числа')"}, {"id": "B03-M16-L31-03", "block": 3, "module": 16, "lessonNum": 31, "lessonTitle": "Вступ в Python. Типи даних в Python", "topic": "Неявне приведення до bool і \"справжній нуль\"", "hw": "", "type": "Лайфхак", "mistake": "Використання скороченого запису if value: для перевірки \"чи є дані\" без урахування того, що число 0, порожній рядок і порожня колекція теж вважаються False. Якщо value — реальний вимірюваний показник, конструкція if sales: неправильно проігнорує день із нульовими продажами, ніби даних там не було взагалі.", "correct": "Коли 0 — легітимне значення показника, а не ознака \"даних немає\", перевіряти явно: if sales is not None: (перевірка на відсутність) окремо від if sales == 0: (перевірка на нульове значення). Скорочений запис if value: залишати лише там, де 0/порожньо і \"відсутньо\" дійсно означають одне й те саме.", "why": "В аналітичних задачах нуль — майже завжди значуща інформація (день без продажів, конверсія 0%), а не відсутність спостереження. Змішування цих двох станів через неявний bool — джерело тихих, важко знайдених помилок у розрахунках.", "example": "sales_by_day = {'Mon': 1200, 'Tue': 0, 'Wed': None}\n\nfor day, sales in sales_by_day.items():\n    if sales is not None:\n        print(f'{day}: {sales} грн')   # Tue: 0 грн теж виведеться\n    else:\n        print(f'{day}: даних немає')"}, {"id": "B03-M16-L31-04", "block": 3, "module": 16, "lessonNum": 31, "lessonTitle": "Вступ в Python. Типи даних в Python", "topic": "Множина/словник замість списку для перевірки входження", "hw": "", "type": "Лайфхак", "mistake": "Використання in на списку всередині циклу для перевірки, чи вже зустрічався елемент (наприклад, унікальні ID клієнтів) — на кожній ітерації Python лінійно перебирає весь список заново.", "correct": "Для повторюваної перевірки належності зберігати значення в set (або ключах dict), а не в list. Перевірка x in some_set виконується за практично сталий час завдяки хеш-таблиці, тоді як x in some_list — лінійний перебір.", "why": "Різниця непомітна на 10 елементах, але на тисячах записів (типовий розмір реального датасету) перевірка \"чи бачили ми вже цей ID\" у циклі на списку перетворює обробку з лінійної на квадратичну за часом — скрипт, що мав відпрацювати за секунду, може виконуватися хвилинами.", "example": "seen_ids = set()\nunique_orders = []\nfor order_id in all_order_ids:      # тисячі значень\n    if order_id not in seen_ids:    # O(1) завдяки set, а не O(n) як для list\n        seen_ids.add(order_id)\n        unique_orders.append(order_id)"}, {"id": "B03-M16-L31-05", "block": 3, "module": 16, "lessonNum": 31, "lessonTitle": "Вступ в Python. Типи даних в Python", "topic": "Порядок умов у if/elif для діапазонів", "hw": "", "type": "Помилка", "mistake": "Побудова ланцюжка if/elif для діапазонів у \"неправильному\" порядку — від ширшого до вужчого. Перевірка age < 65 до age < 18 призводить до того, що другий блок ніколи не виконається, бо будь-яке значення менше 18 вже задовольняє першу умову.", "correct": "Перевіряти умови від вужчого діапазону до ширшого. Для явних числових діапазонів зручніше й безпечніше використовувати ланцюгове порівняння Python: if 18 <= age < 65: замість двох окремих умов — коротше і унеможливлює саму помилку з порядком, бо межі діапазону видно в одному виразі.", "why": "Такий баг не кидає помилку і не завжди помітний одразу — код \"працює\", просто повертає неправильну категорію для частини значень. У звітах і сегментації користувачів це виливається у тихо спотворену статистику, яку важко відловити без окремого тестування межових значень.", "example": "age = 10\n\n# Неправильний порядок - другий елеф ніколи не спрацює\nif age < 65:\n    category = 'дорослий'\nelif age < 18:\n    category = 'неповнолітній'   # недосяжно\n\n# Правильно - ланцюгове порівняння, порядок не має значення\nif age < 18:\n    category = 'неповнолітній'\nelif 18 <= age < 65:\n    category = 'дорослий'\nelse:\n    category = 'пенсійний вік'"}, {"id": "B03-M16-L31-06", "block": 3, "module": 16, "lessonNum": 31, "lessonTitle": "Вступ в Python. Типи даних в Python", "topic": "Причина нескінченного циклу while", "hw": "", "type": "Помилка", "mistake": "Лічильник або умова циклу оновлюються лише в одній гілці внутрішнього if/else, а не на кожній ітерації while. Код виглядає коректно, але за певних вхідних даних потрапляє в гілку, де оновлення не відбувається, — і цикл виконується нескінченно.", "correct": "Перед написанням while явно сформулювати: що саме змінюється на кожній ітерації і коли це стає хибним. Розміщувати оновлення лічильника/стану поза умовними гілками, а не всередині кожної з них. Якщо кількість повторень відома заздалегідь, використовувати for — воно структурно не дає забути про оновлення.", "why": "Зависла комірка в Jupyter Notebook блокує ядро й змушує перезапускати весь ноутбук, втрачаючи стан попередніх обчислень. У продакшн-скрипті некерований нескінченний цикл — це зупинка пайплайна, яку доводиться діагностувати \"наосліп\" за відсутності виводу.", "example": "i = 0\ntotal = 0\n# Небезпечно: i збільшується лише в одній гілці\nwhile i < len(values):\n    if values[i] > 0:\n        total += values[i]\n        i += 1\n    # якщо values[i] <= 0 - i ніколи не зросте -> нескінченний цикл\n\n# Надійніше: оновлення поза умовою\ni = 0\nwhile i < len(values):\n    if values[i] > 0:\n        total += values[i]\n    i += 1   # виконається завжди, незалежно від умови"}, {"id": "B03-M16-L32-01", "block": 3, "module": 16, "lessonNum": 32, "lessonTitle": "Робота з колекціями. Знайомство з бібліотекою Pandas", "topic": "Евристика \"дієслово в назві методу = мутація\"", "hw": "", "type": "Помилка", "mistake": "Виклик методу на кшталт sort(), reverse(), update(), append() з наміром зберегти результат у нову змінну — result = my_list.sort(). Такі методи змінюють колекцію \"на місці\" і повертають None, тому result виявляється порожнім, а не відсортованим списком.", "correct": "Загальне правило для методів колекцій і Pandas: якщо назва методу — дієслово дії над самим об'єктом (sort, reverse, add, update, remove, clear), він, найімовірніше, мутує оригінал і повертає None. Якщо потрібен новий об'єкт — шукати окрему функцію (sorted() замість sort()) або передавати inplace=False.", "why": "Це не окремий випадок, а системна властивість дизайну Python і Pandas API, яка постійно повторюється — та сама пастка чекає на df.sort_values(), df.fillna(), df.dropna() з inplace=True. Розуміння принципу знімає цілий клас помилок, а не лише один конкретний випадок.", "example": "nums = [5, 1, 4, 2]\nresult = nums.sort()     # result = None !  nums вже відсортований на місці\nprint(result)             # None\nprint(nums)                # [1, 2, 4, 5]\n\nnums2 = [5, 1, 4, 2]\nresult2 = sorted(nums2)   # правильно: новий список, оригінал не змінено"}, {"id": "B03-M16-L32-02", "block": 3, "module": 16, "lessonNum": 32, "lessonTitle": "Робота з колекціями. Знайомство з бібліотекою Pandas", "topic": "Перевірка результату слайсингу .loc[]", "hw": "", "type": "Помилка", "mistake": "Очікування, що зріз за мітками .loc[start:stop] поверне ту саму кількість елементів, що й еквівалентний зріз за позиціями .iloc[] або звичайний слайсинг списку — і як наслідок, помилка \"на одиницю\" в подальших розрахунках.", "correct": "Пам'ятати, що .loc[] за мітками включає кінцеву межу, а .iloc[] і слайсинг Python — ні. Перевіряти фактичний результат через len() або .shape одразу після зрізу — особливо коли межі діапазону обчислюються динамічно.", "why": "Ця розбіжність — джерело помилок off-by-one, які найлегше пропустити саме тому, що код виконується без винятку: він просто повертає на один рядок більше або менше, ніж очікувалося, і це виявляється лише на етапі перевірки підсумкових цифр.", "example": "# lst - звичайний список, s - Series з тими самими мітками 0..4\nlst[1:3]        # [20, 30] - 2 елементи, 3 не включено\ns.loc[1:3]      # 3 елементи - мітка 3 включена\ns.iloc[1:3]     # 2 елементи - поводиться як список\n\nprint(len(s.loc[1:3]))   # завжди перевіряти фактичну довжину результату"}, {"id": "B03-M16-L32-03", "block": 3, "module": 16, "lessonNum": 32, "lessonTitle": "Робота з колекціями. Знайомство з бібліотекою Pandas", "topic": "Різниця множин для звірки даних між таблицями", "hw": "", "type": "Лайфхак", "mistake": "Для перевірки, які ID є в одній таблиці, але відсутні в іншій (звірка довідників, пошук \"осиротілих\" записів), використовують вкладені цикли з in на списках або навіть об'єднання (merge) там, де насправді потрібна лише перевірка належності.", "correct": "Перетворити стовпець ідентифікаторів кожної таблиці в set і скористатися операціями над множинами: різниця set(df1['id']) - set(df2['id']) миттєво дає значення, яких немає в другій таблиці; перетин & — спільні значення.", "why": "Звірка довідників (клієнти, товари, регіони) між джерелами даних — одна з найчастіших задач на початку будь-якого аналізу; уміння звести її до однієї операції над множинами економить і час написання коду, і час виконання на великих таблицях.", "example": "orphan_ids = set(orders_df['client_id']) - set(clients_df['client_id'])\ncommon_ids = set(orders_df['client_id']) & set(clients_df['client_id'])\nprint(f'Замовлення без картки клієнта: {len(orphan_ids)}')"}, {"id": "B03-M16-L32-04", "block": 3, "module": 16, "lessonNum": 32, "lessonTitle": "Робота з колекціями. Знайомство з бібліотекою Pandas", "topic": "Нестандартні аліаси бібліотек", "hw": "", "type": "Помилка", "mistake": "Імпорт стандартних аналітичних бібліотек під довільними, нестандартними іменами — наприклад import pandas as p або import numpy as n замість загальноприйнятих pd і np.", "correct": "Завжди використовувати спільнотні стандарти: pd для pandas, np для numpy, plt для matplotlib.pyplot, sns для seaborn — навіть у навчальних і чернеткових ноутбуках, а не лише у \"фінальному\" коді.", "why": "Ці аліаси настільки вкорінені, що офіційна документація й переважна більшість прикладів коду в інтернеті використовують саме їх. Нестандартний аліас ламає можливість швидко скопіювати готовий фрагмент коду з документації без ручного редагування і ускладнює читання коду для будь-кого іншого.", "example": "# Небажано - працює, але ускладнює читання і копіювання прикладів\nimport pandas as p\ndf = p.DataFrame({'a': [1, 2]})\n\n# Стандарт, який очікує вся спільнота\nimport pandas as pd\ndf = pd.DataFrame({'a': [1, 2]})"}, {"id": "B03-M16-L32-05", "block": 3, "module": 16, "lessonNum": 32, "lessonTitle": "Робота з колекціями. Знайомство з бібліотекою Pandas", "topic": "Неунікальний індекс після set_index", "hw": "", "type": "Помилка", "mistake": "Встановлення стовпця як індексу (set_index('name')) без перевірки, чи всі значення в ньому унікальні. Якщо є повтори, звернення df.loc['Ivan'] поверне не одну строку, а DataFrame з кількома рядками — код, написаний у розрахунку на одиничний результат, або впаде, або мовчки обробить не той рядок.", "correct": "Перед set_index() перевіряти унікальність кандидата на індекс: df['name'].is_unique або df['name'].duplicated().any(). Якщо унікальність не гарантована — залишати стандартний числовий індекс або використовувати складений ключ із кількох стовпців.", "why": "Ця помилка не проявляється одразу — код працює коректно на тестових даних без дублів і ламається лише на реальному датасеті, де збіг імен чи назв цілком можливий. Типовий приклад, коли робочий на вигляд код приховує крихку неявну умову.", "example": "df.set_index('name', inplace=True)\nprint(df['name'].duplicated().any())  # перевірити ДО встановлення індексу\n\nresult = df.loc['Ivan']    # Series, якщо 'Ivan' один;\n                            # DataFrame з кількома рядками, якщо є дублі"}, {"id": "B03-M16-L32-06", "block": 3, "module": 16, "lessonNum": 32, "lessonTitle": "Робота з колекціями. Знайомство з бібліотекою Pandas", "topic": "Роздільник і десятковий формат у CSV", "hw": "", "type": "Помилка", "mistake": "Читання pd.read_csv() з параметрами за замовчуванням для файлу, експортованого з Excel в українській/європейській локалізації, де стовпці розділені крапкою з комою (;), а дробова частина записана через кому (1234,56). Pandas за замовчуванням очікує кому як роздільник стовпців і крапку як десяткову — весь рядок потрапляє в один стовпець, а числа читаються як текст.", "correct": "Перед завантаженням подивитися на реальний роздільник або одразу вказати pd.read_csv(path, sep=';', decimal=','). Якщо роздільник невідомий заздалегідь — доручити його визначення pandas: sep=None, engine='python'.", "why": "Це одна з найчастіших причин, чому \"код із заняття працює, а мій файл — ні\": механіка read_csv однакова, але вхідні дані з реального українського джерела за замовчуванням у неанглійському форматі. Помилка непомітна — файл \"завантажується\" без винятку, просто з одним стовпцем замість очікуваних кількох.", "example": "# Файл з Excel (укр. локалізація): 'id;name;revenue\\n1;Kyiv;1200,50'\ndf = pd.read_csv('sales.csv')                        # 1 стовпець, дані як текст\ndf = pd.read_csv('sales.csv', sep=';', decimal=',')  # коректно розпізнані стовпці й числа"}, {"id": "B03-M17-L33-01", "block": 3, "module": 17, "lessonNum": 33, "lessonTitle": "Підготовка та очищення даних у Pandas", "topic": "Безпечний вибір через .loc при неявному сортуванні індексу", "hw": "", "type": "Помилка", "mistake": "Покладатися на діапазон .loc[a:b], коли числовий або текстовий індекс розташований у довільному порядку — результат залежить не від значень меж, а від фізичного порядку рядків у таблиці, тому зріз може мовчки повернути не ті записи, яких очікували.", "correct": "Якщо потрібні конкретні записи незалежно від їх розташування — передавати список міток (.loc[['a', 'b', 'c']]), а не діапазон-слайс: список працює однаково незалежно від порядку індексу. Якщо діапазон дійсно потрібен — спершу явно відсортувати індекс (sort_index()) або скинути його (reset_index()).", "why": "Ця помилка не кидає винятку — код виконується і повертає DataFrame, просто не той, що очікувався. Такі тихі помилки найважче знайти, бо все \"працює\".", "example": "df = pd.DataFrame({'val': [10,20,30,40,50]}, index=[3,1,2,5,4])\ndf.loc[2:4]              # непередбачувано - залежить від порядку рядків, а не від значень 2..4\ndf.loc[[2, 3, 4]]         # надійно - конкретні мітки, порядок індексу не має значення\n\ndf_sorted = df.sort_index()\ndf_sorted.loc[2:4]        # тепер діапазон дає очікуваний результат"}, {"id": "B03-M17-L33-02", "block": 3, "module": 17, "lessonNum": 33, "lessonTitle": "Підготовка та очищення даних у Pandas", "topic": "Пріоритет операторів & і | над порівнянням", "hw": "", "type": "Помилка", "mistake": "Написання умови фільтрації без дужок навколо кожного порівняння — df[df['a'] > 1 & df['b'] < 2]. Це не просто \"забуті дужки заради стилю\": оператор & у Python має вищий пріоритет, ніж > і <, тому вираз обчислюється в неправильному порядку і найчастіше кидає TypeError, а не дає логічно хибний результат.", "correct": "Завжди брати кожну окрему умову порівняння в круглі дужки перед побітовим оператором: df[(df['a'] > 1) & (df['b'] < 2)]. Це правило без винятків для будь-якої комбінації умов через &, |, ~.", "why": "Розуміння, що причина помилки — саме пріоритет операторів Python, а не \"забутий синтаксис Pandas\", економить час на відладці: помилка TypeError стає одразу зрозумілою, а не загадковою.", "example": "# Кине TypeError через пріоритет & над >/<\n# df[df['a'] > 1 & df['b'] < 2]\n\n# Правильно - кожна умова в дужках\ndf[(df['a'] > 1) & (df['b'] < 2)]"}, {"id": "B03-M17-L33-03", "block": 3, "module": 17, "lessonNum": 33, "lessonTitle": "Підготовка та очищення даних у Pandas", "topic": "Перевірка дублікатів перед видаленням", "hw": "", "type": "Лайфхак", "mistake": "Одразу викликати drop_duplicates() без попереднього перегляду, які саме рядки вважаються дублікатами і який із них буде збережено — рішення \"яку копію лишити\" приймається наосліп.", "correct": "Спочатку переглянути самі дублікати через df[df.duplicated(subset=..., keep=False)] — цей виклик поверне всі рядки-учасники дублюючих груп, і лише після візуальної перевірки застосовувати drop_duplicates() з усвідомленим вибором keep.", "why": "drop_duplicates() незворотно змінює дані при inplace=True; неправильний вибір keep (наприклад, 'first' замість 'last') може залишити застарілий запис замість актуального оновленого.", "example": "dupes = df[df.duplicated(subset='customer_id', keep=False)]\nprint(dupes.sort_values('customer_id'))   # переглянути всі варіанти перед рішенням\n\ndf_clean = df.drop_duplicates(subset='customer_id', keep='last')"}, {"id": "B03-M17-L33-04", "block": 3, "module": 17, "lessonNum": 33, "lessonTitle": "Підготовка та очищення даних у Pandas", "topic": "Контроль втрат при pd.to_datetime(errors='coerce')", "hw": "", "type": "Помилка", "mistake": "Застосувати pd.to_datetime(df['date'], errors='coerce') і одразу перейти до аналізу, не перевіривши, скільки значень перетворилося на NaT. Некоректний формат дати в частині рядків мовчки \"зникає\" з датасету.", "correct": "Порівнювати кількість пропусків до і після перетворення: before = df['date'].isna().sum(), потім after — і явно розглядати різницю as кількість втрачених записів, перш ніж продовжувати аналіз.", "why": "errors='coerce' — зручний спосіб не впасти на невідповідному форматі, але без перевірки обсягу втрат неможливо відрізнити пару побитих рядків від чверті датасету, що стала NaT через неправильний параметр format.", "example": "before_na = df['date'].isna().sum()\ndf['date'] = pd.to_datetime(df['date'], errors='coerce')\nafter_na = df['date'].isna().sum()\nprint(f'Втрачено дат при перетворенні: {after_na - before_na}')"}, {"id": "B03-M17-L33-05", "block": 3, "module": 17, "lessonNum": 33, "lessonTitle": "Підготовка та очищення даних у Pandas", "topic": "Розмноження рядків при merge() за неунікальним ключем", "hw": "", "type": "Помилка", "mistake": "Виконати merge() за ключем, не перевіривши, чи унікальний він в обох таблицях. Якщо ключ повторюється хоча б в одній із таблиць, Pandas мовчки виконує зʼєднання \"кожен з кожним\" для дублікатів — кількість рядків результату може виявитися більшою за суму вихідних таблиць, а подальші суми й середні — завищеними в кілька разів.", "correct": "Перед merge() перевіряти унікальність ключа: df['key'].is_unique. Ще надійніше — одразу передавати очікуваний тип звʼязку через параметр validate (наприклад, 'one_to_one' або 'many_to_one'): якщо припущення порушене, Pandas кине MergeError замість того, щоб мовчки розмножити рядки.", "why": "Розмноження рядків при merge() — одна з найнебезпечніших помилок в аналітичних пайплайнах, бо не кидає винятку і не завжди помітна на око: підсумкові метрики просто виявляються завищеними, і причину доводиться шукати вже post-factum.", "example": "# Якщо product_id повторюється в products - рядки orders розмножаться\nresult = orders.merge(products, on='product_id', validate='many_to_one')\n# MergeError підніметься одразу, якщо припущення 'один product - багато orders' порушене"}, {"id": "B03-M17-L34-01", "block": 3, "module": 17, "lessonNum": 34, "lessonTitle": "Агрегація, групування та сортування даних", "topic": "Підсумковий рядок margins — не \"середнє від середніх\"", "hw": "", "type": "Помилка", "mistake": "Інтерпретувати підсумковий рядок/стовпець margins=True у pivot_table() з aggfunc='mean' як просте середнє арифметичне вже показаних у таблиці середніх значень по комірках.", "correct": "Пам'ятати, що margins завжди рахується заново з вихідних, необагрегованих даних — тобто підсумкове середнє є середнім по всіх первинних записах, а не середнім видимих у таблиці чисел. Якщо потрібне саме \"середнє від середніх по групах\" — рахувати його окремим викликом.", "why": "Через нерівномірну кількість спостережень у різних комірках ці два числа майже завжди відрізняються — і звіт, де підсумок читають як \"середнє середніх\", передає невірний висновок далі, у презентацію чи рішення.", "example": "table = df.pivot_table(values='Ціна', index='Фрукт', columns='Колір',\n                        aggfunc='mean', margins=True, margins_name='Разом')\n# 'Разом' по кожному рядку - це середня ціна ВСІХ записів цього фрукта,\n# а не середнє арифметичне видимих у рядку значень по кольорах"}, {"id": "B03-M17-L34-02", "block": 3, "module": 17, "lessonNum": 34, "lessonTitle": "Агрегація, групування та сортування даних", "topic": "Перевірка вирівнювання при кастомній функції в transform()", "hw": "", "type": "Помилка", "mistake": "Передати у transform() власну функцію, яка повертає масив чи список у \"неправильному\" порядку (наприклад, після внутрішнього сортування), розраховуючи, що Pandas сам зіставить результат із вихідними рядками за змістом, а не за позицією.", "correct": "Переконатися, що кастомна функція в transform() повертає значення, вирівняні за тим самим порядком і довжиною, що й вхідна група — найнадійніше працювати через Series, що зберігає індекс групи. Перед використанням у реальному пайплайні перевірити функцію на невеликій тестовій групі з відомим правильним результатом.", "why": "Якщо вирівнювання порушене, transform() не кидає помилку — він просто підставляє значення не тим рядкам, і кожен подальший розрахунок на основі цього стовпця буде тихо неправильним.", "example": "def half_range(s):\n    return (s.max() - s.min()) / 2 + s   # повертає Series з тим самим індексом - безпечно\n\ndf['adj'] = df.groupby('group')['value'].transform(half_range)"}, {"id": "B03-M17-L34-03", "block": 3, "module": 17, "lessonNum": 34, "lessonTitle": "Агрегація, групування та сортування даних", "topic": "pivot_table() за замовчуванням замість pivot()", "hw": "", "type": "Лайфхак", "mistake": "Використовувати pivot() для \"чистих\" даних, де комбінації index/columns наразі унікальні, вважаючи агрегацію зайвою.", "correct": "Навіть коли дублікатів зараз немає, обирати pivot_table() як типовий інструмент за замовчуванням — вона поводиться ідентично до pivot() на унікальних даних, але не ламає пайплайн ValueError, якщо через кілька тижнів у джерело даних потрапить повторна комбінація.", "why": "Джерела даних змінюються — нове джерело, оновлена вивантаження чи людська помилка можуть додати дублікат у будь-який момент. Захисний вибір інструмента заздалегідь дешевший, ніж аварійне виправлення production-звіту, що раптово почав падати.", "example": "# Крихко - впаде, якщо з'явиться повторна комбінація Фрукт+Колір\ndf.pivot(index='Фрукт', columns='Колір', values='Ціна')\n\n# Стійкіше - агрегує дублікати автоматично, замовчуванням mean\ndf.pivot_table(index='Фрукт', columns='Колір', values='Ціна')"}, {"id": "B03-M17-L34-04", "block": 3, "module": 17, "lessonNum": 34, "lessonTitle": "Агрегація, групування та сортування даних", "topic": "UnsortedIndexError при слайсингу MultiIndex", "hw": "", "type": "Помилка", "mistake": "Спроба зробити зріз за діапазоном міток (.loc['A':'B']) на DataFrame з MultiIndex, який не був явно відсортований — на відміну від плоского індексу, де неправильний порядок мовчки дає невірний результат, тут Pandas одразу кидає UnsortedIndexError (або KeyError залежно від версії).", "correct": "Перед будь-яким слайсингом за діапазоном на MultiIndex викликати sort_index(). Якщо помилка вже виникла — це прямий сигнал зробити саме це, а не шукати проблему деінде.", "why": "На відміну від плоского індексу (де така сама проблема проходить тихо), тут помилка хоча б голосна: варто знати, що вона означає, щоб одразу застосувати правильні ліки, а не витрачати час на діагностику.", "example": "df_multi = df.set_index(['region', 'month'])\n# df_multi.loc['Kyiv':'Lviv']   # UnsortedIndexError, якщо індекс не відсортований\n\ndf_multi.sort_index(inplace=True)\ndf_multi.loc['Kyiv':'Lviv']     # тепер працює коректно"}, {"id": "B03-M18-L35-01", "block": 3, "module": 18, "lessonNum": 35, "lessonTitle": "Використання додаткових бібліотек. Функції в Python", "topic": "Мутабельний аргумент за замовчуванням у функції", "hw": "", "type": "Помилка", "mistake": "Оголосити параметр функції зі значенням за замовчуванням, яке є мутабельним обʼєктом — списком або словником: def add_tag(tag, tags=[]). Python створює цей список лише один раз, у момент визначення функції, а не при кожному виклику — тому всі виклики без явного аргументу tags діляться однією й тією самою прихованою колекцією, яка накопичує значення від виклику до виклику.", "correct": "Як значення за замовчуванням для мутабельних типів використовувати None, а сам обʼєкт створювати всередині тіла функції: def add_tag(tag, tags=None): tags = tags or []. Це правило без винятків для будь-якого мутабельного дефолту — списку, словника чи множини.", "why": "Ця помилка не проявляється при першому виклику функції — код \"працює\" на тестовому прикладі, а прихована накопичена поведінка виявляється лише через кілька викликів поспіль, коли результат раптово починає залежати від історії попередніх викликів.", "example": "# Небезпечно - список створюється один раз на всю 'історію' функції\ndef add_tag(tag, tags=[]):\n    tags.append(tag)\n    return tags\n\nprint(add_tag('a'))   # ['a']\nprint(add_tag('b'))   # ['a', 'b']  - несподівано, 'a' нікуди не зникло!\n\n# Правильно\ndef add_tag(tag, tags=None):\n    tags = tags or []\n    tags.append(tag)\n    return tags"}, {"id": "B03-M18-L35-02", "block": 3, "module": 18, "lessonNum": 35, "lessonTitle": "Використання додаткових бібліотек. Функції в Python", "topic": "global потрібен лише для перепризначення, не для зміни на місці", "hw": "", "type": "Помилка", "mistake": "Додавати global до функції, яка лише змінює вміст зовнішнього списку чи словника (.append(), .update(), list[i] = x) — розраховуючи, що без цього ключового слова зміна не застосується до зовнішнього обʼєкта.", "correct": "global потрібен лише тоді, коли функція повністю перепризначає зовнішню змінну новим значенням (counter = counter + 1). Якщо функція лише змінює вміст мутабельного обʼєкта, на який зовнішня змінна вже посилається (counter_list.append(1), settings.update({...})), звертання без global працює коректно.", "why": "Плутанина між цими двома випадками призводить або до зайвого й небезпечного використання global там, де воно не потрібне, або, навпаки, до помилкового висновку \"функція не може змінити зовнішні дані\", коли насправді може — просто не через переприсвоєння.", "example": "log = []\n\ndef track(event):        # global НЕ потрібен - змінюємо вміст, не перепризначаємо\n    log.append(event)    # це працює без global\n\ncounter = 0\ndef increment():\n    global counter        # global ОБОВ'ЯЗКОВИЙ - тут перепризначення\n    counter = counter + 1"}, {"id": "B03-M18-L35-03", "block": 3, "module": 18, "lessonNum": 35, "lessonTitle": "Використання додаткових бібліотек. Функції в Python", "topic": "zip() мовчки обрізає до найкоротшої колекції", "hw": "", "type": "Помилка", "mistake": "Складати таблицю зі стовпців через zip(col1, col2, col3), не перевіривши заздалегідь, що всі колекції мають однакову довжину. Якщо одна з них коротша, zip() не кидає помилку — він просто зупиняється на найкоротшій, і \"зайві\" значення з довших колекцій мовчки губляться.", "correct": "Перед zip() для збірки таблиці перевіряти рівність довжин: assert len(col1) == len(col2) == len(col3). Якщо потрібно навпаки явно побачити розбіжність — використовувати itertools.zip_longest(), який заповнює відсутні значення заповнювачем замість обрізання.", "why": "Втрата \"хвоста\" одного зі стовпців при зборці таблиці — тиха помилка: підсумкова таблиця виглядає цілком нормально, просто в ній менше рядків, ніж мало бути, і причину важко запідозрити без порівняння довжин вхідних даних вручну.", "example": "names   = ['Anna', 'Bohdan', 'Olena']\nrevenue = [187000, 94000]              # на один елемент коротший через баг вище\n\ntable = list(zip(names, revenue))\n# [('Anna', 187000), ('Bohdan', 94000)]  - 'Olena' мовчки випала, помилки немає\n\nassert len(names) == len(revenue), 'Довжини колекцій не збігаються'"}, {"id": "B03-M18-L35-04", "block": 3, "module": 18, "lessonNum": 35, "lessonTitle": "Використання додаткових бібліотек. Функції в Python", "topic": "np.random.seed() змінює глобальний стан генератора", "hw": "", "type": "Лайфхак", "mistake": "Викликати np.random.seed(42) один раз на початку ноутбука і покладатися на відтворюваність усіх наступних np.random-викликів у файлі — не враховуючи, що це глобальний стан, спільний для всього процесу: повторний запуск клітинок Jupyter не по порядку змінить цей стан і зробить результати неповторюваними навіть з тим самим seed на початку.", "correct": "Для ізольованої відтворюваності створювати окремий генератор через np.random.default_rng(seed=42) і використовувати саме його методи (rng.random(), rng.normal()) — такий генератор не залежить від глобального стану і не псується сторонніми викликами деінде в ноутбуці.", "why": "У Jupyter Notebook клітинки часто виконуються не по порядку під час дослідницької роботи — і глобальний np.random.seed() робить результат симуляції залежним від порядку запуску клітинок, а не лише від самого коду, що ускладнює відтворення результату колегою чи навіть собою через тиждень.", "example": "# Крихко - залежить від глобального стану і порядку виконання клітинок\nnp.random.seed(42)\nsample = np.random.normal(500, 100, 1000)\n\n# Надійніше - ізольований генератор, не залежить від решти ноутбука\nrng = np.random.default_rng(seed=42)\nsample = rng.normal(500, 100, 1000)"}, {"id": "B03-M18-L35-05", "block": 3, "module": 18, "lessonNum": 35, "lessonTitle": "Використання додаткових бібліотек. Функції в Python", "topic": "Статистична значущість — це не практична важливість", "hw": "", "type": "Помилка", "mistake": "Зупинятися на висновку \"p-value < 0.05, отже різниця значуща\" без оцінки розміру самого ефекту. При достатньо великій вибірці навіть тривіально мала різниця (наприклад, конверсія 3.10% проти 3.12%) стає статистично значущою, залишаючись бізнесово незначущою.", "correct": "Поруч із p-value завжди наводити розмір ефекту — абсолютну і відносну різницю між групами, а для t-тесту додатково враховувати стандартизований розмір ефекту (наприклад, Cohen's d). Рішення приймати на основі обох чисел одночасно: значущості й величини.", "why": "Звіт, що згадує лише p-value, легко веде до помилкових бізнес-рішень — впровадження зміни заради статистично \"доведеної\", але нікчемної за розміром різниці, або ігнорування великого практичного ефекту через недостатню вибірку і формально \"незначущий\" p-value.", "example": "t_stat, p_value = stats.ttest_ind(group_a, group_b, equal_var=False)\neffect_abs = group_b.mean() - group_a.mean()\neffect_rel = group_b.mean() / group_a.mean() - 1\n\nprint(f'p={p_value:.4f}, ефект: {effect_abs:.2f} ({effect_rel:+.1%})')\n# p < 0.05 і ефект +0.3% - статистично значуще, та варто зважити практичну цінність"}, {"id": "B03-M18-L36-01", "block": 3, "module": 18, "lessonNum": 36, "lessonTitle": "Використання додаткових бібліотек. Візуалізації", "topic": "Залишковий стан поточної фігури між клітинками Jupyter", "hw": "", "type": "Помилка", "mistake": "Побудувати графік у клітинці, а в наступній викликати ще один plt.plot() без попереднього plt.figure() — Matplotlib зберігає посилання на останній активний об'єкт Figure, і за певних сценаріїв (повторний запуск клітинок не по порядку) новий виклик домальовується поверх старого графіка, а не створює новий.", "correct": "Перед побудовою кожного нез

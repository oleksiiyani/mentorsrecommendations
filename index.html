<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рекомендації ментора — Data Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F1EFE8;
  --cream-2:#E8E6DF;
  --cream-3:#DEDDD3;
  --black:#0F0F0F;
  --black-2:#1A1A1A;
  --grey-700:#3D3D3D;
  --grey-500:#7A7A7A;
  --grey-300:#CFCFCF;
  --grey-100:#F4F4F4;
  --white:#FFFFFF;
  --orange:#F89557;
  --orange-2:#FF8A4D;
  --orange-soft:#FFC1A1;
  --orange-pale:#FFE6D6;
  --peach:#F8DAC9;

  --text:var(--black);
  --muted:var(--grey-500);
  --bg:var(--cream);
  --card:#FFFFFF;
  --border:var(--cream-3);

  --error-bg:#FFE9E5; --error-bd:#D9412C; --error-tx:#9C2A1A;
  --why-bg:#EAE8E0;   --why-bd:#3D3D3D;   --why-tx:#1A1A1A;
  --how-bg:#FFEEDF;   --how-bd:var(--orange);  --how-tx:#A35418;
  --ex-bg:#F4F2EA;    --ex-bd:#7A7A7A;    --ex-tx:#3D3D3D;
  --tip-bg:#FFE6D6;   --tip-bd:var(--orange-2); --tip-tx:#8A3A0F;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-anchor:none}
html{scroll-behavior:smooth}
body{
  font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
  line-height:1.6;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-weight:800;letter-spacing:-.025em;margin:0}

/* topbar */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(241,239,232,.92);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  padding:14px 0;
}
.topbar-inner{max-width:1280px;margin:0 auto;padding:0 20px;}
.topbar-bar{
  display:flex;align-items:center;gap:18px;width:100%;flex-wrap:wrap;
  background:var(--white);
  border-radius:999px;
  padding:10px 10px 10px 18px;
  box-shadow:0 1px 0 rgba(15,15,15,.04), 0 8px 20px rgba(15,15,15,.03);
}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--black)}
.logo .label{font-size:13.5px;color:var(--black);font-weight:800;letter-spacing:-.005em;line-height:1.2}
.logo .label small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-top:2px;color:#B75A22}
.blocks-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.blocks-tabs button{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:999px;
  background:transparent;color:var(--black);
  font-size:13px;font-weight:700;text-decoration:none;
  border:1px solid transparent;
  transition:all .15s;
  cursor:pointer;
  font-family:inherit;
}
.blocks-tabs button:hover:not(:disabled):not(.on){background:var(--cream)}
.blocks-tabs button.on{background:var(--black);color:var(--white)}
.blocks-tabs button .dot{width:7px;height:7px;border-radius:99px;background:currentColor;opacity:.35;flex:0 0 auto}
.blocks-tabs button.on .dot{opacity:1;background:var(--orange)}
.blocks-tabs button:disabled{color:var(--grey-300);cursor:not-allowed}
.blocks-tabs button .soon{font-size:9.5px;font-weight:700;color:var(--grey-300);text-transform:uppercase;letter-spacing:.08em}

/* layout */
.shell{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:30px;padding:28px 20px 90px}
aside.side{
  position:sticky;top:88px;align-self:start;
  height:calc(100vh - 110px);overflow-y:auto;
  padding-bottom:20px;
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;}
  aside.side{position:static;height:auto;overflow-y:visible;top:auto;}
}
@media (max-width:700px){
  .topbar-bar{
    border-radius:22px;
    flex-direction:column;
    align-items:flex-start;
    padding:14px 16px;
  }
  .blocks-tabs{margin-left:0;width:100%;}
  .blocks-tabs button{padding:8px 12px;font-size:12.5px;}
}
.side-title{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:0 10px 10px}
.side-list{display:flex;flex-direction:column;gap:3px;}
.side-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  border:none;background:transparent;text-align:left;
  padding:10px 12px;border-radius:12px;
  font-size:13.5px;font-weight:700;color:var(--black);
  cursor:pointer;font-family:inherit;
}
.side-item:hover:not(:disabled):not(.on){background:var(--white)}
.side-item.on{background:var(--black);color:var(--white)}
.side-item:disabled{color:var(--grey-300);cursor:not-allowed}
.side-item .soon{font-size:9px;font-weight:700;color:var(--grey-300);text-transform:uppercase;letter-spacing:.06em}
.side-item.on .soon{color:#8a8a8a}

.progress-card{
  margin-top:16px;padding:16px 18px;
  background:var(--white);border-radius:16px;
}
.progress-card .label{
  font-size:10.5px;color:var(--muted);font-weight:800;
  display:flex;justify-content:space-between;margin-bottom:9px;
  letter-spacing:.08em;text-transform:uppercase;
}
.progress-card .bar{height:7px;background:var(--cream);border-radius:99px;overflow:hidden}
.progress-card .fill{height:100%;background:var(--orange);border-radius:99px;transition:width .4s}

/* main */
main.content{min-width:0}

.module-banner{
  background:var(--black);color:var(--white);
  padding:30px 32px;border-radius:24px;
  position:relative;overflow:hidden;
  margin-bottom:28px;
}
.module-banner::after{
  content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;
  background:radial-gradient(circle, var(--orange) 0%, transparent 70%);
  opacity:.25;
}
.module-banner .tag{
  display:inline-flex;align-items:center;gap:8px;
  font-size:10.5px;letter-spacing:.18em;color:var(--black);font-weight:800;
  text-transform:uppercase;background:var(--orange);
  padding:6px 14px;border-radius:999px;position:relative;
}
.module-banner h2{
  margin:16px 0 6px;font-size:28px;line-height:1.1;color:var(--white);
  font-weight:800;letter-spacing:-.03em;position:relative;
}
.module-banner .desc{color:#CFCFCF;font-size:14.5px;margin:0;line-height:1.55;position:relative}

.toolbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  margin-bottom:26px;padding:12px 14px;
  background:var(--white);border-radius:16px;
}
.toolbar input[type="search"]{
  flex:1 1 220px;padding:9px 14px;border:1px solid var(--border);
  border-radius:999px;font-size:13.5px;background:var(--cream);font-family:inherit;
}
.toolbar select{
  padding:9px 14px;border:1px solid var(--border);border-radius:999px;
  font-size:13.5px;background:var(--cream);color:var(--text);font-family:inherit;
}
.toolbar .count{font-size:12px;color:var(--muted);font-weight:700;margin-left:auto}

.lesson-heading{
  display:flex;align-items:baseline;gap:10px;
  margin:36px 0 16px;padding-bottom:10px;
  border-bottom:2px solid var(--black);
}
.lesson-heading .lnum{font-size:12px;font-weight:800;color:var(--white);background:var(--black);padding:4px 10px;border-radius:999px;}
.lesson-heading h2{font-size:19px;color:var(--black)}

.cards{display:flex;flex-direction:column;gap:22px;}

.tip-card{
  background:var(--card);
  border-radius:20px;
  padding:22px 24px 24px;
  box-shadow:0 1px 0 rgba(15,15,15,.03), 0 10px 26px rgba(15,15,15,.04);
}
.tip-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  border-bottom:2px solid var(--black);
  padding-bottom:12px;margin-bottom:16px;
}
.tip-title{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.tip-id{font-size:10.5px;color:var(--grey-300);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-top:4px}
.tip-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  font-size:10.5px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;
  padding:6px 13px;border-radius:999px;
}
.badge.type-error{background:var(--black);color:var(--white)}
.badge.type-error .dot{width:6px;height:6px;border-radius:99px;background:var(--orange)}
.badge.type-lifehack{background:var(--orange);color:var(--black)}
.badge.hw{background:var(--cream-2);color:var(--grey-700);text-transform:none;letter-spacing:0;font-weight:700}

.callout{
  border-radius:14px;padding:14px 16px;margin-top:12px;
  border-left:4px solid;
}
.callout .chead{
  display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  margin-bottom:6px;
}
.callout .chead .mark{font-size:13px}
.callout p{margin:0;font-size:14px;line-height:1.55}

.c-error{background:var(--error-bg);border-color:var(--error-bd);color:var(--error-tx)}
.c-tip{background:var(--tip-bg);border-color:var(--tip-bd);color:var(--tip-tx)}
.c-how{background:var(--how-bg);border-color:var(--how-bd);color:var(--how-tx)}
.c-why{background:var(--why-bg);border-color:var(--why-bd);color:var(--why-tx)}
.c-ex{background:var(--ex-bg);border-color:var(--ex-bd);color:var(--ex-tx)}
.c-ex p{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12.6px;white-space:pre-wrap;word-break:break-word;
}

.empty-state{
  padding:50px 10px;text-align:center;color:var(--muted);
  background:var(--white);border-radius:20px;font-size:14px;font-weight:600;
}

footer.site-footer{
  max-width:1280px;margin:0 auto;padding:24px 20px 60px;
  text-align:center;color:var(--muted);font-size:12.5px;font-weight:600;
}
.brandmark{
  display:inline-flex;align-items:baseline;gap:10px;justify-content:center;
  flex-wrap:wrap;
}
.brandmark .word{
  font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--black);
  line-height:1;
}
.brandmark .tilt{
  display:inline-block;color:var(--orange-2);
  transform:skewX(-10deg);
  font-style:normal;
}
.brandmark .year{
  font-size:11.5px;font-weight:700;color:var(--muted);
  letter-spacing:.06em;
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-bar">
      <a href="#" class="logo">
        <span class="label">Рекомендації ментора<small>Data Analyst</small></span>
      </a>
      <nav class="blocks-tabs" id="blockNav"></nav>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="side">
    <div class="side-title">Модулі блоку</div>
    <div class="side-list" id="moduleNav"></div>
    <div class="progress-card">
      <div class="label"><span>Прогрес читання</span><span id="progressPct">0%</span></div>
      <div class="bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </aside>

  <main class="content">
    <div id="moduleBanner"></div>

    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Пошук по темі, помилці, прикладу…">
      <select id="typeFilter">
        <option value="all">Усі типи</option>
        <option value="Помилка">Тільки помилки</option>
        <option value="Лайфхак">Тільки лайфхаки</option>
      </select>
      <span class="count" id="resultCount"></span>
    </div>

    <div id="lessonsContainer"></div>
  </main>
</div>

<footer class="site-footer">
  <span class="brandmark"><span class="word">BETTER<span class="tilt">ED</span></span><span class="year">2026</span></span>
</footer>

ної послідовності змушує губити час на етапи, які в конкретній задачі не потрібні.", "example": "Іноді дані приходять вже очищеними (пропускаємо етап 3); іноді візуалізацію роблять ще до трансформації, щоб краще зрозуміти дані."}, {"id": "B01-M01-L02-01", "block": 1, "module": 1, "lessonNum": 2, "lessonTitle": "Структури даних, типи обʼєктів в структурованих даних", "topic": "Числові дані vs ідентифікатори", "hw": "Модуль 1. ДЗ. Google Форма для збору структурованих даних", "type": "Помилка", "mistake": "Вважати будь-яке поле з цифрами «числовим», не помічаючи, що номер клієнта чи SKU — це ідентифікатор, з яким не можна рахувати середнє чи суму.", "correct": "Перед підрахунком середнього/суми запитайте себе: чи має сенс середнє значення цього поля? Якщо ні — це ідентифікатор, а не число для розрахунків.", "why": "Середнє по ID непомітно потрапляє у звіт і підриває довіру до всього аналізу.", "example": "«Середній номер клієнта — 5843» — безглуздо; «середня ціна товару — 450 грн» — коректно."}, {"id": "B01-M01-L02-02", "block": 1, "module": 1, "lessonNum": 2, "lessonTitle": "Структури даних, типи обʼєктів в структурованих даних", "topic": "Порядкові дані", "hw": "Модуль 1. ДЗ. Google Форма для збору структурованих даних", "type": "Помилка", "mistake": "Обробляти рейтинг 1–5 зірок чи рівень освіти як звичайні числа й рахувати середнє, хоча відстань між рівнями нерівномірна.", "correct": "Для порядкових даних використовуйте медіану, моду або розподіл по категоріях замість середнього арифметичного.", "why": "«Середній рейтинг 3.4 зірки» звучить точно, але приховує реальний розподіл — наприклад, поляризацію на 1 і 5 зірках.", "example": "100 відгуків: 50×1 зірка і 50×5 зірок дають «середнє 3» — хоча жоден клієнт трійку не ставив."}, {"id": "B01-M01-L02-03", "block": 1, "module": 1, "lessonNum": 2, "lessonTitle": "Структури даних, типи обʼєктів в структурованих даних", "topic": "Формат дат", "hw": "Модуль 1. ДЗ. Google Форма для збору структурованих даних", "type": "Помилка", "mistake": "Записувати дати в одній колонці по-різному (04.11.2025, 2025-11-04, 4 листопада) — програма не може їх коректно порівнювати чи сортувати.", "correct": "Приводьте всі дати в таблиці до єдиного формату (наприклад, РРРР-ММ-ДД) одразу після збору, до будь-яких розрахунків.", "why": "Різні формати в одній колонці ламають сортування, фільтри та розрахунки різниці між датами.", "example": "`04.11.2025` і `2025-11-04` — це одна й та сама дата, але Google Sheets прочитає їх по-різному, якщо формат не уніфікований."}, {"id": "B01-M02-L03-01", "block": 1, "module": 2, "lessonNum": 3, "lessonTitle": "Google Sheets — збір та обробка інформації", "topic": "Способи імпорту даних (відкриття файлу vs IMPORTRANGE)", "hw": "Модуль 2. ДЗ. Google Spreadsheets — знайомство", "type": "Помилка", "mistake": "Плутати відкриття файлу через «Файл → Відкрити» (створює статичну копію) з IMPORTRANGE (створює живий звʼязок, що оновлюється автоматично) — і дивуватися, чому зміни в оригіналі не зʼявляються в копії.", "correct": "Перед імпортом визначте, чи потрібен разовий знімок даних, чи постійний живий звʼязок із джерелом, і обирайте метод відповідно до задачі.", "why": "Помилковий вибір методу призводить до роботи із застарілими даними без відома аналітика, що прямо впливає на правильність висновків.", "example": "Звіт «оновлюється щотижня», побудований на статичній копії, насправді показує дані на момент першого відкриття файлу, а не поточний стан."}, {"id": "B01-M02-L03-02", "block": 1, "module": 2, "lessonNum": 3, "lessonTitle": "Google Sheets — збір та обробка інформації", "topic": "Активні фільтри та неповні висновки", "hw": "", "type": "Помилка", "mistake": "Забувати, що ввімкнений фільтр лише приховує рядки, а не видаляє їх, і робити розрахунки, не помічаючи, що частина даних прихована.", "correct": "Після завершення аналізу вимикайте фільтр («Дані → Вимкнути фільтр»); памʼятайте, що звичайні формули над діапазоном враховують приховані рядки, якщо не використана функція FILTER.", "why": "Висновок на відфільтрованих (тобто неповних) даних виглядає як загальний, хоча описує лише частину вибірки — пряма дорога до хибних рекомендацій бізнесу.", "example": "Аналітик рахує середній чек, забувши, що фільтр показує тільки замовлення з одного міста, і подає це число як «середній чек по всій компанії»."}, {"id": "B01-M02-L03-03", "block": 1, "module": 2, "lessonNum": 3, "lessonTitle": "Google Sheets — збір та обробка інформації", "topic": "Сортування без виділення всього діапазону", "hw": "Модуль 2. ДЗ. Google Spreadsheets — знайомство", "type": "Помилка", "mistake": "Сортувати лише один виділений стовпець замість усього діапазону — рядки «розʼїжджаються», і кожен запис втрачає цілісність.", "correct": "Перед сортуванням завжди виділяйте весь діапазон даних, а не тільки стовпець, за яким сортуєте; для складніших випадків користуйтеся розширеними параметрами сортування.", "why": "Помилка непомітна одразу — таблиця виглядає нормально, але дані в ній уже перемішані неправильно, і виявити це можна лише порівнявши з оригіналом.", "example": "Відсортували тільки колонку «Сума» за спаданням — тепер найбільша сума стоїть навпроти імені зовсім іншого клієнта."}, {"id": "B01-M02-L03-04", "block": 1, "module": 2, "lessonNum": 3, "lessonTitle": "Google Sheets — збір та обробка інформації", "topic": "Числа, імпортовані як текст", "hw": "Модуль 2. ДЗ. Google Spreadsheets — знайомство", "type": "Помилка", "mistake": "Не перевіряти формат стовпця після імпорту й намагатися рахувати SUM/AVERAGE по колонці, де числа насправді збережені як текст.", "correct": "Після будь-якого імпорту перевіряйте формат кожного стовпця через «Формат → Число»; якщо числа записані текстом — приведіть їх функцією VALUE() перед розрахунками.", "why": "Формули типу SUM ігнорують текстові значення без помилки — тому проблема непомітна: результат просто занижений, а не позначений як помилка.", "example": "У колонці «Сума» значення виглядають як 1000, 1500, але SUM() по цій колонці повертає 0, бо всі значення насправді текстові."}, {"id": "B01-M02-L04-01", "block": 1, "module": 2, "lessonNum": 4, "lessonTitle": "Google Sheets - аналіз та презентація даних", "topic": "Вибір функції агрегації під тип даних", "hw": "Модуль 2. ДЗ. Google Spreadsheets — знайомство", "type": "Помилка", "mistake": "Застосовувати AVERAGE чи SUM до категоріальних даних (наприклад, рахувати «середню категорію товару») замість COUNTA, UNIQUE чи MODE.", "correct": "Обирайте функцію агрегації відповідно до типу даних: для числових — SUM/AVERAGE/MIN/MAX, для категоріальних — COUNTA/UNIQUE/MODE.", "why": "Агрегація не за типом даних дає технічно порахований, але безглуздий результат, який неможливо інтерпретувати для бізнесу.", "example": "MODE() по колонці «Місто» коректно покаже найпопулярніше місто; AVERAGE() по цій же колонці поверне помилку або безглузде число."}, {"id": "B01-M02-L04-02", "block": 1, "module": 2, "lessonNum": 4, "lessonTitle": "Google Sheets - аналіз та презентація даних", "topic": "Кругові діаграми з великою кількістю секторів", "hw": "Модуль 2. ДЗ. Google Spreadsheets — знайомство", "type": "Помилка", "mistake": "Будувати кругову діаграму на 8–10 і більше категорій, розраховуючи, що аудиторія легко порівняє розміри секторів і кольори.", "correct": "Обмежуйте кругову діаграму 5–6 категоріями максимум; для більшої кількості груп використовуйте стовпчикову діаграму, де порівняння довжини набагато точніше, ніж кутів.", "why": "Людина погано оцінює кути на око — сектори 5% і 7% виглядають майже однаково, а перевантажена кольорами діаграма взагалі втрачає сенс.", "example": "Кругова діаграма з 12 категоріями товарів перетворюється на «різнокольорову плутанину», де неможливо визначити навіть топ-3 без підписів."}, {"id": "B01-M02-L04-03", "block": 1, "module": 2, "lessonNum": 4, "lessonTitle": "Google Sheets - аналіз та презентація даних", "topic": "Лінійний графік замість діаграми розсіювання", "hw": "", "type": "Помилка", "mistake": "Зʼєднувати точки лінією (Line Chart), коли одному значенню X відповідає багато різних значень Y — це створює візуальний тренд там, де насправді просто розкид точок.", "correct": "Використовуйте Line Chart тільки якщо кожному X відповідає одне значення Y (наприклад, час); якщо досліджуєте звʼязок між змінними на рівні окремих спостережень — беріть Scatter Plot.", "why": "Зʼєднані лінією точки психологічно сприймаються як послідовна зміна в часі, навіть якщо це просто набір незалежних спостережень — це вводить аудиторію в оману.", "example": "Залежність «тарифна ставка → відпрацьовані години» для різних співробітників — це Scatter Plot (хмара точок), а не лінія, бо на одну ставку припадає багато різних значень годин."}, {"id": "B01-M02-L04-04", "block": 1, "module": 2, "lessonNum": 4, "lessonTitle": "Google Sheets - аналіз та презентація даних", "topic": "Аналіз у широкому форматі замість довгого", "hw": "", "type": "Лайфхак", "mistake": "Намагатися будувати зведену таблицю чи графік динаміки напряму по широкій таблиці (де кожен місяць — окрема колонка) і стикатися з тим, що інструменти аналізу не бачать це як одну змінну.", "correct": "Перед побудовою зведеної таблиці чи графіка перевірте, чи не варто спочатку перевести дані з широкого формату в довгий — це той самий принцип tidy data з Модуля 1.", "why": "Більшість аналітичних інструментів (зведені таблиці, графіки, Python, SQL) розраховані на довгий формат; широкий зручний тільки для візуального перегляду людиною.", "example": "Таблиця «оцінки студента по місяцях» у 12 колонках незручна для зведеної таблиці; переведена в довгий формат (колонки «Місяць» і «Оцінка») будується за секунди."}, {"id": "B01-M03-L05-01", "block": 1, "module": 3, "lessonNum": 5, "lessonTitle": "Продуктові метрики в Google Sheets", "topic": "Адресація формул при масштабуванні розрахунків", "hw": "", "type": "Помилка", "mistake": "Копіювати формулу з умовною агрегацією (SUMIFS, COUNTUNIQUEIFS) на весь діапазон, не зафіксувавши потрібні частини адреси символом $ — посилання на канал чи місяць «зʼїжджає», і розрахунок стає неправильним.", "correct": "Перед копіюванням формули на десятки рядків і стовпців визначте, яка частина адреси має лишатися незмінною (діапазон даних, заголовок каналу чи місяця), і зафіксуйте її відповідним типом адресації — відносною, абсолютною чи змішаною.", "why": "Помилка в адресації не викликає видиму помилку формули — вона просто тихо рахує не той канал чи не той місяць, і це важко помітити без ручної перевірки кожної комірки.", "example": "Формула =COUNTUNIQUEIFS(...,$C$2:$C$2001,B$1,...) з фіксованим рядком у B$1 при копіюванні вниз і вправо коректно підставляє потрібний канал; без $ канал підставлявся б неправильно вже на другому рядку."}, {"id": "B01-M03-L05-02", "block": 1, "module": 3, "lessonNum": 5, "lessonTitle": "Продуктові метрики в Google Sheets", "topic": "Activation Rate: від якої бази рахувати", "hw": "", "type": "Помилка", "mistake": "Рахувати Activation Rate то від усіх зареєстрованих, то від усіх, хто просто прийшов у продукт, не фіксуючи, яку саме базу використовує команда — це робить показник непорівнюваним між звітами.", "correct": "Перед розрахунком уточніть і зафіксуйте письмово, яка база є знаменником Activation Rate (усі зареєстровані чи всі, хто доєднався), і використовуйте однакову логіку в усіх звітах.", "why": "Той самий продукт може показати Activation Rate і 64%, і зовсім інше число — залежно від бази, а керівництво прийматиме рішення, порівнюючи цифри, які насправді порахували по-різному.", "example": "700 активованих із 1100 зареєстрованих = 64%; ті самі 700 активованих із 1500 усіх користувачів = 47% — і обидва числа «правильні», просто відповідають на різні питання."}, {"id": "B01-M03-L05-03", "block": 1, "module": 3, "lessonNum": 5, "lessonTitle": "Продуктові метрики в Google Sheets", "topic": "ARPU vs ARPPU", "hw": "", "type": "Помилка", "mistake": "Плутати ARPU (дохід на всіх користувачів) з ARPPU (дохід тільки на платних) і використовувати їх як взаємозамінні при оцінці монетизації.", "correct": "Використовуйте ARPU, коли оцінюєте ефективність усієї бази користувачів, і ARPPU — коли оцінюєте цінність саме платного сегмента чи ефективність монетизаційної воронки.", "why": "ARPPU завжди вище за ARPU, і якщо переплутати показники в презентації для інвесторів чи керівництва, продукт виглядатиме або значно кращим, або значно гіршим, ніж є насправді.", "example": "При 1500 користувачах і 200 платних із доходом 25 000 USD: ARPU = 16,7 USD, а ARPPU = 125 USD — різниця майже у 7,5 раза."}, {"id": "B01-M03-L05-04", "block": 1, "module": 3, "lessonNum": 5, "lessonTitle": "Продуктові метрики в Google Sheets", "topic": "Що вважати «поверненням» користувача", "hw": "", "type": "Лайфхак", "mistake": "Вважати, що будь-яка повторна поява користувача в даних (навіть через пів року) — це ознака гарного Retention, без прив'язки до конкретного періоду.", "correct": "Завжди визначайте Retention відносно чіткого періоду (день 1, день 7, місяць 1) і формуйте когорти за датою першої появи — так показник стає порівнюваним між періодами й каналами.", "why": "Без чіткого періоду «Retention 20%» нічого не означає — незрозуміло, це втримання за тиждень, місяць чи взагалі за весь час існування продукту.", "example": "«7-денний Retention впав з 60% до 15%» — конкретний і дієвий інсайт; «20% користувачів колись повернулися» — цифра, з якою неможливо працювати."}, {"id": "B01-M03-L06-01", "block": 1, "module": 3, "lessonNum": 6, "lessonTitle": "Основи статистичних розрахунків у Google Sheets", "topic": "Середнє без медіани", "hw": "", "type": "Помилка", "mistake": "Наводити в звіті тільки середнє значення, не перевіряючи медіану — і пропускати сильний перекіс розподілу через кілька екстремальних значень.", "correct": "Завжди розраховуйте середнє й медіану разом: якщо вони близькі — розподіл симетричний, якщо сильно розходяться — це сигнал перекосу чи впливу викидів.", "why": "Середнє чутливе до викидів, і один-два екстремальних значення можуть суттєво змістити його, тоді як медіана лишається стійкою — без цієї пари легко зробити хибний висновок про «типового» користувача.", "example": "Середня зарплата в компанії — 45 000 грн, але медіана — 28 000 грн: кілька високих зарплат керівництва «тягнуть» середнє вгору, а типовий співробітник отримує значно менше."}, {"id": "B01-M03-L06-02", "block": 1, "module": 3, "lessonNum": 6, "lessonTitle": "Основи статистичних розрахунків у Google Sheets", "topic": "Однакове середнє — не однакові дані", "hw": "", "type": "Помилка", "mistake": "Порівнювати дві групи тільки за середнім значенням і робити висновок, що вони «однакові», не перевіряючи розкид (дисперсію, стандартне відхилення) чи форму розподілу.", "correct": "Разом із середнім завжди дивіться на стандартне відхилення, IQR і, за можливості, гістограму чи боксплот — однакове середнє може ховати абсолютно різну стабільність результатів.", "why": "Дві групи з однаковим середнім балом можуть мати геть різну однорідність: в одній усі студенти близькі до середнього, в іншій — розкид від 15 до 100 балів; для бізнес-рішення це критична різниця.", "example": "Групи А і В мають однакове середнє ≈56,7, але дисперсія групи А (441) у вісім разів більша за групу В (53) — група В набагато передбачуваніша."}, {"id": "B01-M03-L06-03", "block": 1, "module": 3, "lessonNum": 6, "lessonTitle": "Основи статистичних розрахунків у Google Sheets", "topic": "Викиди: видаляти чи досліджувати", "hw": "", "type": "Помилка", "mistake": "Автоматично видаляти всі значення, що потрапили за межі правила 1,5×IQR, вважаючи їх «поганими даними», не розбираючись у причині.", "correct": "Перед видаленням викиду зʼясуйте його природу: це помилка введення даних чи реальна, хоч і рідкісна, подія. Видаляйте лише перше, друге — досліджуйте окремо.", "why": "Викид-помилка спотворює аналіз, а викид-подія часто є найціннішим інсайтом (наприклад, VIP-клієнт чи вірусний сплеск) — сліпе видалення може прибрати саме те, що варто було б помітити.", "example": "Одне замовлення на 50 000 грн серед замовлень по 500 грн може бути або опискою в даних (500 000 замість 50 000), або реальною оптовою угодою — перевірка джерела дає різні висновки."}, {"id": "B01-M03-L06-04", "block": 1, "module": 3, "lessonNum": 6, "lessonTitle": "Основи статистичних розрахунків у Google Sheets", "topic": "Один показник розкиду замість трьох рівнів", "hw": "", "type": "Лайфхак", "mistake": "Обмежуватись тільки розмахом (min/max) для опису розкиду даних, хоча він показує лише крайні точки й нічого не каже про основну масу значень.", "correct": "Комбінуйте три рівні опису розкиду: розмах (min/max) для крайніх меж, стандартне відхилення для типового відхилення від середнього, і IQR для стійкої до викидів картини «центральних» 50% даних.", "why": "Кожен з цих показників по-своєму «бреше» наодинці: розмах перебільшує вплив однієї екстремальної точки, стандартне відхилення теж чутливе до викидів — тільки разом вони дають надійну картину.", "example": "Розмах групи А (15–100) виглядає катастрофічно, але IQR (25,75) показує, що основна маса студентів насправді зосереджена в не такому вже широкому діапазоні — крайні точки це поодинокі випадки."}, {"id": "B01-M04-L07-01", "block": 1, "module": 4, "lessonNum": 7, "lessonTitle": "Основи роботи з текстом. Обʼєднання таблиць", "topic": "Точний vs приблизний збіг у VLOOKUP", "hw": "Модуль 4. ДЗ. Текст, дати, когортний аналіз", "type": "Помилка", "mistake": "Залишати останній аргумент VLOOKUP/HLOOKUP порожнім або вказувати TRUE, розраховуючи на точний збіг, хоча TRUE вмикає пошук найближчого меншого значення у відсортованих даних.", "correct": "Завжди вказуйте четвертим аргументом FALSE (або 0) для VLOOKUP/HLOOKUP, коли шукаєте точний збіг — це майже завжди потрібно в задачах обʼєднання таблиць за ключем.", "why": "З TRUE формула не видасть помилку навіть на неправильних даних — вона просто підставить значення з іншого рядка, і помилка непомітна, поки хтось не перевірить результат вручну.", "example": "VLOOKUP(B1, A:C, 3) без четвертого аргументу шукає ID клієнта 205, якого немає в таблиці, і замість помилки підставляє дані клієнта 200 — рахунок піде не тому клієнту."}, {"id": "B01-M04-L07-02", "block": 1, "module": 4, "lessonNum": 7, "lessonTitle": "Основи роботи з текстом. Обʼєднання таблиць", "topic": "Вибір функції пошуку для змінних таблиць", "hw": "", "type": "Помилка", "mistake": "Використовувати VLOOKUP у таблицях, які часто змінюються (додаються/видаляються стовпці), хоча вона посилається на стовпець результату за порядковим номером, а не за назвою.", "correct": "Для таблиць, що активно редагуються, обирайте INDEX/MATCH або XLOOKUP — вони посилаються на діапазони, а не на номер стовпця, тому зміна структури таблиці не ламає формулу.", "why": "VLOOKUP після вставки нового стовпця в середину діапазону мовчки починає повертати дані з сусідньої, неправильної колонки — і це виявляють лише тоді, коли хтось помічає, що цифри «не сходяться».", "example": "VLOOKUP(B1,A:D,3,FALSE) поверне дохід клієнта; але якщо між стовпцями B і C вставити нову колонку «Регіон», та сама формула почне повертати вже не дохід, а регіон."}, {"id": "B01-M04-L07-03", "block": 1, "module": 4, "lessonNum": 7, "lessonTitle": "Основи роботи з текстом. Обʼєднання таблиць", "topic": "Приховані символи як причина #N/A", "hw": "Модуль 4. ДЗ. Текст, дати, когортний аналіз", "type": "Помилка", "mistake": "Намагатися звʼязати дві таблиці за текстовим ключем (email, назва, код), не помічаючи, що в одній з таблиць є зайві пробіли чи приховані символи — ключі виглядають однаково, але формула повертає #N/A.", "correct": "Перед обʼєднанням таблиць за текстовим ключем прожени обидва стовпці через TRIM (і за потреби CLEAN, LOWER), щоб прибрати невидимі розбіжності, і лише потім шукайте збіг.", "why": "Проблема невидима візуально — комірки «Ivan Petrenko» та «Ivan Petrenko » (із пробілом у кінці) виглядають ідентично, але для VLOOKUP/XLOOKUP це два різні значення.", "example": "VLOOKUP(TRIM(B2), TRIM_range, 2, FALSE) знаходить збіг там, де звичайний VLOOKUP(B2, range, 2, FALSE) повертав би #N/A через прихований пробіл в імпортованих даних."}, {"id": "B01-M04-L07-04", "block": 1, "module": 4, "lessonNum": 7, "lessonTitle": "Основи роботи з текстом. Обʼєднання таблиць", "topic": "Regex без страху", "hw": "", "type": "Лайфхак", "mistake": "Уникати regex-функцій (REGEXEXTRACT, REGEXREPLACE, REGEXMATCH) через страх перед синтаксисом і замість цього вручну перебирати текст комбінаціями LEFT/RIGHT/MID для кожного окремого випадку.", "correct": "Не обовʼязково вчити синтаксис regex напамʼять — опишіть завдання словами інструменту зі штучним інтелектом («видали все, крім цифр», «витягни домен з email») і попросіть згенерувати шаблон, а потім перевірте результат на кількох рядках.", "why": "Regex одним рядком вирішує задачі, для яких вручну знадобилося б кілька вкладених текстових функцій — це суттєво економить час на очищенні великих і неоднорідних наборів даних.", "example": "REGEXREPLACE(C2, \"\\D\", \"\") одразу залишає в номері телефону тільки цифри — ту саму задачу через SUBSTITUTE довелося б вирішувати окремо для пробілів, дужок і дефісів."}, {"id": "B01-M04-L08-01", "block": 1, "module": 4, "lessonNum": 8, "lessonTitle": "Робота з датами в Google Sheets. Когортний аналіз", "topic": "Час у даті заважає групуванню по днях", "hw": "Модуль 4. ДЗ. Текст, дати, когортний аналіз", "type": "Помилка", "mistake": "Групувати активність користувачів по днях напряму по стовпцю дата-час, не прибравши часову частину — Sheets бачить «2024-03-15 09:12» і «2024-03-15 21:47» як різні значення, хоча це один день.", "correct": "Перед групуванням по днях створіть окремий стовпець з INT(дата_час) — це відкидає дробову (часову) частину і залишає тільки цілу частину, що відповідає дню.", "why": "Без цього кроку підрахунок унікальних користувачів за день (DAU) буде завищеним або таблиця «розсиплеться» на сотні мікрогруп замість акуратних календарних днів.", "example": "INT(A2), де A2 = 2024-03-15 14:32, поверне 2024-03-15 — усі події цього дня, незалежно від точного часу, потрапляють в одну групу для підрахунку DAU."}, {"id": "B01-M04-L08-02", "block": 1, "module": 4, "lessonNum": 8, "lessonTitle": "Робота з датами в Google Sheets. Когортний аналіз", "topic": "Тип графіка для часових трендів", "hw": "", "type": "Помилка", "mistake": "Візуалізувати динаміку DAU/WAU/MAU у часі стовпчиковою діаграмою — вона задумана для порівняння категорій, а не для показу тренду.", "correct": "Для будь-якого часового ряду (DAU, WAU, MAU, дохід по днях/тижнях/місяцях) використовуйте лінійний графік — він показує напрямок руху, сезонність і аномалії, які стовпці лише ускладнюють сприймати.", "why": "На стовпчиковій діаграмі з десятками стовпців за кожен день загальний тренд губиться в шумі; лінія одразу показує, чи росте, падає чи стабільна активність.", "example": "Графік DAU за пів року з коливаннями 4-15 користувачів на день на лінійному графіку одразу читається як «стабільний тренд без росту»; та сама інформація стовпцями виглядає як хаотичний ліс без чіткого висновку."}, {"id": "B01-M04-L08-03", "block": 1, "module": 4, "lessonNum": 8, "lessonTitle": "Робота з датами в Google Sheets. Когортний аналіз", "topic": "Порівняння когорт за календарем замість періоду", "hw": "Модуль 4. ДЗ. Текст, дати, когортний аналіз", "type": "Помилка", "mistake": "Порівнювати когорти за календарною датою (наприклад, «що відбувалося в березні у всіх когорт») замість періоду життя когорти (П0, П1, П2), через що втрачається сенс когортного аналізу.", "correct": "Завжди зіставляйте когорти за однаковим періодом з моменту їхнього старту (П0 — місяць входу, П1 — наступний місяць і так далі), а не за конкретним календарним місяцем — саме тому когортна таблиця має трикутну форму.", "why": "Січнева когорта в березні — це вже третій місяць її життя (П2), а березнева когорта в березні — це нульовий місяць (П0); порівняння «навпростець» за календарем змішує геть різні стадії життєвого циклу користувача.", "example": "У трикутній таблиці немає значень для пізніх періодів пізніх когорт (наприклад, у червневої когорти немає П3) — і це нормально, а не помилка в розрахунках."}, {"id": "B01-M04-L08-04", "block": 1, "module": 4, "lessonNum": 8, "lessonTitle": "Робота з датами в Google Sheets. Когортний аналіз", "topic": "Клейкість (DAU/MAU) без контексту продукту", "hw": "", "type": "Лайфхак", "mistake": "Оцінювати DAU/MAU як «погано», якщо цифра низька (наприклад, 4-5%), не враховуючи, що для деяких категорій продуктів (страхові, банківські застосунки) низька щоденна клейкість — це очікувана норма, а не проблема.", "correct": "Перед висновком про клейкість порівнюйте DAU/MAU з бенчмарками саме для вашої категорії продукту: месенджери й соцмережі мають високу норму, страхові й банківські сервіси — низьку за самою природою використання.", "why": "Однакове число 20% DAU/MAU може бути відмінним результатом для однієї категорії продуктів і сигналом серйозної проблеми для іншої — висновок без контексту індустрії веде до неправильних пріоритетів команди.", "example": "DAU/MAU = 4% для застосунку медитації може сигналізувати про слабкий онбординг, тоді як той самий показник для страхового додатка, яким користуються кілька разів на рік, є абсолютно нормальним."}, {"id": "B01-M05-L09-01", "block": 1, "module": 5, "lessonNum": 9, "lessonTitle": "Вступ до баз даних. Основи SQL", "topic": "NOT IN зі списком, що містить NULL", "hw": "Модуль 5. ДЗ. Бази даних та основи SQL", "type": "Помилка", "mistake": "Використовувати NOT IN зі списком значень, у якому може траплятися NULL, — якщо серед значень списку є хоча б один NULL, результат порівняння стає UNKNOWN для всіх рядків, і запит не повертає жодного рядка.", "correct": "Якщо стовпець, за яким будуєте список для NOT IN, потенційно містить NULL, явно виключіть NULL з підзапиту (WHERE column IS NOT NULL) або використовуйте NOT EXISTS замість NOT IN.", "why": "Це одна з найтиповіших пасток SQL для початківців: запит виконується без помилки, але мовчки повертає порожній результат — і без розуміння причини на пошук бага можна витратити години.", "example": "WHERE department_id NOT IN (10, 20, NULL) поверне 0 рядків, навіть якщо в таблиці є департаменти, відмінні від 10 і 20 — через присутність NULL у списку."}, {"id": "B01-M05-L09-02", "block": 1, "module": 5, "lessonNum": 9, "lessonTitle": "Вступ до баз даних. Основи SQL", "topic": "Аліас у WHERE (порядок виконання запиту)", "hw": "", "type": "Помилка", "mistake": "Намагатися використати в умові WHERE аліас, який щойно створили в SELECT через AS, очікуючи, що база вже «знає» цю нову назву.", "correct": "Пам'ятайте реальний порядок виконання запиту (FROM → WHERE → SELECT → ORDER BY → LIMIT): на етапі WHERE аліаси з SELECT ще не існують, тому фільтруйте за оригінальною назвою стовпця.", "why": "Помилка «column does not exist» після спроби відфільтрувати за зручним псевдонімом — одна з перших плутанин у SQL, і вона напряму повʼязана з тим, що запит пишеться в одному порядку, а виконується в іншому.", "example": "SELECT user_age AS age FROM users WHERE age > 30 видасть помилку в PostgreSQL, бо на етапі WHERE стовпця «age» ще не існує — треба писати WHERE user_age > 30."}, {"id": "B01-M05-L09-03", "block": 1, "module": 5, "lessonNum": 9, "lessonTitle": "Вступ до баз даних. Основи SQL", "topic": "LIKE проти ILIKE", "hw": "Модуль 5. ДЗ. Бази даних та основи SQL", "type": "Помилка", "mistake": "Використовувати LIKE для пошуку тексту без урахування регістру і дивуватися, чому запит не знаходить очевидно наявні рядки.", "correct": "Для пошуку тексту, де регістр літер неважливий (імена, назви посад, email), використовуйте ILIKE замість LIKE — LIKE завжди чутливий до регістру.", "why": "Рядок «Manager» і «manager» для LIKE — це два різні значення; пропущені через це записи виглядають як «відсутні дані», хоча насправді вони просто написані з іншим регістром.", "example": "WHERE job_title LIKE '%manager%' пропустить запис «Sales MANAGER»; WHERE job_title ILIKE '%manager%' знайде обидва варіанти написання."}, {"id": "B01-M05-L09-04", "block": 1, "module": 5, "lessonNum": 9, "lessonTitle": "Вступ до баз даних. Основи SQL", "topic": "Очікування «готової» плоскої таблиці в базі", "hw": "", "type": "Лайфхак", "mistake": "Очікувати, що в реальній базі даних усі потрібні поля вже зібрані в одній зручній таблиці, як у Google Sheets, і губитися, побачивши шість повʼязаних таблиць замість однієї.", "correct": "Сприймайте нормалізовану структуру бази (users, orders, order_items, payments…) як нормальний робочий стан: задача аналітика — не «повернути» дані назад в одну таблицю руками, а впевнено зʼєднувати потрібні таблиці запитом під конкретну задачу.", "why": "Нормалізована модель існує заради цілісності даних на боці бізнесу (жодних дублікатів і суперечностей), а не для зручності аналітика — і це нормальний поділ ролей між інженером даних і аналітиком, а не недолік бази.", "example": "Замість пошуку однієї таблиці з «усім одразу» аналітик пише один запит, що обʼєднує users, orders і order_items за ключами — і отримує саме ту широку вибірку, яка потрібна для конкретного звіту."}, {"id": "B01-M05-L10-01", "block": 1, "module": 5, "lessonNum": 10, "lessonTitle": "Агрегація даних в SQL. Робота з датами і текстом", "topic": "COUNT(*) vs COUNT(стовпець)", "hw": "Модуль 5. ДЗ. Бази даних та основи SQL", "type": "Помилка", "mistake": "Використовувати COUNT(*) і COUNT(стовпець) як взаємозамінні, не помічаючи, що COUNT(*) рахує всі рядки, а COUNT(стовпець) — тільки ті, де значення не NULL.", "correct": "Обирайте варіант свідомо: COUNT(*) — коли потрібна загальна кількість рядків, COUNT(стовпець) — коли потрібна кількість заповнених значень цього поля.", "why": "Різниця між ними — це готовий сигнал про повноту даних: якщо COUNT(*) = 41, а COUNT(manager_id) = 39, то у двох працівників менеджер не призначений, і ця різниця легко губиться, якщо не розрізняти функції свідомо.", "example": "COUNT(*) FROM employees поверне 41 (усі рядки); COUNT(manager_id) FROM employees поверне 39, бо в двох рядках це поле NULL."}, {"id": "B01-M05-L10-02", "block": 1, "module": 5, "lessonNum": 10, "lessonTitle": "Агрегація даних в SQL. Робота з датами і текстом", "topic": "Цілочисельне ділення в PostgreSQL", "hw": "", "type": "Помилка", "mistake": "Ділити два цілочисельних (INTEGER) стовпці й дивуватися, чому результат — ціле число без десяткових знаків, замість очікуваного дробового значення (наприклад, конверсії чи середнього чека).", "correct": "Перед діленням цілих чисел, де потрібна точність, приведіть хоча б одне зі значень до NUMERIC через CAST або ::numeric — тоді результат збереже дробову частину.", "why": "PostgreSQL за замовчуванням ділить два INTEGER як ціле число, обрізаючи дробову частину без попередження чи помилки — метрика на кшталт конверсії чи середнього чека може вийти грубо неправильною.", "example": "SELECT 7/2 поверне 3, а не 3.5; SELECT 7::numeric/2 поверне коректні 3.5 — саме друга формула потрібна для розрахунку відсотків чи середніх показників."}, {"id": "B01-M05-L10-03", "block": 1, "module": 5, "lessonNum": 10, "lessonTitle": "Агрегація даних в SQL. Робота з датами і текстом", "topic": "WHERE замість HAVING для агрегованих значень", "hw": "Модуль 5. ДЗ. Бази даних та основи SQL", "type": "Помилка", "mistake": "Намагатися відфільтрувати результат за агрегованим значенням (наприклад, «залиш тільки відділи із середньою зарплатою вище 5000») через WHERE, отримуючи помилку про невідому функцію в WHERE.", "correct": "Фільтруйте рядки до агрегації через WHERE, а результати вже згрупованих і порахованих даних — через HAVING; HAVING виконується після GROUP BY, коли агрегатні значення вже обчислені.", "why": "На етапі WHERE агрегатне значення (наприклад, середня зарплата по групі) фізично ще не існує — воно зʼявляється лише в результаті GROUP BY, тому SQL не дозволяє звертатися до нього раніше.", "example": "SELECT department_id, AVG(salary) AS avg_salary FROM employees GROUP BY department_id HAVING AVG(salary) > 5000 — правильно; той самий фільтр у WHERE AVG(salary) > 5000 поверне помилку."}, {"id": "B01-M05-L10-04", "block": 1, "module": 5, "lessonNum": 10, "lessonTitle": "Агрегація даних в SQL. Робота з датами і текстом", "topic": "Порівняння з NULL через «=»", "hw": "", "type": "Помилка", "mistake": "Писати WHERE column = NULL (або <> NULL), очікуючи знайти чи виключити порожні значення, — цей вираз завжди повертає UNKNOWN і жодного рядка.", "correct": "Для перевірки на відсутність або наявність значення завжди використовуйте IS NULL / IS NOT NULL — це єдиний коректний спосіб працювати з NULL у SQL.", "why": "NULL означає «невідомо», а не конкретне значення, тому звичайні оператори порівняння (=, <>) з ним не працюють за визначенням тризначної логіки SQL — запит не впаде з помилкою, а просто мовчки поверне порожній результат.", "example": "WHERE manager_id = NULL ніколи не знайде жодного рядка, навіть якщо в таблиці є працівники без менеджера; правильний варіант — WHERE manager_id IS NULL."}, {"id": "B01-M06-L11-01", "block": 1, "module": 6, "lessonNum": 11, "lessonTitle": "Підзапити та тимчасові таблиці. Представлення в PostgreSQL", "topic": "Аліаси підзапитів", "hw": "", "type": "Помилка", "mistake": "Забувати присвоювати аліас підзапиту в секції FROM або, навпаки, додавати зайвий аліас підзапиту в WHERE, де він не потрібен.", "correct": "Завжди присвоюйте аліас підзапиту у FROM (SELECT * FROM (...) AS sub), а в WHERE використовуйте підзапит без аліасу, бо він повертає лише значення для порівняння, а не окрему таблицю.", "why": "PostgreSQL вимагає імені для похідної таблиці у FROM — без нього запит просто не виконається, і початківці витрачають час на пошук незрозумілої синтаксичної помилки.", "example": "SELECT * FROM (SELECT department_id, COUNT(*) FROM employees GROUP BY department_id) AS dept_counts;"}, {"id": "B01-M06-L11-02", "block": 1, "module": 6, "lessonNum": 11, "lessonTitle": "Підзапити та тимчасові таблиці. Представлення в PostgreSQL", "topic": "HAVING vs WHERE з підзапитом", "hw": "", "type": "Помилка", "mistake": "Намагатися відфільтрувати рядки за результатом агрегатної функції прямо в WHERE (наприклад WHERE SUM(amount) > 1000).", "correct": "Використовуйте HAVING для фільтрації після групування або підзапит/CTE, який спочатку обчислює агрегат, а потім фільтрує зовнішній запит за цим значенням.", "why": "WHERE виконується до групування даних, тому база ще не має агрегованого значення на цьому етапі — запит завершиться помилкою, а не просто дасть неправильний результат.", "example": "SELECT department_id FROM employees GROUP BY department_id HAVING SUM(salary) > 100000;"}, {"id": "B01-M06-L11-03", "block": 1, "module": 6, "lessonNum": 11, "lessonTitle": "Підзапити та тимчасові таблиці. Представлення в PostgreSQL", "topic": "CTE замість вкладених підзапитів", "hw": "", "type": "Лайфхак", "mistake": "Будувати запит із кількома підзапитами, вкладеними один в інший, через що логіку складно читати й налагоджувати.", "correct": "Виносьте кожен проміжний крок обчислень в окремий CTE (WITH ... AS), щоб запит читався як послідовність кроків зверху вниз, а не як вкладена структура.", "why": "Запит із іменованими кроками легше перевіряти частинами, передавати колегам і виправляти за кілька місяців, коли деталі вже забулися.", "example": "WITH high_value AS  (SELECT customer_id, SUM(amount) AS total FROM orders GROUP BY customer_id)  SELECT * FROM high_value WHERE total > 500;"}, {"id": "B01-M06-L11-04", "block": 1, "module": 6, "lessonNum": 11, "lessonTitle": "Підзапити та тимчасові таблиці. Представлення в PostgreSQL", "topic": "Матеріалізовані представлення", "hw": "", "type": "Помилка", "mistake": "Сприймати матеріалізоване представлення (MATERIALIZED VIEW) як завжди актуальні дані, так само як звичайне представлення (VIEW).", "correct": "Пам'ятайте, що MATERIALIZED VIEW зберігає знімок даних на момент створення й потребує ручного REFRESH MATERIALIZED VIEW для оновлення, тоді як звичайний VIEW виконує запит наживо щоразу.", "why": "Якщо покластися на застарілий знімок як на актуальні дані, звіт чи дашборд покаже неправильні цифри, і це важко помітити без розуміння різниці.", "example": "REFRESH MATERIALIZED VIEW sales_summary;"}, {"id": "B01-M06-L12-01", "block": 1, "module": 6, "lessonNum": 12, "lessonTitle": "Обʼєднання таблиць. Процедури, функції в PostgreSQL", "topic": "Вибір типу JOIN", "hw": "Завдання 5 (JOIN-запити)", "type": "Помилка", "mistake": "Автоматично використовувати INNER JOIN «за замовчуванням», навіть коли потрібно зберегти всі рядки з однієї з таблиць.", "correct": "Перед написанням запиту визначте, чи можна втратити рядки без відповідності: якщо треба зберегти всі рядки лівої таблиці (наприклад, усі відділи, навіть без співробітників), використовуйте LEFT JOIN, а не INNER JOIN.", "why": "INNER JOIN мовчки прибирає рядки без пари, і аналітик може не помітити, що ціла категорія даних (наприклад, цілий відділ) зникла зі звіту.", "example": "SELECT d.department_name, e.first_name FROM departments d LEFT JOIN employees e ON d.department_id = e.department_id;"}, {"id": "B01-M06-L12-02", "block": 1, "module": 6, "lessonNum": 12, "lessonTitle": "Обʼєднання таблиць. Процедури, функції в PostgreSQL", "topic": "Унікальність ключа JOIN", "hw": "Завдання 5 (JOIN-запити)", "type": "Помилка", "mistake": "Не перевіряти унікальність ключа з'єднання перед JOIN, через що кількість рядків у результаті несподівано зростає — кожен рядок лівої таблиці розмножується на кожен збіг у правій.", "correct": "Перед JOIN перевірте, чи ключове поле унікальне в обох таблицях (порівняйте COUNT(*) і COUNT(DISTINCT key)); якщо ні — врахуйте, що результат матиме більше рядків, ніж вихідні таблиці, і скоригуйте агрегацію після з'єднання.", "why": "Непомічене розмноження рядків спотворює суми, середні значення та інші розрахунки в усіх подальших кроках аналізу.", "example": "SELECT COUNT(*), COUNT(DISTINCT employee_id) FROM employees_lastname;"}, {"id": "B01-M06-L12-03", "block": 1, "module": 6, "lessonNum": 12, "lessonTitle": "Обʼєднання таблиць. Процедури, функції в PostgreSQL", "topic": "DDL vs DML, ризики команд", "hw": "Завдання 3, 4, 6 (UPDATE, DELETE, DROP TABLE)", "type": "Помилка", "mistake": "Недооцінювати різницю між командами, що змінюють структуру таблиці (DDL: DROP, TRUNCATE, ALTER), і командами, що змінюють лише дані (DML: DELETE, UPDATE) — зокрема запускати DELETE або UPDATE без умови WHERE.", "correct": "Перед виконанням DELETE або UPDATE спочатку перевірте ту саму умову через SELECT, а DDL-команди (DROP, TRUNCATE) застосовуйте лише в тестових середовищах чи на тимчасових таблицях.", "why": "DELETE без WHERE видаляє всі рядки, а DROP чи TRUNCATE незворотно знищують структуру або дані — без попередньої перевірки помилку неможливо швидко виправити.", "example": "SELECT * FROM employees WHERE employee_id = 5;   -- перевірка перед DELETE FROM employees WHERE employee_id = 5;"}, {"id": "B01-M06-L12-04", "block": 1, "module": 6, "lessonNum": 12, "lessonTitle": "Обʼєднання таблиць. Процедури, функції в PostgreSQL", "topic": "Функції vs процедури", "hw": "", "type": "Лайфхак", "mistake": "Намагатися викликати процедуру (PROCEDURE) всередині SELECT так само, як функцію, або самостійно писати складну логіку замість того, щоб скористатися готовою функцією компанії.", "correct": "Пам'ятайте, що процедура не повертає значення й викликається через CALL, а не в SELECT; для готових розрахунків (метрики, скоринг, нормалізація) використовуйте вже наявні функції компанії, а створення нових функцій і процедур залишайте інженерам.", "why": "Плутанина між функцією і процедурою призводить до синтаксичних помилок, а самостійне дублювання бізнес-логіки замість виклику готової функції — до розбіжностей у розрахунках між командами.", "example": "CALL refresh_sales_summary();  -- процедура викликається через CALL, а не в SELECT"}, {"id": "B01-M07-L13-01", "block": 1, "module": 7, "lessonNum": 13, "lessonTitle": "Вступ до Google BigQuery. Робота з масивами та структурами", "topic": "Партиціювання і вартість запиту", "hw": "Завдання 8 (робота з партиціями через _TABLE_SUFFIX)", "type": "Помилка", "mistake": "Писати запит до партиційованої таблиці (наприклад `ga_sessions_*`) без умови `WHERE _TABLE_SUFFIX BETWEEN ...`, через що BigQuery сканує геть усі партиції.", "correct": "Завжди додавайте фільтр за полем партиціювання (`_TABLE_SUFFIX` або поле типу DATE/TIMESTAMP), навіть коли здається, що потрібні дані «за весь час», — краще явно вказати діапазон.", "why": "BigQuery тарифікує запити за обсягом прочитаних даних, тому запит без фільтра партиції може прочитати терабайти замість кількох гігабайтів і коштувати в сотні разів дорожче.", "example": "SELECT COUNT(*) FROM `dataset.ga_sessions_*` WHERE _TABLE_SUFFIX BETWEEN '20170801' AND '20170807';"}, {"id": "B01-M07-L13-02", "block": 1, "module": 7, "lessonNum": 13, "lessonTitle": "Вступ до Google BigQuery. Робота з масивами та структурами", "topic": "NULLABLE vs REPEATED поля", "hw": "Завдання 1–3 (перегляд REPEATED-полів, розгортання event_params)", "type": "Помилка", "mistake": "Намагатися звернутися до REPEATED-поля (масиву, наприклад `hits` чи `items`) напряму через крапку, як до звичайного NULLABLE STRUCT, що спричиняє помилку запиту.", "correct": "Перед зверненням до поля перевіряйте його Mode у схемі таблиці: NULLABLE STRUCT — звертайтесь одразу через крапку (`device.browser`), а REPEATED — спершу розгорніть через `UNNEST(...) AS h`, і лише потім звертайтесь через аліас.", "why": "BigQuery не дозволяє звертатися до елементів масиву без розгортання, і без розуміння різниці Mode аналітик витрачає час на пошук синтаксичної помилки замість аналізу даних.", "example": "SELECT h.type FROM `dataset.ga_sessions_20170801`, UNNEST(hits) AS h;"}, {"id": "B01-M07-L13-03", "block": 1, "module": 7, "lessonNum": 13, "lessonTitle": "Вступ до Google BigQuery. Робота з масивами та структурами", "topic": "Вкладені STRUCT/ARRAY замість JOIN", "hw": "Завдання 5, 6 (розгортання items, зведена таблиця по товарах)", "type": "Лайфхак", "mistake": "За звичкою намагатися «розкласти» вкладені STRUCT і ARRAY в окремі таблиці й з'єднувати їх через JOIN, як у реляційній базі, замість використання крапкової нотації та UNNEST.", "correct": "Залишайте дані у природному вкладеному вигляді (STRUCT/ARRAY) і звертайтесь до них через крапку або UNNEST — це замінює цілі ланцюжки JOIN і працює швидше завдяки колонковому зберіганню.", "why": "BigQuery спеціально спроєктований для вкладених структур; зайва нормалізація не пришвидшує запити, а лише ускладнює код і не дає скористатися перевагами колонкового читання.", "example": "SELECT fullVisitorId, h.page.pageTitle FROM `dataset.ga_sessions_20170801`, UNNEST(hits) AS h;"}, {"id": "B01-M07-L13-04", "block": 1, "module": 7, "lessonNum": 13, "lessonTitle": "Вступ до Google BigQuery. Робота з масивами та структурами", "topic": "Розмноження рядків після UNNEST", "hw": "Завдання 4 (аналіз частоти параметрів подій)", "type": "Помилка", "mistake": "Рахувати COUNT(*) чи інші агрегати одразу після UNNEST масиву, забуваючи, що кожна сесія тепер повторюється по одному рядку на кожну подію, тому результат більше не відповідає кількості сесій.", "correct": "Чітко розділяйте рівень аналізу: до UNNEST рядок = сесія, після UNNEST рядок = подія; якщо потрібна кількість сесій чи користувачів, рахуйте COUNT(DISTINCT fullVisitorId) або агрегуйте до UNNEST.", "why": "Сплутування рівня деталізації після розгортання масиву — одна з найпоширеніших причин завищених метрик у звітах на основі подієвих даних.", "example": "SELECT COUNT(DISTINCT fullVisitorId) FROM `dataset.ga_sessions_20170801`, UNNEST(hits) AS h WHERE h.type = 'PAGE';"}, {"id": "B01-M07-L14-01", "block": 1, "module": 7, "lessonNum": 14, "lessonTitle": "Віконні функції. Робота з даними Google Analytics", "topic": "Віконні функції у WHERE", "hw": "Завдання 10 (нумерація подій у сесії, ROW_NUMBER)", "type": "Помилка", "mistake": "Намагатися відфільтрувати результат віконної функції прямо в WHERE (наприклад WHERE ROW_NUMBER() OVER (...) = 1).", "correct": "Винесіть віконну функцію в підзапит або CTE, а фільтрацію за її результатом робіть у зовнішньому WHERE, застосованому вже до обчисленої колонки.", "why": "Віконні функції обчислюються на етапі SELECT, вже після WHERE, тому база даних ще не має цього значення на момент фільтрації — запит просто завершиться помилкою.", "example": "WITH ranked AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY event_time) AS rn FROM events) SELECT * FROM ranked WHERE rn = 1;"}, {"id": "B01-M07-L14-02", "block": 1, "module": 7, "lessonNum": 14, "lessonTitle": "Віконні функції. Робота з даними Google Analytics", "topic": "RANK vs ROW_NUMBER vs DENSE_RANK", "hw": "Завдання 9 (ранжування користувачів за витратами)", "type": "Помилка", "mistake": "Плутати RANK(), DENSE_RANK() і ROW_NUMBER(), обираючи функцію навмання, через що результат топ-N не збігається з очікуваннями (дублікати місць чи пропущені ранги).", "correct": "Обирайте функцію свідомо: ROW_NUMBER — коли потрібна гарантована унікальна кількість рядків (точно топ-10); RANK — коли однакові значення ділять місце з пропуском наступного рангу; DENSE_RANK — коли ранги мають йти без пропусків.", "why": "Неправильний вибір функції призводить до неправильної кількості рядків у топ-N вибірках або спотвореної системи рівнів чи рейтингів.", "example": "ROW_NUMBER() OVER (ORDER BY revenue DESC) AS rn,  RANK() OVER (ORDER BY revenue DESC) AS rk,  DENSE_RANK() OVER (ORDER BY revenue DESC) AS drk;"}, {"id": "B01-M07-L14-03", "block": 1, "module": 7, "lessonNum": 14, "lessonTitle": "Віконні функції. Робота з даними Google Analytics", "topic": "LAST_VALUE без рамки", "hw": "", "type": "Помилка", "mistake": "Використовувати LAST_VALUE() з ORDER BY, але без явної рамки ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING, очікуючи отримати останнє значення у всьому вікні.", "correct": "Завжди явно вказуйте рамку ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING для LAST_VALUE (і за потреби для FIRST_VALUE/NTH_VALUE), якщо хочете охопити все вікно, а не лише рядки до поточного.", "why": "За замовчуванням при наявності ORDER BY рамка обмежується «від початку до поточного рядка», тому без явної рамки LAST_VALUE фактично повертає значення поточного рядка, а не очікуваний глобальний максимум чи мінімум.", "example": "LAST_VALUE(value) OVER (ORDER BY date ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING);"}, {"id": "B01-M07-L14-04", "block": 1, "module": 7, "lessonNum": 14, "lessonTitle": "Віконні функції. Робота з даними Google Analytics", "topic": "CASE WHEN vs віконна функція", "hw": "", "type": "Лайфхак", "mistake": "Намагатися вирішити задачу ранжування чи порівняння з групою через громіздкий CASE WHEN або кілька підзапитів, коли для цього достатньо однієї віконної функції.", "correct": "Якщо для розрахунку потрібна інформація з інших рядків (порівняння, ранжування, накопичення) — використовуйте віконну функцію; CASE WHEN залишайте для рішень на основі значень лише поточного рядка.", "why": "Правильний вибір інструменту економить рядки коду, пришвидшує виконання запиту і робить його зрозумілішим для колег, які перевірятимуть логіку.", "example": "PERCENT_RANK() OVER (ORDER BY conversion_rate) замість ручного обчислення частки через кілька CTE."}, {"id": "B02-M08-L15-01", "block": 2, "module": 8, "lessonNum": 15, "lessonTitle": "BI-інструменти. Візуалізація в Google Data (Looker) Studio", "topic": "Вибір конектора без оцінки стабільності та вартості", "hw": "", "type": "Помилка", "mistake": "Підключати джерело через перший-ліпший партнерський або спільнотний конектор, не перевіривши, чи є безкоштовний нативний конектор від Google для цього ж джерела, і не оцінивши ліміти чи вартість підписки.", "correct": "Перед підключенням перевірте, чи джерело належить до екосистеми Google (Sheets, BigQuery, GA4, Ads) — тоді використовуйте нативний конектор; для сторонніх джерел (CRM, Meta, LinkedIn) заздалегідь зʼясуйте вартість партнерського конектора і його ліміти запитів.", "why": "Платний конектор, підключений «на автоматі», може за кілька місяців виявитися дорожчим за альтернативний шлях (наприклад, вивантаження даних у BigQuery), а нестабільний спільнотний конектор — ламати оновлення дашборду без попередження.", "example": "Замість платного партнерського конектора до CRM можна раз на день вивантажувати дані в Google Sheets або BigQuery і підключати вже звідти безкоштовним нативним конектором."}, {"id": "B02-M08-L15-02", "block": 2, "module": 8, "lessonNum": 15, "lessonTitle": "BI-інструменти. Візуалізація в Google Data (Looker) Studio", "topic": "Типи полів і агрегація після підключення джерела", "hw": "Модуль 8. ДЗ. Looker Studio", "type": "Помилка", "mistake": "Не перевіряти автоматично визначені Looker Studio типи полів і агрегацію після підключення — дата залишається текстом, а ідентифікатор клієнта чи замовлення підсумовується як число замість підрахунку кількості.", "correct": "Після кожного підключення джерела відкривайте редактор джерела даних і вручну перевіряйте: дати мають тип Date, ідентифікатори — Text (без агрегації або Count), а показники доходу — Number/Currency з агрегацією Sum.", "why": "Неправильний тип чи агрегація не викликають помилку — поле просто зникає зі списку розмірностей/метрик або тихо рахується неправильно, і це непомітно, поки хтось не звірить цифри вручну.", "example": "Поле user_id з типом Number і агрегацією Sum видасть у Scorecard безглузде число на кшталт «12 480 305» замість очікуваної кількості унікальних клієнтів."}, {"id": "B02-M08-L15-03", "block": 2, "module": 8, "lessonNum": 15, "lessonTitle": "BI-інструменти. Візуалізація в Google Data (Looker) Studio", "topic": "Обчислюване поле замість дублювання формули", "hw": "Модуль 8. ДЗ. Looker Studio", "type": "Лайфхак", "mistake": "Прописувати ту саму формулу (наприклад, Revenue = price × quantity) окремо в кожній візуалізації, де вона потрібна, замість того, щоб створити її один раз на рівні джерела даних.", "correct": "Якщо формула використовується у трьох і більше графіках — виносьте її в обчислюване поле на рівні джерела даних; тоді вона автоматично доступна в усіх візуалізаціях цього джерела і оновлюється в одному місці.", "why": "Дублювання формули по графіках означає, що будь-яку зміну логіки (наприклад, додати знижку в розрахунок доходу) доведеться вручну повторити в кожній візуалізації — і легко щось забути.", "example": "Обчислюване поле Revenue, створене один раз у джерелі даних, одразу зʼявляється і в Scorecard загального доходу, і в Time Series динаміки виручки, і в таблиці товарів — без повторного написання формули."}, {"id": "B02-M08-L16-01", "block": 2, "module": 8, "lessonNum": 16, "lessonTitle": "Дашборди. Просунута візуалізація в Google Data (Looker) Studio", "topic": "Z-патерн і візуальна ієрархія на полотні дашборду", "hw": "Модуль 8. ДЗ. Looker Studio", "type": "Помилка", "mistake": "Розміщувати другорядну інформацію (наприклад, декоративний текстовий блок чи дрібну деталізацію) у верхньому лівому куті дашборду, а ключові KPI — десь унизу або збоку.", "correct": "Відводьте верхній лівий кут під найважливіші показники (загальний дохід, кількість замовлень), верхній правий — під порівняння чи додаткові KPI, а деталізацію й таблиці розміщуйте нижче — за природним Z-патерном руху погляду.", "why": "Дашборд не читають як текст зверху вниз — його сканують поглядом за кілька секунд; якщо в найпомітнішому місці стоїть другорядна інформація, користувач витрачає увагу не на те, що важливо для рішення.", "example": "Заголовок «Продажі 2024» без жодного показника у верхньому лівому куті змушує керівника шукати загальний дохід десь у таблиці внизу сторінки, хоча це мало б бути першим, що він бачить."}, {"id": "B02-M08-L16-02", "block": 2, "module": 8, "lessonNum": 16, "lessonTitle": "Дашборди. Просунута візуалізація в Google Data (Looker) Studio", "topic": "Селектор дат і глобальний діапазон", "hw": "Модуль 8. ДЗ. Looker Studio", "type": "Помилка", "mistake": "Додавати на сторінку селектор дат, не перевіривши, що кожна візуалізація налаштована на глобальний діапазон дат — частина графіків має власний фіксований період і не реагує на вибір користувача.", "correct": "Після додавання селектора дат пройдіться по кожній візуалізації й перевірте у Setup, що поле дати привʼязане саме до глобального діапазону, а не до жорстко заданого періоду.", "why": "Якщо хоча б один графік ігнорує селектор дат, дашборд поводиться непередбачувано: користувач змінює період вгорі, а частина цифр внизу лишається незмінною — і це підриває довіру до всього звіту.", "example": "Календар вгорі показує обраний період «Останні 30 днів», але Time Series виручки й далі показує дані за весь рік, бо його період був зафіксований окремо ще на етапі створення графіка."}, {"id": "B02-M08-L16-03", "block": 2, "module": 8, "lessonNum": 16, "lessonTitle": "Дашборди. Просунута візуалізація в Google Data (Looker) Studio", "topic": "Параметр — це не фільтр", "hw": "", "type": "Помилка", "mistake": "Плутати параметр із фільтром і намагатися через фільтр змінити саму логіку обчислення (наприклад, «переключити» формулу метрики), хоча фільтр лише обмежує набір рядків, а не змінює формулу.", "correct": "Коли потрібно, щоб користувач керував саме логікою розрахунку (яку метрику показати, який поріг вважати критичним) — використовуйте параметр і звʼязане з ним обчислюване поле; фільтр застосовуйте лише для обмеження даних (період, категорія, регіон).", "why": "Спроба реалізувати керовану логіку через фільтр не спрацює — фільтр не має доступу до формул, тому результат або не зміниться, або зникнуть потрібні рядки даних замість зміни розрахунку.", "example": "Щоб дати користувачу вибір, яку метрику показувати на графіку — виручку чи кількість замовлень, — потрібен параметр з обчислюваним полем, яке через CASE-логіку повертає одне з двох значень залежно від вибору."}, {"id": "B02-M08-L16-04", "block": 2, "module": 8, "lessonNum": 16, "lessonTitle": "Дашборди. Просунута візуалізація в Google Data (Looker) Studio", "topic": "Тема і розмір полотна — до, а не після компонентів", "hw": "", "type": "Лайфхак", "mistake": "Одразу додавати графіки й елементи управління на полотно, а вже потім намагатися підібрати тему оформлення і розмір сторінки під те, що вже розкладено.", "correct": "Спочатку визначте кількість сторінок, оберіть тему оформлення і зафіксуйте розмір полотна під цільовий формат перегляду (десктоп чи адаптивний режим), і лише після цього додавайте графіки та контроли.", "why": "Зміна розміру полотна чи теми після того, як компоненти вже розставлені, майже завжди означає повне перекомпонування дашборду — це витрачає значно більше часу, ніж налаштувати основу заздалегідь.", "example": "Дашборд, зібраний під фіксовану ширину 1600 пікселів, після зміни на адаптивний режим «розʼїжджається» — доводиться вручну перевіряти й підганяти розташування кожного графіка."}, {"id": "B02-M09-L17-01", "block": 2, "module": 9, "lessonNum": 17, "lessonTitle": "Microsoft Power BI. Роль і функції Power Query", "topic": "«null» vs порожній рядок", "hw": "", "type": "Помилка", "mistake": "Плутати null і \"\" (порожній рядок нульової довжини) при очищенні тексту — не проводити явну заміну, вважаючи їх однаковими.", "correct": "Явно перевіряйте поле інструментом «Якість стовпця»/«Профіль стовпця» і замінюйте порожні рядки на null окремим кроком (у полі заміни писати null без лапок), а не покладайтесь на автоматичне визначення.", "why": "null означає відсутність інформації, а \"\" — технічний артефакт імпорту; якщо їх не розрізняти, підрахунок заповнених значень або перевірка на пропуски дає неправильний результат.", "example": "У колонці email частина клієнтів має порожній рядок \"\" замість null через помилку експорту з CRM; підрахунок порожніх значень по цій колонці поверне 0 там, де насправді дані відсутні."}, {"id": "B02-M09-L17-02", "block": 2, "module": 9, "lessonNum": 17, "lessonTitle": "Microsoft Power BI. Роль і функції Power Query", "topic": "Порядок кроків у Power Query має значення", "hw": "", "type": "Помилка", "mistake": "Порушувати порядок кроків — наприклад, спочатку змінити тип стовпця на Date, а потім намагатися очистити чи замінити текстові значення в ньому.", "correct": "Спочатку очищайте й нормалізуйте поле як текст (обрізка пробілів, уніфікація роздільників, заміна помилкових значень), і лише після цього змінюйте тип на Date/Number.", "why": "Кожен крок Power Query застосовується послідовно до результату попереднього; зміна типу на дату для ще не очищеного текстового поля перетворює некоректні значення на помилки, які потім важко відстежити в довгому ланцюжку кроків.", "example": "Якщо застосувати крок «Змінений тип: Дата» до стовпця registration_date, де ще є значення на кшталт \"March 5, 2024\" поряд з \"05.03.2024\", частина рядків перетвориться на помилки."}, {"id": "B02-M09-L17-03", "block": 2, "module": 9, "lessonNum": 17, "lessonTitle": "Microsoft Power BI. Роль і функції Power Query", "topic": "Автоматичне визначення типів під час підключення", "hw": "Модуль 9. ДЗ. Power BI — Power Query і модель даних", "type": "Помилка", "mistake": "Довіряти автоматичному кроку «Змінений тип», який Power Query додає одразу після підключення файлу, не перевіряючи його вручну по кожному стовпцю.", "correct": "Сприймайте автоматичний крок «Змінений тип» як чернетку: відкрийте кожен стовпець і звірте тип із очікуваним (ідентифікатори — текст, дати — Date, суми — Number/Currency), за потреби видаліть автокрок і задайте типи вручну в правильному порядку.", "why": "Power Query визначає тип лише за першими значеннями зразка даних, тому може помилково розпізнати текстове поле як число — помилка непомітна, поки в модель не потраплять зіпсовані значення.", "example": "Поле student_id зі значеннями на кшталт \"007\" Power Query може автоматично розпізнати як число і прибрати провідні нулі — тоді \"007\" перетвориться на \"7\" і перестане збігатися з тим самим полем в іншій таблиці."}, {"id": "B02-M09-L17-04", "block": 2, "module": 9, "lessonNum": 17, "lessonTitle": "Microsoft Power BI. Роль і функції Power Query", "topic": "Правте існуючий крок, а не дублюйте новий стовпець", "hw": "", "type": "Лайфхак", "mistake": "Створювати новий стовпець замість редагування кроку, де вже була створена попередня версія поля (наприклад, дублювати логіку очищення email в новому стовпці замість виправлення наявного).", "correct": "Якщо потрібно скоригувати логіку поля, яке вже було створене раніше в ланцюжку, відкрийте на панелі «Застосовані кроки» саме той крок, де це поле народилося, і відредагуйте формулу M там — не додавайте ще один стовпець поверх.", "why": "Дублювання стовпців ускладнює ланцюжок кроків, заплутує логіку для тих, хто дивитиметься на запит пізніше, і підвищує ризик, що в модель випадково потрапить стара, невиправлена версія поля.", "example": "Замість додавання стовпця email_v2 з виправленою логікою валідації відкривають крок «Додано настроюваний стовпець – customer_email» і одразу правлять формулу M — усі подальші кроки автоматично використовують оновлену логіку."}, {"id": "B02-M09-L18-01", "block": 2, "module": 9, "lessonNum": 18, "lessonTitle": "Microsoft Power BI. Модель даних та її організація", "topic": "Дублікати в довіднику ламають звʼязок", "hw": "Модуль 9. ДЗ. Power BI — Power Query і модель даних", "type": "Помилка", "mistake": "Мати дублікати ключа в довідниковій таблиці (наприклад, customer_id зустрічається двічі через помилку імпорту), через що Power BI автоматично створює звʼязок «багато-до-багатьох» замість «один-до-багатьох».", "correct": "Перш ніж будувати звʼязки, у Power Query перевірте кожен довідник на унікальність ключового поля («Видалити рядки» → «Видалити повтори») і лише потім переходьте до Model View для налаштування звʼязків.", "why": "Якщо Power BI автоматично створив звʼязок «багато-до-багатьох» — це сигнал про дублікати в даних, а не особливість моделі; агрегації в такій моделі стають непередбачуваними, суми можуть подвоюватися.", "example": "У довіднику products товар \"P456\" через помилку імпорту потрапив у таблицю двічі — Power BI не розуміє, який із двох рядків використовувати при фільтрації продажів, і сума виручки по цьому товару подвоюється."}, {"id": "B02-M09-L18-02", "block": 2, "module": 9, "lessonNum": 18, "lessonTitle": "Microsoft Power BI. Модель даних та її організація", "topic": "Автоматична модель — це чернетка, а не готове рішення", "hw": "", "type": "Помилка", "mistake": "Автоматично довіряти звʼязкам, які Power BI створив сам одразу після імпорту кількох файлів, не перевіряючи їх у поданні моделі.", "correct": "Після кожного імпорту відкривайте подання моделі, клікайте по кожному звʼязку і перевіряйте: які поля зʼєднані, який тип звʼязку (1:* а не *:*) і в яку сторону йде фільтрація — і лише після цього переходьте до візуалізацій.", "why": "Power BI створює звʼязки лише за схожістю назв і значень полів, не розуміючи бізнес-логіки; довірившись автоматиці без перевірки, можна отримати красиві графіки з неправильними цифрами.", "example": "Планова таблиця targets не потрапила в автоматичну модель, бо в ній немає поля зі спільною назвою з іншими таблицями — і план просто відсутній в аналізі, поки хтось не помітить цю прогалину вручну."}, {"id": "B02-M09-L18-03", "block": 2, "module": 9, "lessonNum": 18, "lessonTitle": "Microsoft Power BI. Модель даних та її організація", "topic": "Двостороння фільтрація — не за замовчуванням", "hw": "", "type": "Помилка", "mistake": "Вмикати двосторонню фільтрацію «про всяк випадок» або тому, що так зручніше, не розуміючи наслідків для інших візуалізацій на сторінці.", "correct": "Залишайте фільтрацію односторонньою (від довідника до фактів) як стандарт; вмикайте двосторонню лише в конкретному, усвідомленому випадку, коли точно розумієте побічний ефект для інших фільтрів.", "why": "При двосторонній фільтрації вибір у фактовій таблиці неочікувано звужує довідник — користувач бачив 100 клієнтів, клікнув на графік і залишилось 15, не розуміючи, куди зникли інші.", "example": "Клік по стовпчику «Продажі у квітні» при двосторонній фільтрації одночасно звужує список клієнтів лише до тих, хто купував у квітні — хоча користувач очікував побачити тільки зміну графіка продажів."}, {"id": "B02-M09-L18-04", "block": 2, "module": 9, "lessonNum": 18, "lessonTitle": "Microsoft Power BI. Модель даних та її організація", "topic": "Один календар — одна точка входу для часу", "hw": "Модуль 9. ДЗ. Power BI — Power Query і модель даних", "type": "Лайфхак", "mistake": "Не створювати окрему таблицю календаря, а фільтрувати кожен графік по власному полю дати з фактової чи планової таблиці.", "correct": "Створюйте окрему таблицю календаря з безперервним діапазоном дат (через DAX) і звʼязуйте через неї всі таблиці з датами (факти, план) — тоді один селектор періоду одночасно фільтрує всі показники.", "why": "Без спільного календаря кожна таблиця з датою «живе своїм життям», і дні без подій просто зникають з графіка замість того, щоб показати нуль, а порівняти факт і план за один період стає неможливо.", "example": "Якщо продажі й план фільтруються кожен по своїй даті окремо, березневий графік продажів і березневий план можуть виглядати не синхронізованими; коли обидві таблиці звʼязані з одним календарем, вибір «Березень 2024» одразу узгоджено фільтрує обидві."}, {"id": "B02-M10-L19-01", "block": 2, "module": 10, "lessonNum": 19, "lessonTitle": "Основи роботи з візуалізаціями в Power BI", "topic": "Однойменні поля з різних таблиць", "hw": "", "type": "Помилка", "mistake": "Додавати у візуалізацію поле лише за назвою (наприклад, customer_id), не звіряючи, з якої саме таблиці воно взяте — з довідника чи з фактової таблиці.", "correct": "Перед додаванням поля перевіряйте в панелі «Дані», з якої таблиці воно береться: customer_id з довідника customers дає сталу кількість усіх клієнтів, а той самий customer_id з sales_clean — фактичну кількість покупців у розрізі.", "why": "Однойменні поля з різних таблиць несуть різний аналітичний сенс; вибір не того джерела дає технічно робочу, але безглузду цифру, яка непомітно псує весь звіт.", "example": "Поле customer_id з таблиці customers у розрізі категорій товару покаже однакову кількість «55» у кожній категорії — це всі клієнти без винятку, а не ті, хто купував саме цю категорію."}, {"id": "B02-M10-L19-02", "block": 2, "module": 10, "lessonNum": 19, "lessonTitle": "Основи роботи з візуалізаціями в Power BI", "topic": "Автоматична агрегація без перевірки", "hw": "", "type": "Помилка", "mistake": "Ставити галочку біля поля в панелі «Дані» і довіряти агрегації, яку Power BI підставив автоматично, не заглядаючи в контекстне меню поля.", "correct": "Після додавання будь-якого числового чи текстового поля відкривайте його контекстне меню у візуалізації і свідомо обирайте потрібну агрегацію (наприклад, «Кількість елементів (унікальних)» замість простого переліку значень).", "why": "Галочка — найшвидший спосіб додати поле, але саме тому Power BI сам вирішує роль і агрегацію за вас; для числових полів це часто «Сума» за замовчуванням, що не завжди відповідає задачі.", "example": "Поле customer_id, додане галочкою, спершу показує повний список покупців без агрегації; лише свідомий вибір «Кількість елементів (унікальних)» дає коректну цифру «55 покупців»."}, {"id": "B02-M10-L19-03", "block": 2, "module": 10, "lessonNum": 19, "lessonTitle": "Основи роботи з візуалізаціями в Power BI", "topic": "Ієрархія фільтрів: візуалізація, сторінка, звіт", "hw": "Модуль 10. ДЗ. Power BI — візуалізації", "type": "Помилка", "mistake": "Плутати рівні фільтрів — наприклад, накладати фільтр на кожну візуалізацію окремо, коли насправді потрібен один фільтр рівня сторінки, який діє на всі графіки одразу.", "correct": "Перед додаванням фільтра визначте його область дії: якщо обмеження стосується всього аркуша (наприклад, рік), використовуйте фільтр сторінки; якщо лише одного графіка — фільтр рівня візуалізації.", "why": "Фільтри нижчого рівня лише звужують дані, обмежені фільтром вищого рівня, а не розширюють їх; неправильний вибір рівня змушує дублювати одну й ту саму умову в кожній візуалізації або, навпаки, ненавмисно обмежує лише частину звіту.", "example": "Фільтр «Рік = 2024, 2025», доданий на рівень сторінки одним перетягуванням поля з календаря, одразу діє на всі візуалізації аркуша — не потрібно налаштовувати його окремо в кожному графіку."}, {"id": "B02-M10-L19-04", "block": 2, "module": 10, "lessonNum": 19, "lessonTitle": "Основи роботи з візуалізаціями в Power BI", "topic": "Керування взаємодіями (Edit interactions)", "hw": "Модуль 10. ДЗ. Power BI — візуалізації", "type": "Лайфхак", "mistake": "Залишати взаємодію між візуалізаціями в поведінці за замовчуванням, коли картка з загальною статистикою має лишатися незалежною, а вона щоразу змінюється при кліку на інший графік.", "correct": "Виділіть візуалізацію-джерело (наприклад, стовпчикову діаграму), перейдіть у «Формат → Змінити взаємодії» і явно вимкніть її вплив на картки, які мають показувати незалежний загальний підсумок.", "why": "Керування напрямом іде завжди від джерела: якщо не відключити взаємодію свідомо, картка «загальна кількість за рік» після кліку на графік раптом покаже дані лише для обраної категорії, і користувач сприйме це як помилку звіту.", "example": "Клік по категорії товару в барплоті за замовчуванням змінює число на картці «Всього товарів»; після вимкнення взаємодії для цього барплота картка стабільно показує загальну суму незалежно від вибору категорії."}, {"id": "B02-M10-L20-01", "block": 2, "module": 10, "lessonNum": 20, "lessonTitle": "Основи налаштувань візуалізацій в Power BI", "topic": "Галочки замість ролей у складній візуалізації", "hw": "", "type": "Помилка", "mistake": "Наповнювати комбіновану (стовпчики + лінія) або іншу складну візуалізацію галочками, розраховуючи, що Power BI сам правильно розподілить поля між віссю, стовпчиками, лінією та легендою.", "correct": "Для візуалізацій з кількома ролями полів (комбінована діаграма, матриця, розсіювання) перетягуйте кожне

алежного графіка явно створювати нову фігуру — plt.figure(), або в кінці кожної клітинки з графіком викликати plt.show() (він завершує поточну фігуру) чи plt.close(). Це особливо важливо в ноутбуках, де клітинки типово виконуються повторно і не строго по порядку.", "why": "Змішані лінії з двох різних графіків на одному зображенні — це не помилка виконання коду, а невірна візуальна репрезентація даних, яку легко не помітити одразу, особливо якщо звіт готується поспіхом.", "example": "plt.figure()              # явно новий аркуш\nplt.plot(x1, y1)\nplt.show()\n\nplt.figure()              # ще один явно новий аркуш - без цього ризик накладання\nplt.plot(x2, y2)\nplt.show()"}, {"id": "B03-M18-L36-02", "block": 3, "module": 18, "lessonNum": 36, "lessonTitle": "Використання додаткових бібліотек. Візуалізації", "topic": "Розмірність масиву Axes залежить від розміру сітки subplots", "hw": "", "type": "Помилка", "mistake": "Писати код звернення до графіків через подвійний індекс ax[x][y], розрахований на сітку nrows=2, ncols=2, а потім змінити кількість рядків чи стовпців на 1 — plt.subplots(nrows=1, ncols=1) повертає не масив, а один Axes, а nrows=1, ncols=N повертає одновимірний масив, тому ax[x][y] викине TypeError або IndexError.", "correct": "Перевіряти форму сітки перед індексацією: для 1×1 звертатися напряму до ax без індексів, для 1×N або N×1 — одним індексом ax[i], і лише для N×M з обома вимірами більше 1 — подвійним ax[x][y]. Якщо код має працювати з будь-якою кількістю панелей — одразу створювати ax як плоский масив через ax.flatten() і звертатися одним індексом завжди.", "why": "Це найчастіша причина, чому робочий код subplots раптово ламається під час звичайного експериментування — коли аналітик тимчасово зменшує кількість панелей для швидкої перевірки, а індексація в коді нижче лишається розрахованою на попередню форму сітки.", "example": "fig, ax = plt.subplots(nrows=2, ncols=2)\nax[0][1].plot(x, y)          # ОК для сітки 2x2\n\nfig, ax = plt.subplots(nrows=1, ncols=1)\n# ax[0][0].plot(x, y)        # TypeError - ax тут єдиний Axes, не масив\nax.plot(x, y)                # правильно для 1x1\n\nfig, ax = plt.subplots(nrows=2, ncols=2)\nax = ax.flatten()            # універсально - завжди плаский масив, один індекс\nax[1].plot(x, y)"}, {"id": "B03-M18-L36-03", "block": 3, "module": 18, "lessonNum": 36, "lessonTitle": "Використання додаткових бібліотек. Візуалізації", "topic": "Довірчий інтервал barplot вводить в оману на скошених даних", "hw": "", "type": "Помилка", "mistake": "Довіряти вузьким \"вусам\" довірчого інтервалу на sns.barplot() як ознаці стабільної середньої оцінки, не перевіривши форму розподілу вихідних даних. На даних із сильними викидами чи скошеним \"хвостом\" середнє й довірчий інтервал навколо нього можуть виглядати \"охайно\", приховуючи, що більшість спостережень насправді істотно відрізняється від показаного середнього.", "correct": "Перед тим як подавати barplot із середніми як фінальний висновок, звірити його з boxplot() або histplot() для тих самих даних — якщо розподіл сильно скошений, у звіті варто показати медіану поруч із середнім або пояснити, чому саме середнє інформативне в цьому випадку.", "why": "Барплот із середніми — найпоширеніший тип графіка в презентаціях для нетехнічної аудиторії, і саме тому помилкова інтерпретація \"охайного\" середнього на скошених даних найбільш ризикована: вона напряму потрапляє в рішення стейкхолдерів, які не бачать вихідного розподілу.", "example": "# Барплот виглядає 'охайно', але приховує скошеність\nsns.barplot(taxis, x='pickup_borough', y='total')\n\n# Перевірка форми розподілу перед тим, як довіряти середньому\nsns.boxplot(taxis, x='pickup_borough', y='total')\nprint(taxis.groupby('pickup_borough')['total'].agg(['mean', 'median']))"}, {"id": "B03-M18-L36-04", "block": 3, "module": 18, "lessonNum": 36, "lessonTitle": "Використання додаткових бібліотек. Візуалізації", "topic": "Кругова діаграма ховає відфільтровані дані за 100%", "hw": "", "type": "Помилка", "mistake": "Будувати plt.pie() на підмножині даних (наприклад, топ-4 категорії) — Matplotlib автоматично нормалізує передані значення так, щоб вони в сумі давали рівно 100% кола, незалежно від того, чи представляють ці категорії справді весь обсяг даних. Глядач бачить \"повне коло\" і сприймає його як 100% від загального, хоча насправді це 100% лише від показаної вибірки.", "correct": "Перед побудовою кругової діаграми явно перевіряти й показувати в підписі, яку частку від загального обсягу представляють відображені категорії. Якщо відфільтровані дані суттєві — додати категорію \"Інше\" замість того, щоб їх просто відкинути.", "why": "Кругова діаграма за задумом читається як \"розподіл усього цілого\" — і мовчазне звуження вибірки перед побудовою прямо суперечить тому, як аудиторія інтуїтивно її інтерпретує, що робить цей тип графіка особливо вразливим до випадкового введення в оману.", "example": "top_boroughs = borough_rides.nlargest(4, 'pickup')\ntotal_all    = borough_rides['pickup'].sum()\ntotal_shown  = top_boroughs['pickup'].sum()\n\nplt.pie(top_boroughs['pickup'], labels=top_boroughs['pickup_borough'], autopct='%.1f%%')\nplt.title(f'Топ-4 райони ({total_shown/total_all:.0%} від загальної кількості поїздок)')"}, {"id": "B03-M18-L36-05", "block": 3, "module": 18, "lessonNum": 36, "lessonTitle": "Використання додаткових бібліотек. Візуалізації", "topic": "ID-подібні числові стовпці спотворюють кореляційну теплову карту", "hw": "", "type": "Помилка", "mistake": "Викликати df.corr(numeric_only=True) і одразу будувати sns.heatmap() на результаті, не переглянувши, які стовпці потрапили до матриці. numeric_only=True включає будь-який стовпець із числовим типом даних — зокрема технічні ідентифікатори (order_id, коди категорій) — хоча кореляція з такими стовпцями обчислюється математично коректно, але не має жодного змістовного значення.", "correct": "Перед побудовою .corr() явно відібрати список змістовних числових метрик (df[['total', 'distance', 'fare', 'tip']].corr()), а не покладатися на автоматичний відбір за типом даних. Ідентифікатори, коди й закодовані категорії виключати з кореляційного аналізу свідомо.", "why": "Випадковий \"сильний\" коефіцієнт кореляції з ідентифікатором виглядає на heatmap так само переконливо, як і справжній звʼязок між метриками, і без уважного перегляду списку стовпців легко потрапляє у висновки чи навіть у список ознак для подальшої моделі.", "example": "# Ризиковано - order_id потрапить у матрицю як 'числовий' стовпець\ncorr = taxis.corr(numeric_only=True)\n\n# Надійніше - явний список змістовних метрик\ncorr = taxis[['total', 'distance', 'fare', 'tip', 'tolls']].corr()\nsns.heatmap(corr, annot=True, cmap='coolwarm', vmin=-1, vmax=1)"}, {"id": "B03-M19-L37-01", "block": 3, "module": 19, "lessonNum": 37, "lessonTitle": "Основи статистичного аналізу в Python", "topic": "Тест Шапіро-Вілка на великих вибірках майже завжди \"відхиляє\" нормальність", "hw": "", "type": "Помилка", "mistake": "Використовувати результат stats.shapiro() як остаточний критерій \"нормальний чи ні\" на вибірці в тисячі спостережень — типовий розмір реального A/B тесту. Потужність тесту на нормальність зростає з розміром вибірки, тому на великих n навіть незначні, практично неважливі відхилення від ідеальної нормальної форми дають p < 0.05.", "correct": "На великих вибірках покладатися не на формальний тест, а на візуальну перевірку (гістограма, Q-Q plot) і на розрахунок за ЦГТ: якщо розмір вибірки достатній, розподіл середніх буде нормальним незалежно від формального результату Шапіро-Вілка на самих сирих даних.", "why": "Сліпе слідування формальному тесту на великих реальних A/B-вибірках майже завжди \"забороняє\" стандартні параметричні методи (t-тест, Z-тест) навіть тоді, коли вони абсолютно коректні завдяки ЦГТ, і штовхає до зайвого ускладнення аналізу там, де це не потрібно.", "example": "# На великій вибірці Шапіро майже завжди дає p < 0.05\nstat, p = stats.shapiro(large_sample)   # n=5000 - p часто < 0.05 навіть при 'майже нормальних' даних\n\n# Надійніший орієнтир на великих n - розмір вибірки та ЦГТ, а не формальний p-value тесту нормальності"}, {"id": "B03-M19-L37-02", "block": 3, "module": 19, "lessonNum": 37, "lessonTitle": "Основи статистичного аналізу в Python", "topic": "Поріг ЦГТ для пропорцій відрізняється від порогу для середніх", "hw": "", "type": "Помилка", "mistake": "Застосовувати загальне правило \"20-30 спостережень достатньо для ЦГТ\" (працює для середніх неперервної величини) до метрик-конверсій із дуже низькою базовою часткою — при малому n нормальне наближення біноміального розподілу ще не встигає \"увімкнутися\", і Z-тест для пропорцій стає ненадійним.", "correct": "Для пропорцій використовувати окреме правило: нормальне наближення прийнятне, коли n·p ≥ 5 і n·(1-p) ≥ 5 (у деяких підходах — поріг 10) для кожної групи. При низькій базовій конверсії це правило вимагає значно більшого n, ніж загальні \"20-30\" для середніх.", "why": "При рідкісних подіях (низька конверсія, рідкісні помилки чи звернення) саме це правило, а не загальне правило ЦГТ для середніх, визначає мінімальний розмір вибірки для коректного застосування Z-тесту — і воно, як правило, вимагає розмір на порядок більший.", "example": "baseline_p = 0.005    # конверсія 0.5%\nn = 3000\nprint(n * baseline_p, n * (1 - baseline_p))   # 15.0  2985.0 - на межі правила n*p>=5\n\n# При baseline_p = 0.005 і n=500: n*p = 2.5 - недостатньо, наближення ненадійне"}, {"id": "B03-M19-L37-03", "block": 3, "module": 19, "lessonNum": 37, "lessonTitle": "Основи статистичного аналізу в Python", "topic": "np.log() на даних з нульовими значеннями", "hw": "", "type": "Помилка", "mistake": "Застосувати логарифмічне перетворення (np.log()) до long-tailed метрики на кшталт доходу з користувача, не врахувавши, що частина спостережень дорівнює нулю (користувачі без покупки). log(0) не визначений — Python поверне -inf або RuntimeWarning, і подальші розрахунки на такому масиві стають некоректними.", "correct": "Для даних з нульовими значеннями використовувати np.log1p(x) (обчислює log(1 + x), коректно визначений при x = 0) замість np.log(x), або явно відфільтрувати нульові спостереження в окрему групу перед перетворенням.", "why": "Ефект часто непомітний одразу — -inf у кількох рядках не завжди спричиняє явну помилку виконання, але тихо псує будь-яку подальшу агрегацію (mean(), std()) по всьому стовпцю, роблячи результат некоректним без явного повідомлення про причину.", "example": "revenue = np.array([120, 0, 340, 0, 89])\n# np.log(revenue)     # [4.79, -inf, 5.83, -inf, 4.49] - -inf псує подальші розрахунки\n\nlog_revenue = np.log1p(revenue)   # log(1+x) - коректно визначений для x=0"}, {"id": "B03-M19-L37-04", "block": 3, "module": 19, "lessonNum": 37, "lessonTitle": "Основи статистичного аналізу в Python", "topic": "Бутстреп вимагає вибірки з поверненням", "hw": "", "type": "Помилка", "mistake": "Реалізувати \"бутстреп\" для оцінки довірчого інтервалу через data.sample(n) без параметра replace=True — за замовчуванням .sample() у Pandas вибирає без повернення, тобто дає підвибірку вихідних даних, а не справжній бутстреп-семпл, і дає систематично занижену варіативність оцінки.", "correct": "Для бутстреп-оцінки завжди явно вказувати replace=True: data.sample(n=len(data), replace=True). Кожен бутстреп-семпл має бути того самого розміру, що й оригінальна вибірка, і формуватися з поверненням.", "why": "Довірчий інтервал, порахований на \"бутстрепі\" без повернення, не має статистичного обґрунтування — він не оцінює справжню варіативність вибіркової статистики, а лише перемішує наявні дані, що може дати оманливо вузький або некоректний інтервал.", "example": "# Некоректний 'бутстреп' - без повернення\nwrong_boot = [tips['tip'].sample(30).mean() for _ in range(1000)]\n\n# Правильний бутстреп - з поверненням, розмір семпла = розмір вибірки\nboot_means = [tips['tip'].sample(n=len(tips), replace=True).mean() for _ in range(1000)]\nci_lo, ci_hi = np.percentile(boot_means, [2.5, 97.5])"}, {"id": "B03-M19-L37-05", "block": 3, "module": 19, "lessonNum": 37, "lessonTitle": "Основи статистичного аналізу в Python", "topic": "Одностороння vs двостороння гіпотеза — рішення до, а не після тесту", "hw": "", "type": "Помилка", "mistake": "Обирати односторонній тест (alternative='greater' замість 'two-sided') вже після того, як попередньо побачено напрямок різниці в даних — це штучно занижує поріг значущості для вже \"підказаного\" напрямку і підвищує реальну ймовірність помилки першого роду порівняно з заявленими 5%.", "correct": "Рішення \"односторонній чи двосторонній тест\" приймати одночасно з формулюванням гіпотези, до збору чи перегляду даних тесту. Двосторонній варіант — безпечний дефолт, доречний майже завжди, окрім рідкісних явно обґрунтованих заздалегідь випадків.", "why": "Вибір напрямку тесту заднім числом, підлаштований під уже отриманий результат, — це форма підглядання (p-hacking), яка робить заявлений рівень значущості фіктивним: реальна ймовірність хибно \"значущого\" результату вища за задекларовані 5%.", "example": "# Ризиковано - обрано 'greater' вже після того, як побачили напрямок різниці\nstat, p = stats.ttest_ind(treatment, control, alternative='greater')\n\n# Правильно - тип тесту фіксується у плані експерименту заздалегідь,\n# і за замовчуванням це двосторонній варіант\nstat, p = stats.ttest_ind(treatment, control, alternative='two-sided')"}, {"id": "B03-M19-L38-01", "block": 3, "module": 19, "lessonNum": 38, "lessonTitle": "Основи A/B тестування. Реалізація тесту", "topic": "Один пройдений A/A тест — недостатній доказ коректності системи", "hw": "", "type": "Помилка", "mistake": "Провести один A/A тест, отримати p > 0.05 і вважати це остаточним підтвердженням, що інфраструктура рандомізації й трекінгу працює без систематичних помилок.", "correct": "Пам'ятати, що за визначенням близько 5% справжніх A/A тестів покажуть \"значущу\" різницю суто випадково — це не помилка системи, а сама природа α = 0.05. Один пройдений A/A тест — позитивний, але не остаточний сигнал; для впевненості варто прогнати кілька A/A тестів або спиратися на регулярний SRM-моніторинг у часі.", "why": "Команда, що один раз \"перевірила систему через A/A тест\" і більше до цього не повертається, ризикує пропустити саме той рідкісний випадок, коли одноразовий A/A тест випадково \"пройшов\" попри реальну системну проблему — а наступний реальний A/B тест дасть недостовірний результат.", "example": "# Один A/A тест - обмежений доказ\nstat, p = proportions_ztest([conv_a1, conv_a2], [n_a1, n_a2])\n# p = 0.43 - добре, але саме по собі не гарантує відсутність системної проблеми\n\n# Надійніше - регулярний SRM-моніторинг у кожному наступному тесті,\n# а не одноразова перевірка перед запуском інфраструктури"}, {"id": "B03-M19-L38-02", "block": 3, "module": 19, "lessonNum": 38, "lessonTitle": "Основи A/B тестування. Реалізація тесту", "topic": "Guardrail-метрикам потрібен власний поріг, визначений заздалегідь", "hw": "", "type": "Помилка", "mistake": "Заявити guardrail-метрику (наприклад, утримання чи скарги користувачів) як предмет моніторингу під час тесту, але не визначити заздалегідь, наскільки її зміна вважається неприйнятною — рішення \"зупиняти тест чи ні\" приймається ситуативно, вже під час спостереження.", "correct": "Для кожної guardrail-метрики визначати конкретний поріг ще на етапі планування тесту (наприклад, \"зупинити тест, якщо Day-7 retention впаде більш ніж на X% при скоригованому рівні значущості\") — так само дисципліновано, як для первинної метрики.", "why": "Guardrail-метрики існують спеціально для того, щоб прибрати субʼєктивність із рішень під час тесту — але без заздалегідь визначеного порогу вони самі стають лазівкою для того самого підглядання й довільної інтерпретації, від якого мали захищати.", "example": "# Без порогу - рішення ситуативне під час моніторингу\n# 'ретеншн трохи просів, треба подумати' - суб'єктивно, вирішується заднім числом\n\n# З порогом, визначеним заздалегідь у плані тесту:\n# 'зупинити тест, якщо Day-7 retention нижчий за baseline - 3 п.п. при p < 0.01'"}, {"id": "B03-M19-L38-03", "block": 3, "module": 19, "lessonNum": 38, "lessonTitle": "Основи A/B тестування. Реалізація тесту", "topic": "Для раннього моніторингу — послідовне тестування, а не заборона дивитись", "hw": "", "type": "Лайфхак", "mistake": "Вважати єдиним рішенням проблеми підглядання повну заборону перевіряти проміжні результати аж до досягнення розрахованого розміру вибірки — навіть коли є реальна операційна потреба вчасно помітити серйозну проблему.", "correct": "Якщо команді дійсно потрібна можливість зупинити тест раніше, використовувати методи послідовного тестування (group sequential design, alpha-spending), які спеціально контролюють сумарну ймовірність помилки першого роду за кількох \"поглядів\" на дані.", "why": "Просто не дивитись — організаційно крихке правило, яке порушується під тиском стейкхолдерів; метод, спеціально розроблений для контрольованих проміжних перевірок, вирішує ту саму бізнес-потребу (раннє виявлення проблеми), не жертвуючи статистичною коректністю.", "example": "# Замість спонтанного погляду на p-value на 5-й день з 15 запланованих:\n# заздалегідь закласти в план тесту 2-3 контрольні точки\n# з методом alpha-spending, де кожна точка перевірки має власний скоригований поріг значущості"}, {"id": "B03-M19-L38-04", "block": 3, "module": 19, "lessonNum": 38, "lessonTitle": "Основи A/B тестування. Реалізація тесту", "topic": "Кілька вторинних метрик без поправки завищують шанс хибного \"інсайту\"", "hw": "", "type": "Помилка", "mistake": "Перевіряти статистичну значущість для десятка вторинних метрик так само, як для первинної, і вважати \"значущою знахідкою\" будь-яку з них, де p < 0.05 — при 10 незалежних перевірках на рівні α = 0.05 ймовірність отримати хоча б один хибно \"значущий\" результат суто випадково наближається до 40%.", "correct": "Вторинні метрики трактувати як дослідницькі: значущий результат по вторинній метриці — привід сформулювати нову гіпотезу і перевірити її окремим тестом, а не самостійна підстава для рішення. Для формального висновку одразу по кількох метриках застосовувати поправку на множинні порівняння (наприклад, поправку Бонферроні: ділити α на кількість перевірених метрик).", "why": "Саме так у звітах зʼявляються переконливо звучні, але статистично випадкові \"інсайти\" на кшталт \"тест не вплинув на конверсію, зате значуще підвищив час на сайті серед користувачів Android у вихідні\" — знахідка, що не відтворюється в наступному тесті.", "example": "alpha = 0.05\nn_secondary_metrics = 10\nalpha_corrected = alpha / n_secondary_metrics   # поправка Бонферроні: 0.005\n\n# Значущим по вторинній метриці вважати результат лише при p < alpha_corrected"}, {"id": "B03-M19-L38-05", "block": 3, "module": 19, "lessonNum": 38, "lessonTitle": "Основи A/B тестування. Реалізація тесту", "topic": "SRM-перевірка на дуже малій вибірці дає хибні тривоги", "hw": "", "type": "Помилка", "mistake": "Запускати перевірку SRM (chisquare на розподілі груп) одразу з першого дня тесту, коли в кожній групі лише кілька десятків спостережень — на такому малому обсязі випадкове відхилення від ідеального 50/50 є нормою, і chi-square тест може регулярно \"сигналити\" про SRM там, де реальної проблеми немає.", "correct": "Перевіряти SRM після накопичення розумного мінімуму спостережень у кожній групі (наприклад, кількасот), а не з першого дня. Якщо потрібен моніторинг з самого початку — оцінювати не сам факт відхилення, а його стійкість у часі: одноразовий \"сплеск\" на малих числах не привід зупиняти тест, стабільне відхилення на зростаючій вибірці — привід.", "why": "Передчасні хибні тривоги SRM підривають довіру команди до самого механізму перевірки — після кількох хибних спрацьовувань на малих числах на реальний сигнал SRM пізніше можуть відреагувати з запізненням або взагалі проігнорувати його.", "example": "# Ризиковано - перевірка SRM на 1-й день тесту, по 40 спостережень у групі\nobserved_day1 = [23, 17]      # природне коливання на малих числах\n\n# Надійніше - перевіряти SRM після накопичення мінімум кількасот на групу\nobserved_week1 = [2418, 2582]\nstat, p = chisquare(observed_week1, f_exp=[2500, 2500])"}];

let state = { block: 1, module: 1, search: "", type: "all" };

function escapeHtml(str){
  return (str || "").replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}

function renderBlockNav(){
  const nav = document.getElementById("blockNav");
  nav.innerHTML = "";
  BLOCKS.forEach(b => {
    const btn = document.createElement("button");
    btn.className = (b.id === state.block ? "on" : "");
    btn.disabled = !b.enabled;
    btn.innerHTML = '<span class="dot"></span>' + escapeHtml(b.title) + (b.enabled ? "" : '<span class="soon">незабаром</span>');
    if (b.enabled){
      btn.addEventListener("click", () => {
        state.block = b.id; state.module = b.modules[0];
        renderAll();
        window.scrollTo({top:0, left:0, behavior:'instant'});
        updateReadProgress();
      });
    }
    nav.appendChild(btn);
  });
}

function renderModuleNav(){
  const nav = document.getElementById("moduleNav");
  nav.innerHTML = "";
  const block = BLOCKS.find(b => b.id === state.block);
  block.modules.forEach(m => {
    const hasData = DATA.some(r => r.module === m);
    const btn = document.createElement("button");
    btn.className = "side-item" + (m === state.module ? " on" : "");
    btn.disabled = !hasData;
    btn.innerHTML = '<span>Модуль ' + m + '</span>' + (hasData ? '' : '<span class="soon">незабаром</span>');
    if (hasData){
      btn.addEventListener("click", () => {
        state.module = m;
        renderCards(); renderModuleNav(); renderBanner();
        window.scrollTo({top:0, left:0, behavior:'instant'});
        updateReadProgress();
      });
    }
    nav.appendChild(btn);
  });
}

function updateReadProgress(){
  const scrollTop = window.scrollY || document.documentElement.scrollTop || 0;
  const scrollable = document.documentElement.scrollHeight - window.innerHeight;
  const pct = scrollable > 0 ? Math.min(100, Math.max(0, Math.round((scrollTop / scrollable) * 100))) : 100;
  const pctEl = document.getElementById("progressPct");
  const fillEl = document.getElementById("progressFill");
  if (pctEl) pctEl.textContent = pct + "%";
  if (fillEl) fillEl.style.width = pct + "%";
}

let progressTicking = false;
window.addEventListener("scroll", () => {
  if (!progressTicking){
    window.requestAnimationFrame(() => { updateReadProgress(); progressTicking = false; });
    progressTicking = true;
  }
}, {passive:true});
window.addEventListener("resize", updateReadProgress);

function renderBanner(){
  const info = MODULE_TITLES[state.module] || {title:"", desc:""};
  const el = document.getElementById("moduleBanner");
  el.innerHTML = `
    <div class="module-banner">
      <span class="tag">Блок ${state.block} · Модуль ${state.module}</span>
      <h2>${escapeHtml(info.title)}</h2>
      ${info.desc ? `<p class="desc">${escapeHtml(info.desc)}</p>` : ""}
    </div>
  `;
}

function matchesFilter(rec){
  if (state.type !== "all" && rec.type !== state.type) return false;
  if (state.search){
    const q = state.search.toLowerCase();
    const hay = [rec.topic, rec.mistake, rec.correct, rec.why, rec.example, rec.hw].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function renderCards(){
  const container = document.getElementById("lessonsContainer");
  container.innerHTML = "";

  const moduleRecords = DATA.filter(r => r.module === state.module);
  const lessonNums = [...new Set(moduleRecords.map(r => r.lessonNum))].sort((a,b)=>a-b);
  let totalShown = 0;
  let cardIndex = 0;

  lessonNums.forEach(ln => {
    const lessonRecs = moduleRecords.filter(r => r.lessonNum === ln);
    const visible = lessonRecs.filter(matchesFilter);
    if (visible.length === 0) return;
    totalShown += visible.length;

    const lessonTitle = lessonRecs[0].lessonTitle;
    const heading = document.createElement("div");
    heading.className = "lesson-heading";
    heading.innerHTML = '<span class="lnum">Урок ' + ln + '</span><h2>' + escapeHtml(lessonTitle) + '</h2>';
    container.appendChild(heading);

    const cardsWrap = document.createElement("div");
    cardsWrap.className = "cards";

    visible.forEach(rec => {
      cardIndex++;
      const isError = rec.type === "Помилка";
      const typeMarker = isError ? "●" : "★";
      const typeLabel = isError ? "Помилка" : "Лайфхак";
      const badgeClass = isError ? "type-error" : "type-lifehack";
      const firstCalloutClass = isError ? "c-error" : "c-tip";
      const firstCalloutLabel = isError ? "Типова помилка" : "Лайфхак";

      const card = document.createElement("div");
      card.className = "tip-card";
      card.innerHTML = `
        <div class="tip-head">
          <div>
            <div class="tip-title">${cardIndex}. ${escapeHtml(rec.topic)}</div>
            <div class="tip-id">${escapeHtml(rec.id)}</div>
          </div>
          <div class="tip-badges">
            <span class="badge ${badgeClass}">${typeMarker} ${typeLabel}</span>
            ${rec.hw ? `<span class="badge hw">ДЗ: ${escapeHtml(rec.hw)}</span>` : ""}
          </div>
        </div>
        <div class="callout ${firstCalloutClass}">
          <div class="chead"><span class="mark">${typeMarker}</span>${firstCalloutLabel}</div>
          <p>${escapeHtml(rec.mistake)}</p>
        </div>
        <div class="callout c-how">
          <div class="chead"><span class="mark">✓</span>Як правильно</div>
          <p>${escapeHtml(rec.correct)}</p>
        </div>
        <div class="callout c-why">
          <div class="chead"><span class="mark">◆</span>Чому це важливо</div>
          <p>${escapeHtml(rec.why)}</p>
        </div>
        <div class="callout c-ex">
          <div class="chead"><span class="mark">▶</span>Приклад</div>
          <p>${escapeHtml(rec.example)}</p>
        </div>
      `;
      cardsWrap.appendChild(card);
    });

    container.appendChild(cardsWrap);
  });

  document.getElementById("resultCount").textContent = totalShown + " з " + moduleRecords.length + " порад";
  if (totalShown === 0){
    container.innerHTML = '<div class="empty-state">Нічого не знайдено за цим фільтром.</div>';
  }
}

function renderAll(){
  renderBlockNav();
  renderModuleNav();
  renderBanner();
  renderCards();
  updateReadProgress();
}

document.getElementById("searchInput").addEventListener("input", (e) => { state.search = e.target.value.trim(); renderCards(); });
document.getElementById("typeFilter").addEventListener("change", (e) => { state.type = e.target.value; renderCards(); });

renderAll();
</script>

</body>
</html>

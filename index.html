<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рекомендації ментора — Data Analytics</title>
<style>
  :root{
    --bg:#ffffff;
    --bg-alt:#f7f7f8;
    --text:#111114;
    --text-dim:#57575f;
    --line:#e2e2e6;
    --accent:#111114;
    --error:#111114;
    --lifehack:#111114;
    --tag-bg:#111114;
    --tag-text:#ffffff;
    --code-bg:#f2f2f4;
    --disabled:#b7b7bf;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
  }
  a{color:inherit;}

  header.site-header{
    border-bottom:1px solid var(--line);
    padding:18px 28px 0 28px;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:20;
  }
  .header-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:6px 20px;
    margin-bottom:14px;
  }
  .site-title{
    font-size:19px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .site-title .dim{color:var(--text-dim);font-weight:500;}
  .site-sub{
    font-size:12.5px;
    color:var(--text-dim);
  }

  nav.block-nav{
    display:flex;
    gap:2px;
    overflow-x:auto;
  }
  .block-btn{
    border:none;
    background:transparent;
    padding:10px 16px;
    font-size:13.5px;
    font-weight:600;
    color:var(--text-dim);
    cursor:pointer;
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .block-btn.active{
    color:var(--text);
    border-bottom:2px solid var(--text);
  }
  .block-btn:disabled{
    color:var(--disabled);
    cursor:not-allowed;
  }
  .block-btn .soon{
    font-size:10.5px;
    font-weight:600;
    color:var(--disabled);
    margin-left:6px;
  }

  .layout{
    display:grid;
    grid-template-columns:220px 1fr;
    max-width:1180px;
    margin:0 auto;
    min-height:calc(100vh - 96px);
  }
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
    aside.module-nav{
      border-right:none;
      border-bottom:1px solid var(--line);
    }
  }

  aside.module-nav{
    border-right:1px solid var(--line);
    padding:18px 10px 40px 10px;
  }
  .module-nav-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-dim);
    padding:4px 10px 8px 10px;
  }
  .module-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    width:100%;
    text-align:left;
    border:none;
    background:transparent;
    padding:8px 10px;
    border-radius:6px;
    font-size:13.5px;
    color:var(--text);
    cursor:pointer;
  }
  .module-item:hover{background:var(--bg-alt);}
  .module-item.active{background:var(--text);color:#fff;}
  .module-item:disabled{
    color:var(--disabled);
    cursor:not-allowed;
  }
  .module-item .n{font-weight:600;}
  .module-item .soon-dot{
    font-size:10px;
    color:var(--disabled);
  }
  .module-item.active .soon-dot{color:#cfcfe0;}

  main.content{
    padding:24px 28px 80px 28px;
    min-width:0;
  }

  .module-heading{
    margin:0 0 4px 0;
    font-size:20px;
    font-weight:700;
  }
  .module-heading-sub{
    color:var(--text-dim);
    font-size:13px;
    margin-bottom:18px;
  }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-bottom:22px;
    padding:12px 14px;
    background:var(--bg-alt);
    border-radius:10px;
  }
  .toolbar input[type="search"]{
    flex:1 1 220px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:13.5px;
    background:#fff;
  }
  .toolbar select{
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:13.5px;
    background:#fff;
    color:var(--text);
  }
  .toolbar .count{
    font-size:12.5px;
    color:var(--text-dim);
    margin-left:auto;
  }

  .lesson-block{
    margin-bottom:34px;
  }
  .lesson-block h2{
    font-size:15.5px;
    font-weight:700;
    margin:0 0 2px 0;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .lesson-block h2 .lesson-num{color:var(--text-dim);font-weight:600;}

  .cards{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
    margin-top:14px;
  }

  .card{
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    background:#fff;
  }
  .card-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .card-topic{
    font-size:15px;
    font-weight:700;
  }
  .card-id{
    font-size:11px;
    color:var(--text-dim);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .badges{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    align-items:center;
  }
  .badge{
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:3px 8px;
    border-radius:100px;
    border:1px solid var(--line);
    white-space:nowrap;
  }
  .badge.type-error{background:var(--tag-bg);color:var(--tag-text);border-color:var(--tag-bg);}
  .badge.type-lifehack{background:#fff;color:var(--text);border-color:var(--text);}
  .badge.hw{background:var(--bg-alt);color:var(--text-dim);border-color:var(--line);font-weight:600;text-transform:none;letter-spacing:0;}

  .field{
    margin-top:10px;
  }
  .field-label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--text-dim);
    margin-bottom:3px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .field-label .marker{font-size:12px;}
  .field-text{
    font-size:13.8px;
    color:var(--text);
  }
  .field-text.example{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12.6px;
    background:var(--code-bg);
    padding:8px 10px;
    border-radius:7px;
    white-space:pre-wrap;
    word-break:break-word;
  }

  .empty-state{
    padding:40px 10px;
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
  }

  footer.site-footer{
    border-top:1px solid var(--line);
    padding:22px 28px 40px 28px;
    text-align:center;
    color:var(--text-dim);
    font-size:12.5px;
  }

  /* dark mode */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111114;
      --bg-alt:#1b1b1f;
      --text:#f2f2f4;
      --text-dim:#9a9aa5;
      --line:#2c2c32;
      --tag-bg:#f2f2f4;
      --tag-text:#111114;
      --code-bg:#1b1b1f;
      --disabled:#55555f;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111114;
    --bg-alt:#1b1b1f;
    --text:#f2f2f4;
    --text-dim:#9a9aa5;
    --line:#2c2c32;
    --tag-bg:#f2f2f4;
    --tag-text:#111114;
    --code-bg:#1b1b1f;
    --disabled:#55555f;
  }
  body{background:var(--bg);}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-top">
    <div>
      <div class="site-title">Рекомендації ментора <span class="dim">— Data Analytics</span></div>
      <div class="site-sub">GoIT · курс «Data Analyst» (програма Restart / Потоки 37+) · чекліст типових помилок і лайфхаків по модулях</div>
    </div>
  </div>
  <nav class="block-nav" id="blockNav"></nav>
</header>

<div class="layout">
  <aside class="module-nav">
    <div class="module-nav-title">Модулі блоку</div>
    <div id="moduleNav"></div>
  </aside>

  <main class="content">
    <div id="moduleHeading"></div>

    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Пошук по темі, помилці, прикладу…">
      <select id="typeFilter">
        <option value="all">Усі типи</option>
        <option value="Помилка">Тільки помилки</option>
        <option value="Лайфхак">Тільки лайфхаки</option>
      </select>
      <span class="count" id="resultCount"></span>
    </div>

    <div id="lessonsContainer"></div>
  </main>
</div>

<footer class="site-footer">
  Матеріал для менторів курсу Data Analyst · оновлюється по модулях · Успіхів! 🎓
</footer>

<script>
const DATA = [{"id": "B01-M01-L01-01", "block": 1, "module": 1, "lessonNum": 1, "lessonTitle": "Основи Data Analytics: Поняття, цінність, ролі", "topic": "Роль аналітика та бізнес-контекст", "hw": "", "type": "Помилка", "mistake": "Вважати, що робота аналітика закінчується на «зробити графік/дашборд», і не перекладати результат назад мовою бізнесу.", "correct": "Перед аналізом сформулюйте бізнес-питання одним реченням; після аналізу — одним реченням, що цифра означає для бізнесу (гроші, клієнти, ризик).", "why": "Без цього кроку виходить технічно правильний, але марний для менеджера звіт — типова причина, чому junior-роботу «не приймають».", "example": "Погано: «Конверсія впала на 5%». Добре: «Конверсія впала на 5% через складну форму оплати — це \\~200 000 грн втраченої виручки на місяць»."}, {"id": "B01-M01-L01-02", "block": 1, "module": 1, "lessonNum": 1, "lessonTitle": "Основи Data Analytics: Поняття, цінність, ролі", "topic": "KPI vs звичайна метрика", "hw": "", "type": "Помилка", "mistake": "Тягнути у звіт усі метрики підряд, вважаючи кожну «KPI», без звʼязку з ціллю бізнесу.", "correct": "Перед тим як назвати щось KPI, перевірте: чи ця цифра напряму повʼязана з поточною ціллю компанії/відділу. Немає звʼязку — це просто супутня метрика.", "why": "Звіт з 20 метриками без пріоритету менеджер не читає; звіт з 2-3 KPI дає підставу для рішення.", "example": "Ціль кварталу — утримання клієнтів → KPI: % повторних покупок. «Кількість кліків на банер» тут лише контекст, не KPI."}, {"id": "B01-M01-L01-04", "block": 1, "module": 1, "lessonNum": 1, "lessonTitle": "Основи Data Analytics: Поняття, цінність, ролі", "topic": "Життєвий цикл даних (Data Pipeline)", "hw": "", "type": "Лайфхак", "mistake": "Сприймати 8 етапів пайплайна як жорсткий сценарій, який завжди виконується повністю й по порядку.", "correct": "Ставтеся до 8 етапів як до чек-листа, а не інструкції: етапи можна пропускати, міняти місцями і повторювати залежно від задачі.", "why": "Очікування «правильної» лінійної послідовності змушує губити час на етапи, які в конкретній задачі не потрібні.", "example": "Іноді дані приходять вже очищеними (пропускаємо етап 3); іноді візуалізацію роблять ще до трансформації, щоб краще зрозуміти дані."}, {"id": "B01-M01-L02-01", "block": 1, "module": 1, "lessonNum": 2, "lessonTitle": "Інструменти, скіли та майндсет аналітика", "topic": "Числові дані vs ідентифікатори", "hw": "Модуль 1. ДЗ. Google Форма для збору структурованих даних", "type": "Помилка", "mistake": "Вважати будь-яке поле з цифрами «числовим», не помічаючи, що номер клієнта чи SKU — це ідентифікатор, з яким не можна рахувати середнє чи суму.", "correct": "Перед підрахунком середнього/суми запитайте себе: чи має сенс середнє значення цього поля? Якщо ні — це ідентифікатор, а не число для розрахунків.", "why": "Середнє по ID непомітно потрапляє у звіт і підриває довіру до всього аналізу.", "example": "«Середній номер клієнта — 5843» — безглуздо; «середня ціна товару — 450 грн» — коректно."}, {"id": "B01-M01-L02-02", "block": 1, "module": 1, "lessonNum": 2, "lessonTitle": "Інструменти, скіли та майндсет аналітика", "topic": "Порядкові дані", "hw": "Модуль 1. ДЗ. Google Форма для збору структурованих даних", "type": "Помилка", "mistake": "Обробляти рейтинг 1–5 зірок чи рівень освіти як звичайні числа й рахувати середнє, хоча відстань між рівнями нерівномірна.", "correct": "Для порядкових даних використовуйте медіану, моду або розподіл по категоріях замість середнього арифметичного.", "why": "«Середній рейтинг 3.4 зірки» звучить точно, але приховує реальний розподіл — наприклад, поляризацію на 1 і 5 зірках.", "example": "100 відгуків: 50×1 зірка і 50×5 зірок дають «середнє 3» — хоча жоден клієнт трійку не ставив."}, {"id": "B01-M01-L02-03", "block": 1, "module": 1, "lessonNum": 2, "lessonTitle": "Інструменти, скіли та майндсет аналітика", "topic": "Формат дат", "hw": "Модуль 1. ДЗ. Google Форма для збору структурованих даних", "type": "Помилка", "mistake": "Записувати дати в одній колонці по-різному (04.11.2025, 2025-11-04, 4 листопада) — програма не може їх коректно порівнювати чи сортувати.", "correct": "Приводьте всі дати в таблиці до єдиного формату (наприклад, РРРР-ММ-ДД) одразу після збору, до будь-яких розрахунків.", "why": "Різні формати в одній колонці ламають сортування, фільтри та розрахунки різниці між датами.", "example": "`04.11.2025` і `2025-11-04` — це одна й та сама дата, але Google Sheets прочитає їх по-різному, якщо формат не уніфікований."}, {"id": "B01-M02-L03-01", "block": 1, "module": 2, "lessonNum": 3, "lessonTitle": "Google Spreadsheets - перше знайомство: Джерела даних, імпорт та базові формули", "topic": "Способи імпорту даних (відкриття файлу vs IMPORTRANGE)", "hw": "Модуль 2. ДЗ. Google Spreadsheets — знайомство", "type": "Помилка", "mistake": "Плутати відкриття файлу через «Файл → Відкрити» (створює статичну копію) з IMPORTRANGE (створює живий звʼязок, що оновлюється автоматично) — і дивуватися, чому зміни в оригіналі не зʼявляються в копії.", "correct": "Перед імпортом визначте, чи потрібен разовий знімок даних, чи постійний живий звʼязок із джерелом, і обирайте метод відповідно до задачі.", "why": "Помилковий вибір методу призводить до роботи із застарілими даними без відома аналітика, що прямо впливає на правильність висновків.", "example": "Звіт «оновлюється щотижня», побудований на статичній копії, насправді показує дані на момент першого відкриття файлу, а не поточний стан."}, {"id": "B01-M02-L03-02", "block": 1, "module": 2, "lessonNum": 3, "lessonTitle": "Google Spreadsheets - перше знайомство: Джерела даних, імпорт та базові формули", "topic": "Активні фільтри та неповні висновки", "hw": "", "type": "Помилка", "mistake": "Забувати, що ввімкнений фільтр лише приховує рядки, а не видаляє їх, і робити розрахунки, не помічаючи, що частина даних прихована.", "correct": "Після завершення аналізу вимикайте фільтр («Дані → Вимкнути фільтр»); памʼятайте, що звичайні формули над діапазоном враховують приховані рядки, якщо не використана функція FILTER.", "why": "Висновок на відфільтрованих (тобто неповних) даних виглядає як загальний, хоча описує лише частину вибірки — пряма дорога до хибних рекомендацій бізнесу.", "example": "Аналітик рахує середній чек, забувши, що фільтр показує тільки замовлення з одного міста, і подає це число як «середній чек по всій компанії»."}, {"id": "B01-M02-L03-03", "block": 1, "module": 2, "lessonNum": 3, "lessonTitle": "Google Spreadsheets - перше знайомство: Джерела даних, імпорт та базові формули", "topic": "Сортування без виділення всього діапазону", "hw": "Модуль 2. ДЗ. Google Spreadsheets — знайомство", "type": "Помилка", "mistake": "Сортувати лише один виділений стовпець замість усього діапазону — рядки «розʼїжджаються», і кожен запис втрачає цілісність.", "correct": "Перед сортуванням завжди виділяйте весь діапазон даних, а не тільки стовпець, за яким сортуєте; для складніших випадків користуйтеся розширеними параметрами сортування.", "why": "Помилка непомітна одразу — таблиця виглядає нормально, але дані в ній уже перемішані неправильно, і виявити це можна лише порівнявши з оригіналом.", "example": "Відсортували тільки колонку «Сума» за спаданням — тепер найбільша сума стоїть навпроти імені зовсім іншого клієнта."}, {"id": "B01-M02-L03-04", "block": 1, "module": 2, "lessonNum": 3, "lessonTitle": "Google Spreadsheets - перше знайомство: Джерела даних, імпорт та базові формули", "topic": "Числа, імпортовані як текст", "hw": "Модуль 2. ДЗ. Google Spreadsheets — знайомство", "type": "Помилка", "mistake": "Не перевіряти формат стовпця після імпорту й намагатися рахувати SUM/AVERAGE по колонці, де числа насправді збережені як текст.", "correct": "Після будь-якого імпорту перевіряйте формат кожного стовпця через «Формат → Число»; якщо числа записані текстом — приведіть їх функцією VALUE() перед розрахунками.", "why": "Формули типу SUM ігнорують текстові значення без помилки — тому проблема непомітна: результат просто занижений, а не позначений як помилка.", "example": "У колонці «Сума» значення виглядають як 1000, 1500, але SUM() по цій колонці повертає 0, бо всі значення насправді текстові."}, {"id": "B01-M02-L04-01", "block": 1, "module": 2, "lessonNum": 4, "lessonTitle": "Google Sheets - аналіз та презентація даних", "topic": "Вибір функції агрегації під тип даних", "hw": "Модуль 2. ДЗ. Google Spreadsheets — знайомство", "type": "Помилка", "mistake": "Застосовувати AVERAGE чи SUM до категоріальних даних (наприклад, рахувати «середню категорію товару») замість COUNTA, UNIQUE чи MODE.", "correct": "Обирайте функцію агрегації відповідно до типу даних: для числових — SUM/AVERAGE/MIN/MAX, для категоріальних — COUNTA/UNIQUE/MODE.", "why": "Агрегація не за типом даних дає технічно порахований, але безглуздий результат, який неможливо інтерпретувати для бізнесу.", "example": "MODE() по колонці «Місто» коректно покаже найпопулярніше місто; AVERAGE() по цій же колонці поверне помилку або безглузде число."}, {"id": "B01-M02-L04-02", "block": 1, "module": 2, "lessonNum": 4, "lessonTitle": "Google Sheets - аналіз та презентація даних", "topic": "Кругові діаграми з великою кількістю секторів", "hw": "Модуль 2. ДЗ. Google Spreadsheets — знайомство", "type": "Помилка", "mistake": "Будувати кругову діаграму на 8–10 і більше категорій, розраховуючи, що аудиторія легко порівняє розміри секторів і кольори.", "correct": "Обмежуйте кругову діаграму 5–6 категоріями максимум; для більшої кількості груп використовуйте стовпчикову діаграму, де порівняння довжини набагато точніше, ніж кутів.", "why": "Людина погано оцінює кути на око — сектори 5% і 7% виглядають майже однаково, а перевантажена кольорами діаграма взагалі втрачає сенс.", "example": "Кругова діаграма з 12 категоріями товарів перетворюється на «різнокольорову плутанину», де неможливо визначити навіть топ-3 без підписів."}, {"id": "B01-M02-L04-03", "block": 1, "module": 2, "lessonNum": 4, "lessonTitle": "Google Sheets - аналіз та презентація даних", "topic": "Лінійний графік замість діаграми розсіювання", "hw": "", "type": "Помилка", "mistake": "Зʼєднувати точки лінією (Line Chart), коли одному значенню X відповідає багато різних значень Y — це створює візуальний тренд там, де насправді просто розкид точок.", "correct": "Використовуйте Line Chart тільки якщо кожному X відповідає одне значення Y (наприклад, час); якщо досліджуєте звʼязок між змінними на рівні окремих спостережень — беріть Scatter Plot.", "why": "Зʼєднані лінією точки психологічно сприймаються як послідовна зміна в часі, навіть якщо це просто набір незалежних спостережень — це вводить аудиторію в оману.", "example": "Залежність «тарифна ставка → відпрацьовані години» для різних співробітників — це Scatter Plot (хмара точок), а не лінія, бо на одну ставку припадає багато різних значень годин."}, {"id": "B01-M02-L04-04", "block": 1, "module": 2, "lessonNum": 4, "lessonTitle": "Google Sheets - аналіз та презентація даних", "topic": "Аналіз у широкому форматі замість довгого", "hw": "", "type": "Лайфхак", "mistake": "Намагатися будувати зведену таблицю чи графік динаміки напряму по широкій таблиці (де кожен місяць — окрема колонка) і стикатися з тим, що інструменти аналізу не бачать це як одну змінну.", "correct": "Перед побудовою зведеної таблиці чи графіка перевірте, чи не варто спочатку перевести дані з широкого формату в довгий — це той самий принцип tidy data з Модуля 1.", "why": "Більшість аналітичних інструментів (зведені таблиці, графіки, Python, SQL) розраховані на довгий формат; широкий зручний тільки для візуального перегляду людиною.", "example": "Таблиця «оцінки студента по місяцях» у 12 колонках незручна для зведеної таблиці; переведена в довгий формат (колонки «Місяць» і «Оцінка») будується за секунди."}, {"id": "B01-M03-L05-01", "block": 1, "module": 3, "lessonNum": 5, "lessonTitle": "Продуктові метрики в Google Sheets", "topic": "Адресація формул при масштабуванні розрахунків", "hw": "", "type": "Помилка", "mistake": "Копіювати формулу з умовною агрегацією (SUMIFS, COUNTUNIQUEIFS) на весь діапазон, не зафіксувавши потрібні частини адреси символом $ — посилання на канал чи місяць «зʼїжджає», і розрахунок стає неправильним.", "correct": "Перед копіюванням формули на десятки рядків і стовпців визначте, яка частина адреси має лишатися незмінною (діапазон даних, заголовок каналу чи місяця), і зафіксуйте її відповідним типом адресації — відносною, абсолютною чи змішаною.", "why": "Помилка в адресації не викликає видиму помилку формули — вона просто тихо рахує не той канал чи не той місяць, і це важко помітити без ручної перевірки кожної комірки.", "example": "Формула =COUNTUNIQUEIFS(...,$C$2:$C$2001,B$1,...) з фіксованим рядком у B$1 при копіюванні вниз і вправо коректно підставляє потрібний канал; без $ канал підставлявся б неправильно вже на другому рядку."}, {"id": "B01-M03-L05-02", "block": 1, "module": 3, "lessonNum": 5, "lessonTitle": "Продуктові метрики в Google Sheets", "topic": "Activation Rate: від якої бази рахувати", "hw": "", "type": "Помилка", "mistake": "Рахувати Activation Rate то від усіх зареєстрованих, то від усіх, хто просто прийшов у продукт, не фіксуючи, яку саме базу використовує команда — це робить показник непорівнюваним між звітами.", "correct": "Перед розрахунком уточніть і зафіксуйте письмово, яка база є знаменником Activation Rate (усі зареєстровані чи всі, хто доєднався), і використовуйте однакову логіку в усіх звітах.", "why": "Той самий продукт може показати Activation Rate і 64%, і зовсім інше число — залежно від бази, а керівництво прийматиме рішення, порівнюючи цифри, які насправді порахували по-різному.", "example": "700 активованих із 1100 зареєстрованих = 64%; ті самі 700 активованих із 1500 усіх користувачів = 47% — і обидва числа «правильні», просто відповідають на різні питання."}, {"id": "B01-M03-L05-03", "block": 1, "module": 3, "lessonNum": 5, "lessonTitle": "Продуктові метрики в Google Sheets", "topic": "ARPU vs ARPPU", "hw": "", "type": "Помилка", "mistake": "Плутати ARPU (дохід на всіх користувачів) з ARPPU (дохід тільки на платних) і використовувати їх як взаємозамінні при оцінці монетизації.", "correct": "Використовуйте ARPU, коли оцінюєте ефективність усієї бази користувачів, і ARPPU — коли оцінюєте цінність саме платного сегмента чи ефективність монетизаційної воронки.", "why": "ARPPU завжди вище за ARPU, і якщо переплутати показники в презентації для інвесторів чи керівництва, продукт виглядатиме або значно кращим, або значно гіршим, ніж є насправді.", "example": "При 1500 користувачах і 200 платних із доходом 25 000 USD: ARPU = 16,7 USD, а ARPPU = 125 USD — різниця майже у 7,5 раза."}, {"id": "B01-M03-L05-04", "block": 1, "module": 3, "lessonNum": 5, "lessonTitle": "Продуктові метрики в Google Sheets", "topic": "Що вважати «поверненням» користувача", "hw": "", "type": "Лайфхак", "mistake": "Вважати, що будь-яка повторна поява користувача в даних (навіть через пів року) — це ознака гарного Retention, без прив'язки до конкретного періоду.", "correct": "Завжди визначайте Retention відносно чіткого періоду (день 1, день 7, місяць 1) і формуйте когорти за датою першої появи — так показник стає порівнюваним між періодами й каналами.", "why": "Без чіткого періоду «Retention 20%» нічого не означає — незрозуміло, це втримання за тиждень, місяць чи взагалі за весь час існування продукту.", "example": "«7-денний Retention впав з 60% до 15%» — конкретний і дієвий інсайт; «20% користувачів колись повернулися» — цифра, з якою неможливо працювати."}, {"id": "B01-M03-L06-01", "block": 1, "module": 3, "lessonNum": 6, "lessonTitle": "Основи статистичних розрахунків у Google Sheets", "topic": "Середнє без медіани", "hw": "", "type": "Помилка", "mistake": "Наводити в звіті тільки середнє значення, не перевіряючи медіану — і пропускати сильний перекіс розподілу через кілька екстремальних значень.", "correct": "Завжди розраховуйте середнє й медіану разом: якщо вони близькі — розподіл симетричний, якщо сильно розходяться — це сигнал перекосу чи впливу викидів.", "why": "Середнє чутливе до викидів, і один-два екстремальних значення можуть суттєво змістити його, тоді як медіана лишається стійкою — без цієї пари легко зробити хибний висновок про «типового» користувача.", "example": "Середня зарплата в компанії — 45 000 грн, але медіана — 28 000 грн: кілька високих зарплат керівництва «тягнуть» середнє вгору, а типовий співробітник отримує значно менше."}, {"id": "B01-M03-L06-02", "block": 1, "module": 3, "lessonNum": 6, "lessonTitle": "Основи статистичних розрахунків у Google Sheets", "topic": "Однакове середнє — не однакові дані", "hw": "", "type": "Помилка", "mistake": "Порівнювати дві групи тільки за середнім значенням і робити висновок, що вони «однакові», не перевіряючи розкид (дисперсію, стандартне відхилення) чи форму розподілу.", "correct": "Разом із середнім завжди дивіться на стандартне відхилення, IQR і, за можливості, гістограму чи боксплот — однакове середнє може ховати абсолютно різну стабільність результатів.", "why": "Дві групи з однаковим середнім балом можуть мати геть різну однорідність: в одній усі студенти близькі до середнього, в іншій — розкид від 15 до 100 балів; для бізнес-рішення це критична різниця.", "example": "Групи А і В мають однакове середнє ≈56,7, але дисперсія групи А (441) у вісім разів більша за групу В (53) — група В набагато передбачуваніша."}, {"id": "B01-M03-L06-03", "block": 1, "module": 3, "lessonNum": 6, "lessonTitle": "Основи статистичних розрахунків у Google Sheets", "topic": "Викиди: видаляти чи досліджувати", "hw": "", "type": "Помилка", "mistake": "Автоматично видаляти всі значення, що потрапили за межі правила 1,5×IQR, вважаючи їх «поганими даними», не розбираючись у причині.", "correct": "Перед видаленням викиду зʼясуйте його природу: це помилка введення даних чи реальна, хоч і рідкісна, подія. Видаляйте лише перше, друге — досліджуйте окремо.", "why": "Викид-помилка спотворює аналіз, а викид-подія часто є найціннішим інсайтом (наприклад, VIP-клієнт чи вірусний сплеск) — сліпе видалення може прибрати саме те, що варто було б помітити.", "example": "Одне замовлення на 50 000 грн серед замовлень по 500 грн може бути або опискою в даних (500 000 замість 50 000), або реальною оптовою угодою — перевірка джерела дає різні висновки."}, {"id": "B01-M03-L06-04", "block": 1, "module": 3, "lessonNum": 6, "lessonTitle": "Основи статистичних розрахунків у Google Sheets", "topic": "Один показник розкиду замість трьох рівнів", "hw": "", "type": "Лайфхак", "mistake": "Обмежуватись тільки розмахом (min/max) для опису розкиду даних, хоча він показує лише крайні точки й нічого не каже про основну масу значень.", "correct": "Комбінуйте три рівні опису розкиду: розмах (min/max) для крайніх меж, стандартне відхилення для типового відхилення від середнього, і IQR для стійкої до викидів картини «центральних» 50% даних.", "why": "Кожен з цих показників по-своєму «бреше» наодинці: розмах перебільшує вплив однієї екстремальної точки, стандартне відхилення теж чутливе до викидів — тільки разом вони дають надійну картину.", "example": "Розмах групи А (15–100) виглядає катастрофічно, але IQR (25,75) показує, що основна маса студентів насправді зосереджена в не такому вже широкому діапазоні — крайні точки це поодинокі випадки."}, {"id": "B01-M04-L07-01", "block": 1, "module": 4, "lessonNum": 7, "lessonTitle": "Основи роботи з текстом. Обʼєднання таблиць", "topic": "Точний vs приблизний збіг у VLOOKUP", "hw": "Модуль 4. ДЗ. Текст, дати, когортний аналіз", "type": "Помилка", "mistake": "Залишати останній аргумент VLOOKUP/HLOOKUP порожнім або вказувати TRUE, розраховуючи на точний збіг, хоча TRUE вмикає пошук найближчого меншого значення у відсортованих даних.", "correct": "Завжди вказуйте четвертим аргументом FALSE (або 0) для VLOOKUP/HLOOKUP, коли шукаєте точний збіг — це майже завжди потрібно в задачах обʼєднання таблиць за ключем.", "why": "З TRUE формула не видасть помилку навіть на неправильних даних — вона просто підставить значення з іншого рядка, і помилка непомітна, поки хтось не перевірить результат вручну.", "example": "VLOOKUP(B1, A:C, 3) без четвертого аргументу шукає ID клієнта 205, якого немає в таблиці, і замість помилки підставляє дані клієнта 200 — рахунок піде не тому клієнту."}, {"id": "B01-M04-L07-02", "block": 1, "module": 4, "lessonNum": 7, "lessonTitle": "Основи роботи з текстом. Обʼєднання таблиць", "topic": "Вибір функції пошуку для змінних таблиць", "hw": "", "type": "Помилка", "mistake": "Використовувати VLOOKUP у таблицях, які часто змінюються (додаються/видаляються стовпці), хоча вона посилається на стовпець результату за порядковим номером, а не за назвою.", "correct": "Для таблиць, що активно редагуються, обирайте INDEX/MATCH або XLOOKUP — вони посилаються на діапазони, а не на номер стовпця, тому зміна структури таблиці не ламає формулу.", "why": "VLOOKUP після вставки нового стовпця в середину діапазону мовчки починає повертати дані з сусідньої, неправильної колонки — і це виявляють лише тоді, коли хтось помічає, що цифри «не сходяться».", "example": "VLOOKUP(B1,A:D,3,FALSE) поверне дохід клієнта; але якщо між стовпцями B і C вставити нову колонку «Регіон», та сама формула почне повертати вже не дохід, а регіон."}, {"id": "B01-M04-L07-03", "block": 1, "module": 4, "lessonNum": 7, "lessonTitle": "Основи роботи з текстом. Обʼєднання таблиць", "topic": "Приховані символи як причина #N/A", "hw": "Модуль 4. ДЗ. Текст, дати, когортний аналіз", "type": "Помилка", "mistake": "Намагатися звʼязати дві таблиці за текстовим ключем (email, назва, код), не помічаючи, що в одній з таблиць є зайві пробіли чи приховані символи — ключі виглядають однаково, але формула повертає #N/A.", "correct": "Перед обʼєднанням таблиць за текстовим ключем прожени обидва стовпці через TRIM (і за потреби CLEAN, LOWER), щоб прибрати невидимі розбіжності, і лише потім шукайте збіг.", "why": "Проблема невидима візуально — комірки «Ivan Petrenko» та «Ivan Petrenko » (із пробілом у кінці) виглядають ідентично, але для VLOOKUP/XLOOKUP це два різні значення.", "example": "VLOOKUP(TRIM(B2), TRIM_range, 2, FALSE) знаходить збіг там, де звичайний VLOOKUP(B2, range, 2, FALSE) повертав би #N/A через прихований пробіл в імпортованих даних."}, {"id": "B01-M04-L07-04", "block": 1, "module": 4, "lessonNum": 7, "lessonTitle": "Основи роботи з текстом. Обʼєднання таблиць", "topic": "Regex без страху", "hw": "", "type": "Лайфхак", "mistake": "Уникати regex-функцій (REGEXEXTRACT, REGEXREPLACE, REGEXMATCH) через страх перед синтаксисом і замість цього вручну перебирати текст комбінаціями LEFT/RIGHT/MID для кожного окремого випадку.", "correct": "Не обовʼязково вчити синтаксис regex напамʼять — опишіть завдання словами інструменту зі штучним інтелектом («видали все, крім цифр», «витягни домен з email») і попросіть згенерувати шаблон, а потім перевірте результат на кількох рядках.", "why": "Regex одним рядком вирішує задачі, для яких вручну знадобилося б кілька вкладених текстових функцій — це суттєво економить час на очищенні великих і неоднорідних наборів даних.", "example": "REGEXREPLACE(C2, \"\\D\", \"\") одразу залишає в номері телефону тільки цифри — ту саму задачу через SUBSTITUTE довелося б вирішувати окремо для пробілів, дужок і дефісів."}, {"id": "B01-M04-L08-01", "block": 1, "module": 4, "lessonNum": 8, "lessonTitle": "Робота з датами в Google Sheets. Когортний аналіз", "topic": "Час у даті заважає групуванню по днях", "hw": "Модуль 4. ДЗ. Текст, дати, когортний аналіз", "type": "Помилка", "mistake": "Групувати активність користувачів по днях напряму по стовпцю дата-час, не прибравши часову частину — Sheets бачить «2024-03-15 09:12» і «2024-03-15 21:47» як різні значення, хоча це один день.", "correct": "Перед групуванням по днях створіть окремий стовпець з INT(дата_час) — це відкидає дробову (часову) частину і залишає тільки цілу частину, що відповідає дню.", "why": "Без цього кроку підрахунок унікальних користувачів за день (DAU) буде завищеним або таблиця «розсиплеться» на сотні мікрогруп замість акуратних календарних днів.", "example": "INT(A2), де A2 = 2024-03-15 14:32, поверне 2024-03-15 — усі події цього дня, незалежно від точного часу, потрапляють в одну групу для підрахунку DAU."}, {"id": "B01-M04-L08-02", "block": 1, "module": 4, "lessonNum": 8, "lessonTitle": "Робота з датами в Google Sheets. Когортний аналіз", "topic": "Тип графіка для часових трендів", "hw": "", "type": "Помилка", "mistake": "Візуалізувати динаміку DAU/WAU/MAU у часі стовпчиковою діаграмою — вона задумана для порівняння категорій, а не для показу тренду.", "correct": "Для будь-якого часового ряду (DAU, WAU, MAU, дохід по днях/тижнях/місяцях) використовуйте лінійний графік — він показує напрямок руху, сезонність і аномалії, які стовпці лише ускладнюють сприймати.", "why": "На стовпчиковій діаграмі з десятками стовпців за кожен день загальний тренд губиться в шумі; лінія одразу показує, чи росте, падає чи стабільна активність.", "example": "Графік DAU за пів року з коливаннями 4-15 користувачів на день на лінійному графіку одразу читається як «стабільний тренд без росту»; та сама інформація стовпцями виглядає як хаотичний ліс без чіткого висновку."}, {"id": "B01-M04-L08-03", "block": 1, "module": 4, "lessonNum": 8, "lessonTitle": "Робота з датами в Google Sheets. Когортний аналіз", "topic": "Порівняння когорт за календарем замість періоду", "hw": "Модуль 4. ДЗ. Текст, дати, когортний аналіз", "type": "Помилка", "mistake": "Порівнювати когорти за календарною датою (наприклад, «що відбувалося в березні у всіх когорт») замість періоду життя когорти (П0, П1, П2), через що втрачається сенс когортного аналізу.", "correct": "Завжди зіставляйте когорти за однаковим періодом з моменту їхнього старту (П0 — місяць входу, П1 — наступний місяць і так далі), а не за конкретним календарним місяцем — саме тому когортна таблиця має трикутну форму.", "why": "Січнева когорта в березні — це вже третій місяць її життя (П2), а березнева когорта в березні — це нульовий місяць (П0); порівняння «навпростець» за календарем змішує геть різні стадії життєвого циклу користувача.", "example": "У трикутній таблиці немає значень для пізніх періодів пізніх когорт (наприклад, у червневої когорти немає П3) — і це нормально, а не помилка в розрахунках."}, {"id": "B01-M04-L08-04", "block": 1, "module": 4, "lessonNum": 8, "lessonTitle": "Робота з датами в Google Sheets. Когортний аналіз", "topic": "Клейкість (DAU/MAU) без контексту продукту", "hw": "", "type": "Лайфхак", "mistake": "Оцінювати DAU/MAU як «погано», якщо цифра низька (наприклад, 4-5%), не враховуючи, що для деяких категорій продуктів (страхові, банківські застосунки) низька щоденна клейкість — це очікувана норма, а не проблема.", "correct": "Перед висновком про клейкість порівнюйте DAU/MAU з бенчмарками саме для вашої категорії продукту: месенджери й соцмережі мають високу норму, страхові й банківські сервіси — низьку за самою природою використання.", "why": "Однакове число 20% DAU/MAU може бути відмінним результатом для однієї категорії продуктів і сигналом серйозної проблеми для іншої — висновок без контексту індустрії веде до неправильних пріоритетів команди.", "example": "DAU/MAU = 4% для застосунку медитації може сигналізувати про слабкий онбординг, тоді як той самий показник для страхового додатка, яким користуються кілька разів на рік, є абсолютно нормальним."}, {"id": "B01-M05-L09-01", "block": 1, "module": 5, "lessonNum": 9, "lessonTitle": "Вступ до баз даних. Основи SQL", "topic": "NOT IN зі списком, що містить NULL", "hw": "Модуль 5. ДЗ. Бази даних та основи SQL", "type": "Помилка", "mistake": "Використовувати NOT IN зі списком значень, у якому може траплятися NULL, — якщо серед значень списку є хоча б один NULL, результат порівняння стає UNKNOWN для всіх рядків, і запит не повертає жодного рядка.", "correct": "Якщо стовпець, за яким будуєте список для NOT IN, потенційно містить NULL, явно виключіть NULL з підзапиту (WHERE column IS NOT NULL) або використовуйте NOT EXISTS замість NOT IN.", "why": "Це одна з найтиповіших пасток SQL для початківців: запит виконується без помилки, але мовчки повертає порожній результат — і без розуміння причини на пошук бага можна витратити години.", "example": "WHERE department_id NOT IN (10, 20, NULL) поверне 0 рядків, навіть якщо в таблиці є департаменти, відмінні від 10 і 20 — через присутність NULL у списку."}, {"id": "B01-M05-L09-02", "block": 1, "module": 5, "lessonNum": 9, "lessonTitle": "Вступ до баз даних. Основи SQL", "topic": "Аліас у WHERE (порядок виконання запиту)", "hw": "", "type": "Помилка", "mistake": "Намагатися використати в умові WHERE аліас, який щойно створили в SELECT через AS, очікуючи, що база вже «знає» цю нову назву.", "correct": "Пам'ятайте реальний порядок виконання запиту (FROM → WHERE → SELECT → ORDER BY → LIMIT): на етапі WHERE аліаси з SELECT ще не існують, тому фільтруйте за оригінальною назвою стовпця.", "why": "Помилка «column does not exist» після спроби відфільтрувати за зручним псевдонімом — одна з перших плутанин у SQL, і вона напряму повʼязана з тим, що запит пишеться в одному порядку, а виконується в іншому.", "example": "SELECT user_age AS age FROM users WHERE age \\> 30 видасть помилку в PostgreSQL, бо на етапі WHERE стовпця «age» ще не існує — треба писати WHERE user_age \\> 30."}, {"id": "B01-M05-L09-03", "block": 1, "module": 5, "lessonNum": 9, "lessonTitle": "Вступ до баз даних. Основи SQL", "topic": "LIKE проти ILIKE", "hw": "Модуль 5. ДЗ. Бази даних та основи SQL", "type": "Помилка", "mistake": "Використовувати LIKE для пошуку тексту без урахування регістру і дивуватися, чому запит не знаходить очевидно наявні рядки.", "correct": "Для пошуку тексту, де регістр літер неважливий (імена, назви посад, email), використовуйте ILIKE замість LIKE — LIKE завжди чутливий до регістру.", "why": "Рядок «Manager» і «manager» для LIKE — це два різні значення; пропущені через це записи виглядають як «відсутні дані», хоча насправді вони просто написані з іншим регістром.", "example": "WHERE job_title LIKE '%manager%' пропустить запис «Sales MANAGER»; WHERE job_title ILIKE '%manager%' знайде обидва варіанти написання."}, {"id": "B01-M05-L09-04", "block": 1, "module": 5, "lessonNum": 9, "lessonTitle": "Вступ до баз даних. Основи SQL", "topic": "Очікування «готової» плоскої таблиці в базі", "hw": "", "type": "Лайфхак", "mistake": "Очікувати, що в реальній базі даних усі потрібні поля вже зібрані в одній зручній таблиці, як у Google Sheets, і губитися, побачивши шість повʼязаних таблиць замість однієї.", "correct": "Сприймайте нормалізовану структуру бази (users, orders, order_items, payments…) як нормальний робочий стан: задача аналітика — не «повернути» дані назад в одну таблицю руками, а впевнено зʼєднувати потрібні таблиці запитом під конкретну задачу.", "why": "Нормалізована модель існує заради цілісності даних на боці бізнесу (жодних дублікатів і суперечностей), а не для зручності аналітика — і це нормальний поділ ролей між інженером даних і аналітиком, а не недолік бази.", "example": "Замість пошуку однієї таблиці з «усім одразу» аналітик пише один запит, що обʼєднує users, orders і order_items за ключами — і отримує саме ту широку вибірку, яка потрібна для конкретного звіту."}, {"id": "B01-M05-L10-01", "block": 1, "module": 5, "lessonNum": 10, "lessonTitle": "Агрегація даних в SQL. Робота з датами і текстом", "topic": "COUNT(*) vs COUNT(стовпець)", "hw": "Модуль 5. ДЗ. Бази даних та основи SQL", "type": "Помилка", "mistake": "Використовувати COUNT(*) і COUNT(стовпець) як взаємозамінні, не помічаючи, що COUNT(*) рахує всі рядки, а COUNT(стовпець) — тільки ті, де значення не NULL.", "correct": "Обирайте варіант свідомо: COUNT(*) — коли потрібна загальна кількість рядків, COUNT(стовпець) — коли потрібна кількість заповнених значень цього поля.", "why": "Різниця між ними — це готовий сигнал про повноту даних: якщо COUNT(*) = 41, а COUNT(manager_id) = 39, то у двох працівників менеджер не призначений, і ця різниця легко губиться, якщо не розрізняти функції свідомо.", "example": "COUNT(*) FROM employees поверне 41 (усі рядки); COUNT(manager_id) FROM employees поверне 39, бо в двох рядках це поле NULL."}, {"id": "B01-M05-L10-02", "block": 1, "module": 5, "lessonNum": 10, "lessonTitle": "Агрегація даних в SQL. Робота з датами і текстом", "topic": "Цілочисельне ділення в PostgreSQL", "hw": "", "type": "Помилка", "mistake": "Ділити два цілочисельних (INTEGER) стовпці й дивуватися, чому результат — ціле число без десяткових знаків, замість очікуваного дробового значення (наприклад, конверсії чи середнього чека).", "correct": "Перед діленням цілих чисел, де потрібна точність, приведіть хоча б одне зі значень до NUMERIC через CAST або ::numeric — тоді результат збереже дробову частину.", "why": "PostgreSQL за замовчуванням ділить два INTEGER як ціле число, обрізаючи дробову частину без попередження чи помилки — метрика на кшталт конверсії чи середнього чека може вийти грубо неправильною.", "example": "SELECT 7/2 поверне 3, а не 3.5; SELECT 7::numeric/2 поверне коректні 3.5 — саме друга формула потрібна для розрахунку відсотків чи середніх показників."}, {"id": "B01-M05-L10-03", "block": 1, "module": 5, "lessonNum": 10, "lessonTitle": "Агрегація даних в SQL. Робота з датами і текстом", "topic": "WHERE замість HAVING для агрегованих значень", "hw": "Модуль 5. ДЗ. Бази даних та основи SQL", "type": "Помилка", "mistake": "Намагатися відфільтрувати результат за агрегованим значенням (наприклад, «залиш тільки відділи із середньою зарплатою вище 5000») через WHERE, отримуючи помилку про невідому функцію в WHERE.", "correct": "Фільтруйте рядки до агрегації через WHERE, а результати вже згрупованих і порахованих даних — через HAVING; HAVING виконується після GROUP BY, коли агрегатні значення вже обчислені.", "why": "На етапі WHERE агрегатне значення (наприклад, середня зарплата по групі) фізично ще не існує — воно зʼявляється лише в результаті GROUP BY, тому SQL не дозволяє звертатися до нього раніше.", "example": "SELECT department_id, AVG(salary) AS avg_salary FROM employees GROUP BY department_id HAVING AVG(salary) \\> 5000 — правильно; той самий фільтр у WHERE AVG(salary) \\> 5000 поверне помилку."}, {"id": "B01-M05-L10-04", "block": 1, "module": 5, "lessonNum": 10, "lessonTitle": "Агрегація даних в SQL. Робота з датами і текстом", "topic": "Порівняння з NULL через «=»", "hw": "", "type": "Помилка", "mistake": "Писати WHERE column = NULL (або \\<\\> NULL), очікуючи знайти чи виключити порожні значення, — цей вираз завжди повертає UNKNOWN і жодного рядка.", "correct": "Для перевірки на відсутність або наявність значення завжди використовуйте IS NULL / IS NOT NULL — це єдиний коректний спосіб працювати з NULL у SQL.", "why": "NULL означає «невідомо», а не конкретне значення, тому звичайні оператори порівняння (=, \\<\\>) з ним не працюють за визначенням тризначної логіки SQL — запит не впаде з помилкою, а просто мовчки поверне порожній результат.", "example": "WHERE manager_id = NULL ніколи не знайде жодного рядка, навіть якщо в таблиці є працівники без менеджера; правильний варіант — WHERE manager_id IS NULL."}, {"id": "B01-M06-L11-01", "block": 1, "module": 6, "lessonNum": 11, "lessonTitle": "Підзапити та тимчасові таблиці. Представлення в PostgreSQL", "topic": "Аліаси підзапитів", "hw": "", "type": "Помилка", "mistake": "Забувати присвоювати аліас підзапиту в секції FROM або, навпаки, додавати зайвий аліас підзапиту в WHERE, де він не потрібен.", "correct": "Завжди присвоюйте аліас підзапиту у FROM (SELECT * FROM (...) AS sub), а в WHERE використовуйте підзапит без аліасу, бо він повертає лише значення для порівняння, а не окрему таблицю.", "why": "PostgreSQL вимагає імені для похідної таблиці у FROM — без нього запит просто не виконається, і початківці витрачають час на пошук незрозумілої синтаксичної помилки.", "example": "SELECT * FROM (SELECT department_id, COUNT(*) FROM employees GROUP BY department_id) AS dept_counts;"}, {"id": "B01-M06-L11-02", "block": 1, "module": 6, "lessonNum": 11, "lessonTitle": "Підзапити та тимчасові таблиці. Представлення в PostgreSQL", "topic": "HAVING vs WHERE з підзапитом", "hw": "", "type": "Помилка", "mistake": "Намагатися відфільтрувати рядки за результатом агрегатної функції прямо в WHERE (наприклад WHERE SUM(amount) \\> 1000).", "correct": "Використовуйте HAVING для фільтрації після групування або підзапит/CTE, який спочатку обчислює агрегат, а потім фільтрує зовнішній запит за цим значенням.", "why": "WHERE виконується до групування даних, тому база ще не має агрегованого значення на цьому етапі — запит завершиться помилкою, а не просто дасть неправильний результат.", "example": "SELECT department_id FROM employees GROUP BY department_id HAVING SUM(salary) \\> 100000;"}, {"id": "B01-M06-L11-03", "block": 1, "module": 6, "lessonNum": 11, "lessonTitle": "Підзапити та тимчасові таблиці. Представлення в PostgreSQL", "topic": "CTE замість вкладених підзапитів", "hw": "", "type": "Лайфхак", "mistake": "Будувати запит із кількома підзапитами, вкладеними один в інший, через що логіку складно читати й налагоджувати.", "correct": "Виносьте кожен проміжний крок обчислень в окремий CTE (WITH ... AS), щоб запит читався як послідовність кроків зверху вниз, а не як вкладена структура.", "why": "Запит із іменованими кроками легше перевіряти частинами, передавати колегам і виправляти за кілька місяців, коли деталі вже забулися.", "example": "WITH high_value AS  (SELECT customer_id, SUM(amount) AS total FROM orders GROUP BY customer_id)  SELECT * FROM high_value WHERE total \\> 500;"}, {"id": "B01-M06-L11-04", "block": 1, "module": 6, "lessonNum": 11, "lessonTitle": "Підзапити та тимчасові таблиці. Представлення в PostgreSQL", "topic": "Матеріалізовані представлення", "hw": "", "type": "Помилка", "mistake": "Сприймати матеріалізоване представлення (MATERIALIZED VIEW) як завжди актуальні дані, так само як звичайне представлення (VIEW).", "correct": "Пам'ятайте, що MATERIALIZED VIEW зберігає знімок даних на момент створення й потребує ручного REFRESH MATERIALIZED VIEW для оновлення, тоді як звичайний VIEW виконує запит наживо щоразу.", "why": "Якщо покластися на застарілий знімок як на актуальні дані, звіт чи дашборд покаже неправильні цифри, і це важко помітити без розуміння різниці.", "example": "REFRESH MATERIALIZED VIEW sales_summary;"}, {"id": "B01-M06-L12-01", "block": 1, "module": 6, "lessonNum": 12, "lessonTitle": "Обʼєднання таблиць. Види обʼєднань. Процедури та функції в PostgreSQL", "topic": "Вибір типу JOIN", "hw": "Завдання 5 (JOIN-запити)", "type": "Помилка", "mistake": "Автоматично використовувати INNER JOIN «за замовчуванням», навіть коли потрібно зберегти всі рядки з однієї з таблиць.", "correct": "Перед написанням запиту визначте, чи можна втратити рядки без відповідності: якщо треба зберегти всі рядки лівої таблиці (наприклад, усі відділи, навіть без співробітників), використовуйте LEFT JOIN, а не INNER JOIN.", "why": "INNER JOIN мовчки прибирає рядки без пари, і аналітик може не помітити, що ціла категорія даних (наприклад, цілий відділ) зникла зі звіту.", "example": "SELECT d.department_name, e.first_name FROM departments d LEFT JOIN employees e ON d.department_id = e.department_id;"}, {"id": "B01-M06-L12-02", "block": 1, "module": 6, "lessonNum": 12, "lessonTitle": "Обʼєднання таблиць. Види обʼєднань. Процедури та функції в PostgreSQL", "topic": "Унікальність ключа JOIN", "hw": "Завдання 5 (JOIN-запити)", "type": "Помилка", "mistake": "Не перевіряти унікальність ключа з'єднання перед JOIN, через що кількість рядків у результаті несподівано зростає — кожен рядок лівої таблиці розмножується на кожен збіг у правій.", "correct": "Перед JOIN перевірте, чи ключове поле унікальне в обох таблицях (порівняйте COUNT(*) і COUNT(DISTINCT key)); якщо ні — врахуйте, що результат матиме більше рядків, ніж вихідні таблиці, і скоригуйте агрегацію після з'єднання.", "why": "Непомічене розмноження рядків спотворює суми, середні значення та інші розрахунки в усіх подальших кроках аналізу.", "example": "SELECT COUNT(*), COUNT(DISTINCT employee_id) FROM employees_lastname;"}, {"id": "B01-M06-L12-03", "block": 1, "module": 6, "lessonNum": 12, "lessonTitle": "Обʼєднання таблиць. Види обʼєднань. Процедури та функції в PostgreSQL", "topic": "DDL vs DML, ризики команд", "hw": "Завдання 3, 4, 6 (UPDATE, DELETE, DROP TABLE)", "type": "Помилка", "mistake": "Недооцінювати різницю між командами, що змінюють структуру таблиці (DDL: DROP, TRUNCATE, ALTER), і командами, що змінюють лише дані (DML: DELETE, UPDATE) — зокрема запускати DELETE або UPDATE без умови WHERE.", "correct": "Перед виконанням DELETE або UPDATE спочатку перевірте ту саму умову через SELECT, а DDL-команди (DROP, TRUNCATE) застосовуйте лише в тестових середовищах чи на тимчасових таблицях.", "why": "DELETE без WHERE видаляє всі рядки, а DROP чи TRUNCATE незворотно знищують структуру або дані — без попередньої перевірки помилку неможливо швидко виправити.", "example": "SELECT * FROM employees WHERE employee_id = 5;   \\-- перевірка перед DELETE FROM employees WHERE employee_id = 5;"}, {"id": "B01-M06-L12-04", "block": 1, "module": 6, "lessonNum": 12, "lessonTitle": "Обʼєднання таблиць. Види обʼєднань. Процедури та функції в PostgreSQL", "topic": "Функції vs процедури", "hw": "", "type": "Лайфхак", "mistake": "Намагатися викликати процедуру (PROCEDURE) всередині SELECT так само, як функцію, або самостійно писати складну логіку замість того, щоб скористатися готовою функцією компанії.", "correct": "Пам'ятайте, що процедура не повертає значення й викликається через CALL, а не в SELECT; для готових розрахунків (метрики, скоринг, нормалізація) використовуйте вже наявні функції компанії, а створення нових функцій і процедур залишайте інженерам.", "why": "Плутанина між функцією і процедурою призводить до синтаксичних помилок, а самостійне дублювання бізнес-логіки замість виклику готової функції — до розбіжностей у розрахунках між командами.", "example": "CALL refresh_sales_summary();  \\-- процедура викликається через CALL, а не в SELECT"}, {"id": "B01-M07-L13-01", "block": 1, "module": 7, "lessonNum": 13, "lessonTitle": "Вступ до Google BigQuery. Робота з масивами та структурами", "topic": "Партиціювання і вартість запиту", "hw": "Завдання 8 (робота з партиціями через _TABLE_SUFFIX)", "type": "Помилка", "mistake": "Писати запит до партиційованої таблиці (наприклад `ga_sessions_*`) без умови `WHERE _TABLE_SUFFIX BETWEEN ...`, через що BigQuery сканує геть усі партиції.", "correct": "Завжди додавайте фільтр за полем партиціювання (`_TABLE_SUFFIX` або поле типу DATE/TIMESTAMP), навіть коли здається, що потрібні дані «за весь час», — краще явно вказати діапазон.", "why": "BigQuery тарифікує запити за обсягом прочитаних даних, тому запит без фільтра партиції може прочитати терабайти замість кількох гігабайтів і коштувати в сотні разів дорожче.", "example": "SELECT COUNT(*) FROM `dataset.ga_sessions_*` WHERE _TABLE_SUFFIX BETWEEN '20170801' AND '20170807';"}, {"id": "B01-M07-L13-02", "block": 1, "module": 7, "lessonNum": 13, "lessonTitle": "Вступ до Google BigQuery. Робота з масивами та структурами", "topic": "NULLABLE vs REPEATED поля", "hw": "Завдання 1–3 (перегляд REPEATED-полів, розгортання event_params)", "type": "Помилка", "mistake": "Намагатися звернутися до REPEATED-поля (масиву, наприклад `hits` чи `items`) напряму через крапку, як до звичайного NULLABLE STRUCT, що спричиняє помилку запиту.", "correct": "Перед зверненням до поля перевіряйте його Mode у схемі таблиці: NULLABLE STRUCT — звертайтесь одразу через крапку (`device.browser`), а REPEATED — спершу розгорніть через `UNNEST(...) AS h`, і лише потім звертайтесь через аліас.", "why": "BigQuery не дозволяє звертатися до елементів масиву без розгортання, і без розуміння різниці Mode аналітик витрачає час на пошук синтаксичної помилки замість аналізу даних.", "example": "SELECT h.type FROM `dataset.ga_sessions_20170801`, UNNEST(hits) AS h;"}, {"id": "B01-M07-L13-03", "block": 1, "module": 7, "lessonNum": 13, "lessonTitle": "Вступ до Google BigQuery. Робота з масивами та структурами", "topic": "Вкладені STRUCT/ARRAY замість JOIN", "hw": "Завдання 5, 6 (розгортання items, зведена таблиця по товарах)", "type": "Лайфхак", "mistake": "За звичкою намагатися «розкласти» вкладені STRUCT і ARRAY в окремі таблиці й з'єднувати їх через JOIN, як у реляційній базі, замість використання крапкової нотації та UNNEST.", "correct": "Залишайте дані у природному вкладеному вигляді (STRUCT/ARRAY) і звертайтесь до них через крапку або UNNEST — це замінює цілі ланцюжки JOIN і працює швидше завдяки колонковому зберіганню.", "why": "BigQuery спеціально спроєктований для вкладених структур; зайва нормалізація не пришвидшує запити, а лише ускладнює код і не дає скористатися перевагами колонкового читання.", "example": "SELECT fullVisitorId, h.page.pageTitle FROM `dataset.ga_sessions_20170801`, UNNEST(hits) AS h;"}, {"id": "B01-M07-L13-04", "block": 1, "module": 7, "lessonNum": 13, "lessonTitle": "Вступ до Google BigQuery. Робота з масивами та структурами", "topic": "Розмноження рядків після UNNEST", "hw": "Завдання 4 (аналіз частоти параметрів подій)", "type": "Помилка", "mistake": "Рахувати COUNT(*) чи інші агрегати одразу після UNNEST масиву, забуваючи, що кожна сесія тепер повторюється по одному рядку на кожну подію, тому результат більше не відповідає кількості сесій.", "correct": "Чітко розділяйте рівень аналізу: до UNNEST рядок = сесія, після UNNEST рядок = подія; якщо потрібна кількість сесій чи користувачів, рахуйте COUNT(DISTINCT fullVisitorId) або агрегуйте до UNNEST.", "why": "Сплутування рівня деталізації після розгортання масиву — одна з найпоширеніших причин завищених метрик у звітах на основі подієвих даних.", "example": "SELECT COUNT(DISTINCT fullVisitorId) FROM `dataset.ga_sessions_20170801`, UNNEST(hits) AS h WHERE h.type = 'PAGE';"}, {"id": "B01-M07-L14-01", "block": 1, "module": 7, "lessonNum": 14, "lessonTitle": "Віконні функції. Робота з даними Google Analytics", "topic": "Віконні функції у WHERE", "hw": "Завдання 10 (нумерація подій у сесії, ROW_NUMBER)", "type": "Помилка", "mistake": "Намагатися відфільтрувати результат віконної функції прямо в WHERE (наприклад WHERE ROW_NUMBER() OVER (...) = 1).", "correct": "Винесіть віконну функцію в підзапит або CTE, а фільтрацію за її результатом робіть у зовнішньому WHERE, застосованому вже до обчисленої колонки.", "why": "Віконні функції обчислюються на етапі SELECT, вже після WHERE, тому база даних ще не має цього значення на момент фільтрації — запит просто завершиться помилкою.", "example": "WITH ranked AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY event_time) AS rn FROM events) SELECT * FROM ranked WHERE rn = 1;"}, {"id": "B01-M07-L14-02", "block": 1, "module": 7, "lessonNum": 14, "lessonTitle": "Віконні функції. Робота з даними Google Analytics", "topic": "RANK vs ROW_NUMBER vs DENSE_RANK", "hw": "Завдання 9 (ранжування користувачів за витратами)", "type": "Помилка", "mistake": "Плутати RANK(), DENSE_RANK() і ROW_NUMBER(), обираючи функцію навмання, через що результат топ-N не збігається з очікуваннями (дублікати місць чи пропущені ранги).", "correct": "Обирайте функцію свідомо: ROW_NUMBER — коли потрібна гарантована унікальна кількість рядків (точно топ-10); RANK — коли однакові значення ділять місце з пропуском наступного рангу; DENSE_RANK — коли ранги мають йти без пропусків.", "why": "Неправильний вибір функції призводить до неправильної кількості рядків у топ-N вибірках або спотвореної системи рівнів чи рейтингів.", "example": "ROW_NUMBER() OVER (ORDER BY revenue DESC) AS rn,  RANK() OVER (ORDER BY revenue DESC) AS rk,  DENSE_RANK() OVER (ORDER BY revenue DESC) AS drk;"}, {"id": "B01-M07-L14-03", "block": 1, "module": 7, "lessonNum": 14, "lessonTitle": "Віконні функції. Робота з даними Google Analytics", "topic": "LAST_VALUE без рамки", "hw": "", "type": "Помилка", "mistake": "Використовувати LAST_VALUE() з ORDER BY, але без явної рамки ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING, очікуючи отримати останнє значення у всьому вікні.", "correct": "Завжди явно вказуйте рамку ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING для LAST_VALUE (і за потреби для FIRST_VALUE/NTH_VALUE), якщо хочете охопити все вікно, а не лише рядки до поточного.", "why": "За замовчуванням при наявності ORDER BY рамка обмежується «від початку до поточного рядка», тому без явної рамки LAST_VALUE фактично повертає значення поточного рядка, а не очікуваний глобальний максимум чи мінімум.", "example": "LAST_VALUE(value) OVER (ORDER BY date ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING);"}, {"id": "B01-M07-L14-04", "block": 1, "module": 7, "lessonNum": 14, "lessonTitle": "Віконні функції. Робота з даними Google Analytics", "topic": "CASE WHEN vs віконна функція", "hw": "", "type": "Лайфхак", "mistake": "Намагатися вирішити задачу ранжування чи порівняння з групою через громіздкий CASE WHEN або кілька підзапитів, коли для цього достатньо однієї віконної функції.", "correct": "Якщо для розрахунку потрібна інформація з інших рядків (порівняння, ранжування, накопичення) — використовуйте віконну функцію; CASE WHEN залишайте для рішень на основі значень лише поточного рядка.", "why": "Правильний вибір інструменту економить рядки коду, пришвидшує виконання запиту і робить його зрозумілішим для колег, які перевірятимуть логіку.", "example": "PERCENT_RANK() OVER (ORDER BY conversion_rate) замість ручного обчислення частки через кілька CTE."}]
;

const BLOCKS = [

  {id:2, title:"Блок 2 · BI та візуалізація", modules:[8,9,10,11,12,13,14,15], enabled:false},
  {id:3, title:"Блок 3 · Python та статистика", modules:[16,17,18,19], enabled:false},
];

const MODULE_TITLES = {
  1:"Основи Data Analytics",
  2:"Google Sheets для аналітика",
  3:"Продуктові метрики та статистика",
  4:"Робота з текстом, датами і таблицями",
  5:"Бази даних та основи SQL",
  6:"Маніпуляції з даними в PostgreSQL",
  7:"BigQuery та віконні функції",
  8:"BI-інструменти. Looker Studio",
  9:"Основи Power BI",
  10:"Візуалізації в Power BI",
  11:"DAX у Power BI",
  12:"Вбудована аналітика Power BI",
  13:"Основи Tableau",
  14:"Tableau — просунутий рівень",
  15:"Розширена візуалізація та Amplitude",
  16:"Основи Python",
  17:"Pandas. Робота з даними",
  18:"Просунутий Python та візуалізація",
  19:"Статистика та A/B-тестування",
};

let state = {
  block: 1,
  module: 1,
  search: "",
  type: "all",
};

function escapeHtml(str){
  return (str || "").replace(/[&<>"']/g, s => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[s]));
}

function highlight(text){
  return escapeHtml(text);
}

function renderBlockNav(){
  const nav = document.getElementById("blockNav");
  nav.innerHTML = "";
  BLOCKS.forEach(b => {
    const btn = document.createElement("button");
    btn.className = "block-btn" + (b.id === state.block ? " active" : "");
    btn.disabled = !b.enabled;
    btn.innerHTML = b.title + (b.enabled ? "" : '<span class="soon">незабаром</span>');
    if (b.enabled){
      btn.addEventListener("click", () => {
        state.block = b.id;
        state.module = b.modules[0];
        renderAll();
      });
    }
    nav.appendChild(btn);
  });
}

function renderModuleNav(){
  const nav = document.getElementById("moduleNav");
  nav.innerHTML = "";
  const block = BLOCKS.find(b => b.id === state.block);
  block.modules.forEach(m => {
    const hasData = DATA.some(r => r.module === m);
    const btn = document.createElement("button");
    btn.className = "module-item" + (m === state.module ? " active" : "");
    btn.disabled = !hasData;
    btn.innerHTML = '<span><span class="n">Модуль ' + m + '</span></span>' +
      (hasData ? '' : '<span class="soon-dot">незабаром</span>');
    if (hasData){
      btn.title = MODULE_TITLES[m] || "";
      btn.addEventListener("click", () => {
        state.module = m;
        renderAll();
      });
    }
    nav.appendChild(btn);
  });
}

function renderModuleHeading(){
  const el = document.getElementById("moduleHeading");
  const title = MODULE_TITLES[state.module] || "";
  el.innerHTML =
    '<h1 class="module-heading">Модуль ' + state.module + '. ' + escapeHtml(title) + '</h1>' +
    '<div class="module-heading-sub">Блок ' + state.block + ' · рекомендації відсортовано по уроках</div>';
}

function matchesFilter(rec){
  if (state.type !== "all" && rec.type !== state.type) return false;
  if (state.search){
    const q = state.search.toLowerCase();
    const hay = [rec.topic, rec.mistake, rec.correct, rec.why, rec.example, rec.hw]
      .join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function renderCards(){
  const container = document.getElementById("lessonsContainer");
  container.innerHTML = "";

  const moduleRecords = DATA.filter(r => r.module === state.module);
  const lessonNums = [...new Set(moduleRecords.map(r => r.lessonNum))].sort((a,b)=>a-b);

  let totalShown = 0;

  lessonNums.forEach(ln => {
    const lessonRecs = moduleRecords.filter(r => r.lessonNum === ln);
    const visible = lessonRecs.filter(matchesFilter);
    if (visible.length === 0) return;
    totalShown += visible.length;

    const lessonTitle = lessonRecs[0].lessonTitle;
    const block = document.createElement("div");
    block.className = "lesson-block";
    block.innerHTML = '<h2><span class="lesson-num">Урок ' + ln + '.</span> ' + escapeHtml(lessonTitle) + '</h2>';

    const cardsWrap = document.createElement("div");
    cardsWrap.className = "cards";

    visible.forEach(rec => {
      const isError = rec.type === "Помилка";
      const typeMarker = isError ? "●" : "★";
      const typeLabel = isError ? "Помилка" : "Лайфхак";
      const badgeClass = isError ? "type-error" : "type-lifehack";

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-head">
          <div>
            <div class="card-topic">${escapeHtml(rec.topic)}</div>
            <div class="card-id">${escapeHtml(rec.id)}</div>
          </div>
          <div class="badges">
            <span class="badge ${badgeClass}">${typeMarker} ${typeLabel}</span>
            ${rec.hw ? `<span class="badge hw">ДЗ: ${escapeHtml(rec.hw)}</span>` : ""}
          </div>
        </div>
        <div class="field">
          <div class="field-label"><span class="marker">${typeMarker}</span> ${isError ? "Типова помилка" : "Про що це"}</div>
          <div class="field-text">${highlight(rec.mistake)}</div>
        </div>
        <div class="field">
          <div class="field-label"><span class="marker">✓</span> Як правильно</div>
          <div class="field-text">${highlight(rec.correct)}</div>
        </div>
        <div class="field">
          <div class="field-label"><span class="marker">◆</span> Чому це важливо</div>
          <div class="field-text">${highlight(rec.why)}</div>
        </div>
        <div class="field">
          <div class="field-label"><span class="marker">▶</span> Приклад</div>
          <div class="field-text example">${escapeHtml(rec.example)}</div>
        </div>
      `;
      cardsWrap.appendChild(card);
    });

    block.appendChild(cardsWrap);
    container.appendChild(block);
  });

  document.getElementById("resultCount").textContent = totalShown + " з " + moduleRecords.length + " порад";

  if (totalShown === 0){
    container.innerHTML = '<div class="empty-state">Нічого не знайдено за цим фільтром.</div>';
  }
}

function renderAll(){
  renderBlockNav();
  renderModuleNav();
  renderModuleHeading();
  renderCards();
}

document.getElementById("searchInput").addEventListener("input", (e) => {
  state.search = e.target.value.trim();
  renderCards();
});
document.getElementById("typeFilter").addEventListener("change", (e) => {
  state.type = e.target.value;
  renderCards();
});

renderAll();
</script>

</body>
</html>
